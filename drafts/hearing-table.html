<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unwriting Her Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IM+Fell+English:ital@0;1&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Reenie+Beanie&family=Spectral:ital,wght@0,300;0,400;1,300;1,400&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}

/* Layout: one full-screen scene at a time. The book's words live on paper you pick up from the table;
   the table, the candle and the stamps are how you act on them. A single candlelit look, chosen on purpose. */
:root {
  --night: #0f0c0a;        /* the room */
  --oak: #241913;          /* the table */
  --vellum: #ebe2d1;       /* light text on dark */
  --faded: #ab9f88;
  --dim: #7d725f;
  --tallow: #dcae67;       /* candlelight, marks, focus */
  --glass: #aac3db;        /* the reader's own hand, and mirrors */
  --wax: #b8473a;          /* seals, stamps, strike-throughs */
  --paper: #e8dfca;        /* letters */
  --paper-2: #f2ebdb;      /* typed slips */
  --ink: #2a211a;          /* writing on paper */
  --ink-soft: #6b5d48;

  --f-display: 'IM Fell English', 'Iowan Old Style', Georgia, serif;
  --f-text: 'Old Standard TT', 'Bodoni 72', Georgia, serif;
  --f-voice: 'Spectral', Georgia, serif;
  --f-label: 'Courier Prime', 'Courier New', monospace;
  --f-hand: 'Reenie Beanie', 'Bradley Hand', 'Segoe Print', cursive;

  --noise: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32 0 0 0 0 .26 0 0 0 0 .18 0 0 0 .2 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.012 .32' numOctaves='3' seed='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .05 0 0 0 0 .03 0 0 0 0 .02 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>");
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { background: var(--night); }
body { margin: 0; background: var(--night); color: var(--vellum); font-family: var(--f-voice); font-size: 16px; line-height: 1.6; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--tallow); outline-offset: 3px; }
em { font-style: italic; }
#app { position: relative; height: 100%; overflow: hidden; }

/* ------------------------------------------------ heads-up labels, as in a film slate */
.hud { position: absolute; z-index: 30; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding-block: 0.9rem; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud-l, .hud-r { font-family: var(--f-label); font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faded); text-shadow: 0 1px 2px #000; }
.hud-r { display: flex; gap: 1rem; align-items: center; font-variant-numeric: tabular-nums; }
.hud-btn { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--dim); }
.hud-btn:hover { color: var(--tallow); }
.hint { position: absolute; z-index: 30; left: 50%; bottom: max(14px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: max-content; max-width: calc(100% - 36px); text-align: center; font-family: var(--f-hand); font-size: clamp(1.35rem, 2.6vw, 1.7rem); line-height: 1.1; color: var(--tallow); text-shadow: 0 1px 3px #000; pointer-events: none; transition: opacity .5s; }
.hint.fresh { animation: hintIn 1.2s ease both; }
@keyframes hintIn { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* ------------------------------------------------ surfaces */
.tabletop { position: absolute; inset: 0; overflow: hidden;
  background:
    radial-gradient(ellipse 60% 55% at 50% 42%, rgba(220, 174, 103, 0.16), transparent 70%),
    var(--grain),
    linear-gradient(180deg, #2c1f16 0%, #22170f 55%, #170f0a 100%);
  background-size: auto, 600px 600px, auto; }
.tabletop::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 80% 75% at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.75) 100%); }
.paper { background-color: var(--paper); background-image: var(--noise), linear-gradient(170deg, rgba(255, 255, 255, 0.25), rgba(120, 95, 60, 0.12)); color: var(--ink); }

/* ------------------------------------------------ objects on the table */
.obj { position: absolute; left: var(--x); top: var(--y); transform: translate(-50%, -50%) rotate(var(--r, 0deg)); transition: transform .35s cubic-bezier(.2, .7, .2, 1), filter .35s, opacity .35s; }
@media (max-aspect-ratio: 1/1) { .obj { left: var(--px, var(--x)); top: var(--py, var(--y)); transform: translate(-50%, -50%) rotate(var(--pr, var(--r, 0deg))); } }
.obj.live { cursor: pointer; }
.obj.live:hover, .obj.live:focus-visible { transform: translate(-50%, -54%) rotate(var(--r, 0deg)) scale(1.04); filter: drop-shadow(0 0 18px rgba(220, 174, 103, 0.35)); }
@media (max-aspect-ratio: 1/1) { .obj.live:hover, .obj.live:focus-visible { transform: translate(-50%, -54%) rotate(var(--pr, var(--r, 0deg))) scale(1.04); } }
.obj.dead { opacity: 0.38; filter: grayscale(0.6); cursor: not-allowed; }
.obj.beckon::after { content: ""; position: absolute; inset: -14px; border-radius: 12px; box-shadow: 0 0 0 1px rgba(220, 174, 103, 0.45), 0 0 28px rgba(220, 174, 103, 0.35); animation: beckon 2.4s ease-in-out infinite; pointer-events: none; }
@keyframes beckon { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
.tag { position: absolute; left: 50%; top: calc(100% + 8px); transform: translateX(-50%); white-space: nowrap; font-family: var(--f-hand); font-size: 1.35rem; line-height: 1; color: var(--tallow); text-shadow: 0 1px 2px #000; pointer-events: none; }

/* envelopes */
.env { width: clamp(132px, 15vw, 196px); aspect-ratio: 1.55; perspective: 700px; }
@media (max-aspect-ratio: 1/1) { .env { width: clamp(128px, 38vw, 176px); } }
.env-body { position: absolute; inset: 0; border-radius: 3px; box-shadow: 0 14px 22px -6px rgba(0, 0, 0, 0.7), 0 2px 3px rgba(0, 0, 0, 0.5); overflow: hidden; }
.env-body::before { content: ""; position: absolute; inset: 0; background: linear-gradient(155deg, transparent 49.6%, rgba(90, 70, 45, 0.28) 50%, transparent 50.6%), linear-gradient(25deg, transparent 49.6%, rgba(90, 70, 45, 0.28) 50%, transparent 50.6%); }
.env-flap { position: absolute; left: 0; right: 0; top: 0; height: 62%; transform-origin: top; transition: transform .6s cubic-bezier(.4, 0, .2, 1); clip-path: polygon(0 0, 100% 0, 50% 100%); background-color: #d6c8aa; background-image: var(--noise), linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(80, 60, 40, 0.18)); filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.3)); z-index: 2; }
.env.open .env-flap { transform: rotateX(180deg); }
.env-peek { position: absolute; left: 9%; right: 9%; top: 6%; height: 70%; border-radius: 2px; box-shadow: 0 -2px 6px rgba(0, 0, 0, 0.25); transform: translateY(0); transition: transform .6s .2s cubic-bezier(.2, .7, .2, 1); z-index: 1; }
.env-peek::after { content: ""; position: absolute; left: 14%; right: 14%; top: 18%; height: 40%; background: repeating-linear-gradient(180deg, rgba(42, 33, 26, 0.35) 0 1px, transparent 1px 7px); }
.env.open .env-peek { transform: translateY(-34%); }
.env-front { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.env-name { position: absolute; left: 10%; bottom: 13%; font-family: var(--f-hand); font-size: clamp(1.2rem, 1.7vw, 1.5rem); line-height: 1; color: #2b2520; }
.env-rel { position: absolute; left: 10%; bottom: 5%; font-family: var(--f-label); font-size: 0.56rem; letter-spacing: 0.12em; text-transform: uppercase; color: #6b5d48; }
.seal { position: absolute; left: 50%; top: 56%; width: 23%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50% 46% 52% 48%; background: radial-gradient(circle at 38% 34%, #d0685a, #8e2a22 45%, #5a1712 100%); box-shadow: 0 2px 3px rgba(0, 0, 0, 0.5), inset 0 0 0 3px rgba(0, 0, 0, 0.12); display: grid; place-items: center; font-family: var(--f-display); font-size: clamp(0.9rem, 1.3vw, 1.2rem); color: rgba(40, 8, 6, 0.75); text-shadow: 0 1px 0 rgba(255, 180, 160, 0.3); z-index: 4; transition: transform .5s, opacity .5s .3s; }
.env.night .seal { background: radial-gradient(circle at 38% 34%, #5a5650, #23201d 50%, #0e0c0b 100%); color: rgba(200, 190, 170, 0.5); }
.env.open .seal { transform: translate(-50%, -150%) rotate(-25deg) scale(0.8); opacity: 0; }
.env-stamp { position: absolute; z-index: 5; right: 6%; top: 10%; padding: 0.1rem 0.4rem; border: 2px solid var(--wax); color: var(--wax); font-family: var(--f-label); font-weight: 700; font-size: 0.66rem; letter-spacing: 0.14em; transform: rotate(-9deg); opacity: 0.85; mix-blend-mode: multiply; }
.env-note { position: absolute; z-index: 5; right: 7%; top: 8%; font-family: var(--f-hand); font-size: 1.2rem; color: #3d5a78; transform: rotate(4deg); }

/* the judge's candle */
.candle { width: 54px; height: 190px; }
.candle .stick { position: absolute; left: 50%; bottom: 16px; width: 26px; height: calc(var(--h, 1) * 120px + 8px); transform: translateX(-50%); border-radius: 4px 4px 2px 2px; background: linear-gradient(90deg, #cfc2a6, #efe6d2 40%, #bdb096); transition: height 1.2s ease; }
.candle .stick::before { content: ""; position: absolute; left: 4px; top: -2px; width: 7px; height: 22px; border-radius: 0 0 4px 4px; background: #e6dcc6; }
.candle .dish { position: absolute; left: 50%; bottom: 4px; width: 62px; height: 16px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(ellipse at 50% 30%, #8d7a5a, #4a3d2c 70%); box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6); }
.candle .flame { position: absolute; left: 50%; bottom: calc(16px + var(--h, 1) * 120px + 10px); width: 13px; height: 30px; transform: translateX(-50%); border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%; background: radial-gradient(ellipse at 50% 75%, #fff6dc 0 18%, #f6c56f 45%, rgba(220, 174, 103, 0) 75%); filter: blur(0.3px); animation: flick 2.2s ease-in-out infinite; transition: bottom 1.2s ease; }
.candle .halo { position: absolute; left: 50%; bottom: calc(16px + var(--h, 1) * 120px - 60px); width: 260px; height: 260px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle, rgba(246, 197, 111, 0.28), transparent 65%); pointer-events: none; animation: flick 3s ease-in-out infinite; transition: bottom 1.2s ease; }
.candle.out .flame, .candle.out .halo { display: none; }
.candle .smoke { display: none; position: absolute; left: 50%; bottom: calc(16px + var(--h, 0) * 120px + 8px); width: 2px; height: 60px; background: linear-gradient(0deg, rgba(180, 170, 150, 0.5), transparent); filter: blur(1.5px); animation: smoke 3s ease-in-out infinite; }
.candle.out .smoke { display: block; }
@keyframes flick { 0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; } 30% { transform: translateX(-52%) scale(0.94, 1.04); opacity: 0.85; } 60% { transform: translateX(-48%) scale(1.03, 0.97); opacity: 0.95; } }
@keyframes smoke { 0% { opacity: 0; transform: translateX(-50%) translateY(0) scaleX(1); } 40% { opacity: 0.7; } 100% { opacity: 0; transform: translateX(-30%) translateY(-30px) scaleX(3); } }

/* the reader's red pencil, the rescuer's key */
.pencil-obj { width: 170px; height: 14px; border-radius: 2px 7px 7px 2px; background: linear-gradient(180deg, #c9483b, #9b3026 60%, #7d241c); box-shadow: 0 8px 10px -4px rgba(0, 0, 0, 0.7); }
.pencil-obj::before { content: ""; position: absolute; left: -26px; top: 0; width: 26px; height: 14px; background: linear-gradient(180deg, #e3c9a0, #c3a57a); clip-path: polygon(100% 0, 100% 100%, 0 55%, 0 45%); }
.pencil-obj::after { content: ""; position: absolute; left: -26px; top: 5px; width: 8px; height: 4px; background: #8b2a20; clip-path: polygon(100% 0, 100% 100%, 0 50%); }
.key-obj { width: 120px; height: 46px; }
.key-obj svg, .tool svg { width: 100%; height: 100%; overflow: visible; }

/* the covered portrait */
.portrait { width: clamp(110px, 11vw, 150px); aspect-ratio: 0.8; }
@media (max-aspect-ratio: 1/1) { .portrait { width: clamp(80px, 22vw, 120px); } }
.portrait .frame { position: absolute; inset: 0; border: 10px solid #3a2a1c; border-image: linear-gradient(135deg, #5a4430, #2a1d13 50%, #4a3826) 1; background: #0d0a08; box-shadow: 0 16px 24px -8px rgba(0, 0, 0, 0.8); }
.portrait .cloth { position: absolute; left: -8%; right: -8%; top: -6%; bottom: -14%; transform-origin: top center; background-color: #3b3128; background-image: var(--noise), repeating-linear-gradient(92deg, rgba(0, 0, 0, 0.32) 0 6px, rgba(255, 255, 255, 0.04) 6px 11px, rgba(0, 0, 0, 0.12) 11px 19px); clip-path: polygon(0 0, 100% 0, 100% 86%, 88% 94%, 74% 88%, 60% 97%, 44% 90%, 30% 99%, 16% 91%, 0 97%); box-shadow: inset 0 18px 20px rgba(0, 0, 0, 0.35); }
.portrait.shiver .cloth { animation: shiver 0.9s ease; }
@keyframes shiver { 0%, 100% { transform: skewX(0); } 25% { transform: skewX(2deg) translateY(-2px); } 60% { transform: skewX(-1.5deg); } }

/* the ledger, the summons */
.ledger { width: clamp(140px, 13vw, 180px); aspect-ratio: 0.72; border-radius: 3px 8px 8px 3px; background: radial-gradient(ellipse at 40% 30%, #4a2e22, #2a1812 70%); box-shadow: 0 16px 20px -8px rgba(0, 0, 0, 0.8), inset 6px 0 0 #1d100c; }
.ledger::before { content: ""; position: absolute; inset: 10px 10px 10px 16px; border: 1px solid rgba(220, 174, 103, 0.5); }
.ledger span { position: absolute; left: 50%; top: 38%; transform: translateX(-50%); font-family: var(--f-label); font-size: 0.7rem; letter-spacing: 0.24em; color: rgba(220, 174, 103, 0.85); }
@media (max-aspect-ratio: 1/1) { .ledger { width: clamp(100px, 26vw, 130px); } }
.summons { width: clamp(150px, 15vw, 200px); aspect-ratio: 1.3; padding: 0.7rem 0.8rem; box-shadow: 0 12px 16px -6px rgba(0, 0, 0, 0.7); font-family: var(--f-text); font-size: 0.62rem; line-height: 1.4; overflow: hidden; }
.summons b { display: block; margin-bottom: 0.3rem; font-family: var(--f-label); font-size: 0.5rem; letter-spacing: 0.12em; color: #8a3b2f; }

/* ------------------------------------------------ threshold: three things on a desk */
.tool { width: clamp(120px, 16vw, 200px); aspect-ratio: 1.2; }
.tool .tag { font-size: 1.6rem; }
.tool.chosen { transform: translate(-50%, -62%) rotate(var(--r, 0deg)) scale(1.1); filter: drop-shadow(0 0 22px rgba(220, 174, 103, 0.5)); }
.tool.unchosen { opacity: 0.35; }

/* ------------------------------------------------ the reading desk: a sheet you hold */
.overlay { position: fixed; inset: 0; z-index: 50; overflow-y: auto; overscroll-behavior: contain; background: rgba(8, 6, 5, 0.78); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); animation: fadeIn .35s ease both; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.overlay.closing { animation: fadeOut .3s ease forwards; }
@keyframes fadeOut { to { opacity: 0; } }
.desk { min-height: 100%; display: flex; justify-content: center; align-items: flex-start; gap: 1.6rem; padding-block: 4.2rem 6rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet { position: relative; width: min(640px, 100%); min-height: 60vh; padding: 2.6rem clamp(1.2rem, 4.5vw, 3rem) 3rem; border-radius: 2px; box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.9), 0 2px 4px rgba(0, 0, 0, 0.4); transform: rotate(-0.35deg); animation: sheetIn .7s cubic-bezier(.2, .7, .2, 1) both; }
.sheet.turn-out { animation: sheetOut .45s ease forwards; }
@keyframes sheetIn { from { opacity: 0; transform: translateY(40px) rotate(1.5deg); } to { opacity: 1; transform: rotate(-0.35deg); } }
@keyframes sheetOut { to { opacity: 0; transform: translateX(-60px) rotate(-4deg); } }
.sheet::before { content: ""; position: absolute; left: 2.2rem; top: 0; bottom: 0; width: 1px; background: rgba(184, 71, 58, 0.25); }
.sheet-close { position: absolute; top: 0.6rem; right: 0.8rem; appearance: none; border: 0; background: none; cursor: pointer; font-family: var(--f-label); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); }
.sheet-close:hover { color: #8a3b2f; }
.sheet-head { margin: 0 0 1.6rem; display: grid; gap: 0.2rem; }
.sheet-kicker { margin: 0; font-family: var(--f-label); font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase; color: #8a3b2f; }
.sheet-title { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(1.8rem, 4vw, 2.4rem); line-height: 1.05; text-wrap: balance; }
.sheet-cite { margin: 0; font-family: var(--f-text); font-style: italic; color: var(--ink-soft); }
.staged { margin: 0.6rem 0 0; padding: 0.35rem 0.6rem; border: 1px dashed rgba(138, 59, 47, 0.6); font-family: var(--f-label); font-size: 0.66rem; color: #8a3b2f; }
.sheet-body { display: grid; gap: 1.1rem; }
.nar { margin: 0; font-family: var(--f-voice); font-style: italic; font-weight: 300; font-size: 1.02rem; line-height: 1.6; color: #4a3f33; }
.nar p, .q blockquote p, .slip-body p { margin: 0; }
.nar p + p, .q blockquote p + p, .slip-body p + p { margin-top: 0.7em; }
.subh { margin: 0.6rem 0 0; font-family: var(--f-label); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
.q { margin: 0; }
.cap { display: flex; flex-wrap: wrap; gap: 0.2rem 0.8rem; margin: 0 0 0.3rem; font-family: var(--f-label); font-size: 0.64rem; letter-spacing: 0.1em; text-transform: uppercase; color: #8a7a62; }
.cap .t { color: #8a3b2f; }
.q blockquote { margin: 0; font-family: var(--f-text); font-size: 1.14rem; line-height: 1.62; color: var(--ink); }
.q.doc blockquote { padding: 0.9rem 1rem; border: 1px solid rgba(90, 74, 55, 0.4); background: repeating-linear-gradient(180deg, transparent 0 1.82rem, rgba(90, 74, 55, 0.14) 1.82rem 1.86rem); font-family: var(--f-label); font-size: 0.98rem; line-height: 1.86rem; }
.q.mirror blockquote { cursor: pointer; padding: 0.8rem 1rem; background: linear-gradient(100deg, #0d1014, #1b232c 45%, #0d1014); border-radius: 3px; color: var(--glass); }
.q.mirror .mir { display: inline-block; transform: scaleX(-1); transition: transform .9s cubic-bezier(.6, 0, .2, 1); }
.q.mirror.turned .mir { transform: none; }
.clue { border-bottom: 1px dotted #8a3b2f; cursor: pointer; transition: background .2s; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.clue:hover, .clue.on { background: rgba(138, 59, 47, 0.12); }
.clue.seen { border-bottom-style: solid; border-bottom-color: rgba(138, 59, 47, 0.5); }
.q.mirror .clue { border-bottom-color: var(--glass); }

/* typed slips clipped to the page: notes, critics, reflections */
.slips { display: grid; gap: 0.7rem; }
.slips:empty { display: none; }
.slip { position: relative; margin-right: clamp(-2.4rem, -3vw, 0rem); margin-left: 1.2rem; padding: 0.85rem 1rem 0.9rem; background-color: var(--paper-2); background-image: var(--noise); box-shadow: 0 8px 14px -6px rgba(0, 0, 0, 0.45); transform: rotate(var(--sr, 0.6deg)); animation: slipIn .5s cubic-bezier(.2, .7, .2, 1) both; font-size: 0.98rem; line-height: 1.55; color: var(--ink); }
@keyframes slipIn { from { opacity: 0; transform: translateX(16px) rotate(2deg); } to { opacity: 1; transform: rotate(var(--sr, 0.6deg)); } }
.slip::before { content: ""; position: absolute; left: 1.2rem; top: -10px; width: 14px; height: 30px; border: 2px solid #8d8a84; border-radius: 8px; border-bottom-color: transparent; }
.slip-cap { display: flex; flex-wrap: wrap; gap: 0.2rem 0.8rem; margin: 0 1.4rem 0.35rem 0; font-family: var(--f-label); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: #8a7a62; }
.slip-x { position: absolute; top: 0.3rem; right: 0.5rem; appearance: none; border: 0; background: none; cursor: pointer; color: #8a7a62; font-size: 1.1rem; line-height: 1; }
.tier { font-weight: 700; }
.tier[data-tier="annotation"] { color: #6b5d48; }
.tier[data-tier="context"] { color: #7a5a1f; }
.tier[data-tier="criticism"] { color: #2a211a; }
.tier[data-tier="conjecture"] { color: #8a3b2f; }
.tier[data-tier="margin"] { color: #3d5a78; }
.tier[data-tier="text"] { color: #8a3b2f; }
.slip[data-tier="conjecture"] { background: transparent; border: 1px dashed rgba(138, 59, 47, 0.6); box-shadow: none; }
.slip[data-tier="conjecture"]::before { display: none; }

<script>

/* Unwriting Her: scene art.

    <radialGradient id="g-vig" cx="50%" cy="48%" r="72%"><stop offset=".45" stop-color="${DEEP}" stop-opacity="0"/><stop offset="1" stop-color="${DEEP}" stop-opacity=".92"/></radialGradient>
    <linearGradient id="g-glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c232b"/><stop offset=".45" stop-color="#0d1014"/><stop offset=".55" stop-color="#151b22"/><stop offset="1" stop-color="#090b0e"/></linearGradient>
    <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0e13"/><stop offset=".7" stop-color="#16161a"/><stop offset="1" stop-color="#1d1915"/></linearGradient>
    <linearGradient id="g-dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101318"/><stop offset=".55" stop-color="#2a2420"/><stop offset=".7" stop-color="#5a3f2c"/><stop offset="1" stop-color="#14100d"/></linearGradient>
    <radialGradient id="g-dark" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#030202" stop-opacity=".98"/><stop offset=".6" stop-color="#050404" stop-opacity=".8"/><stop offset="1" stop-color="#050404" stop-opacity="0"/></radialGradient>
    <linearGradient id="g-shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${DEEP}" stop-opacity="0"/><stop offset="1" stop-color="${DEEP}" stop-opacity=".95"/></linearGradient>
    <filter id="f-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="f-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="f-grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .9  0 0 0 0 .8  0 0 0 0 .65  0 0 0 .035 0"/></filter>
  </defs>`;
  const svg = (body, label, fit) => `<svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${label}">${DEFS}<rect width="1000" height="1000" fill="#110e0b"/>${fit ? `<g transform="translate(500 600) scale(${fit}) translate(-500 -600)">${body}</g>` : body}<rect width="1000" height="1000" fill="url(#g-vig)" pointer-events="none"/><rect width="1000" height="1000" filter="url(#f-grain)" pointer-events="none"/></svg>`;
  const glow = (cx, cy, r, id = 'g-candle', cls = '') => `<circle class="${cls}" cx="${cx}" cy="${cy}" r="${r}" fill="url(#${id})" pointer-events="none"/>`;
  const flame = (x, y, s = 1) => `<g class="flame" transform="translate(${x} ${y}) scale(${s})"><path d="M0,-34 C9,-20 10,-8 0,0 C-10,-8 -9,-20 0,-34Z" fill="${TALLOW}" opacity=".95"/><path d="M0,-22 C4,-14 4,-6 0,-2 C-4,-6 -4,-14 0,-22Z" fill="#fff3d6" opacity=".8"/></g>`;
  const candle = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-9" y="0" width="18" height="70" fill="#cfc2a6" opacity=".75"/><path d="M-26,72 h52 l-6,10 h-40z" fill="none" stroke="${INK}" stroke-width="2"/><line x1="0" y1="0" x2="0" y2="-6" stroke="#222" stroke-width="2"/>${flame(0, -4)}</g>`;
  const seenX = (s, id) => !!(s && s.explored && (s.explored[s.scene] || []).includes(id));
  const obj = (s, id, inner) => hot(id, `<g class="obj${seenX(s, id) ? ' seen' : ''}">${inner}</g>`);
  const hot = (id, inner, kind = 'ex') => kind === 'none' ? `<g>${inner}</g>` : `<g class="hot" data-${kind}="${id}" tabindex="0" role="button" aria-label="${id}">${inner}</g>`;

  /* -------------------------------------------------- corridor */
  function corridor(s, beat, opts = {}) {
    const near = 0.62, far = 7;
    let b = '';
    // walls, floor, ceiling edges
    [[-1, -1], [1, -1], [-1, 1.25], [1, 1.25]].forEach(([X, Y]) => { const a = P(X, Y, near), c = P(X, Y, far); b += `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(c[0])}" y2="${f(c[1])}" stroke="${INK}" stroke-width="1.4"/>`; });
    const fw = [P(-1, -1, far), P(1, -1, far), P(1, 1.25, far), P(-1, 1.25, far)];
    b += `<polygon points="${poly(fw)}" fill="#0e0c0a" stroke="${INK}" stroke-width="1.2"/>`;
    const win = [P(-0.26, 0, far), P(0.26, 0, far), P(0.26, 0.78, far), P(-0.26, 0.78, far)];
    b += glow(500, 440, 120, 'g-moon') + (opts.open ? `<polygon points="${poly(win)}" fill="#24303c" stroke="${GLASS}" stroke-width="1" opacity=".9"/>` : obj(s, 'window', `<polygon points="${poly(win)}" fill="#24303c" stroke="${GLASS}" stroke-width="1" opacity=".9"/>`));
    b += `<line x1="500" y1="${f(win[0][1])}" x2="500" y2="${f(win[2][1])}" stroke="#0e0c0a" stroke-width="1.5"/>`;
    // floorboards
    [-0.6, -0.2, 0.2, 0.6].forEach(X => { const a = P(X, -1, near), c = P(X, -1, far); b += `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(c[0])}" y2="${f(c[1])}" stroke="${FAINT}" stroke-width="1"/>`; });
    // moonlight on floor
    b += `<polygon points="${poly([P(-0.26, -1, far), P(0.26, -1, far), P(0.5, -1, 2.2), P(-0.5, -1, 2.2)])}" fill="${GLASS}" opacity=".05"/>`;
    // doors
    const zs = [1.35, 2.35, 3.35, 4.35, 5.35];
    [-1, 1].forEach(X => zs.forEach((z, k) => {
      const d = [P(X, -1, z), P(X, -1, z + 0.45), P(X, 0.55, z + 0.45), P(X, 0.55, z)];
      const isLaugh = X === 1 && k === 2;
      const shape = `<polygon points="${poly(d)}" fill="#070605" stroke="#4a3d30" stroke-width="1.3"/>`;
      if (isLaugh) {
        const s1 = P(X, -0.985, z), s2 = P(X, -0.985, z + 0.45);
        const seam = `<line class="seam" x1="${f(s1[0])}" y1="${f(s1[1])}" x2="${f(s2[0])}" y2="${f(s2[1])}" stroke="${TALLOW}" stroke-width="3"/><line class="seam seam-glow" x1="${f(s1[0])}" y1="${f(s1[1])}" x2="${f(s2[0])}" y2="${f(s2[1])}" stroke="${TALLOW}" stroke-width="10" filter="url(#f-glow)"/>`;
        if (opts.open) {
          const o = [P(X, -1, z), P(X - 0.42, -1, z + 0.05), P(X - 0.42, 0.55, z + 0.05), P(X, 0.55, z)];
          b += `<polygon points="${poly(d)}" fill="${TALLOW}" opacity=".35"/><polygon points="${poly([P(X, -1, z), P(X, -1, z + 0.45), P(0.1, -1, z + 0.2), P(0.2, -1, z - 0.4)])}" fill="${TALLOW}" opacity=".12"/><polygon points="${poly(o)}" fill="#0a0807" stroke="#4a3d30" stroke-width="1.3"/>`;
        } else b += obj(s, 'door', shape + seam);
      } else if (X === -1 && k === 0 && !opts.open) b += obj(s, 'doors', shape);
      else b += shape;
      const kn = P(X, -0.2, z + (X < 0 ? 0.36 : 0.36));
      b += `<circle cx="${f(kn[0])}" cy="${f(kn[1])}" r="${f(18 / z)}" fill="#3a3028"/>`;
    }));
    if (opts.keys) b += `<g transform="translate(470 900)"><circle r="16" fill="none" stroke="${TALLOW}" stroke-width="2.5"/><line x1="12" y1="10" x2="60" y2="34" stroke="${TALLOW}" stroke-width="3"/><line x1="44" y1="26" x2="40" y2="40" stroke="${TALLOW}" stroke-width="3"/></g>`;
    b += glow(500, 980, 420);
    return svg(b, 'A long, low corridor of small black doors with one little window at the far end');
  }

  /* -------------------------------------------------- roof */
  function leads(s, beat, opts = {}) {
    const r = rng(7);
    let b = `<rect width="1000" height="1000" fill="url(#g-sky)"/>`;
    for (let i = 0; i < 70; i++) b += `<circle cx="${f(r() * 1000)}" cy="${f(r() * 520)}" r="${f(r() * 1.6 + 0.4)}" fill="#d9d3c4" opacity="${f(r() * 0.5 + 0.15)}"/>`;
    b += glow(760, 170, 160, 'g-moon') + `<circle cx="760" cy="170" r="34" fill="#cfd8df" opacity=".75"/>`;
    const hills = `<path d="M0,610 C120,580 220,600 330,585 C450,568 560,600 680,590 C800,578 900,596 1000,585 L1000,700 L0,700Z" fill="#14130f"/>`;
    b += opts.fire ? hills : obj(s, 'horizon', hills);
    b += `<path d="M0,640 C150,625 260,648 400,636 C560,622 700,650 1000,632 L1000,720 L0,720Z" fill="#100f0c"/>`;
    for (let i = 0; i < 9; i++) b += `<path d="M${f(-50 + i * 130)},${f(660 + i % 3 * 6)} Q${f(30 + i * 130)},${f(650 + i % 2 * 8)} ${f(110 + i * 130)},${f(668)}" stroke="${FAINT}" fill="none"/>`;
    // battlements
    let cren = 'M0,1000 L0,770 ';
    for (let x = 0; x < 1000; x += 120) cren += `L${x},770 L${x},720 L${x + 70},720 L${x + 70},770 `;
    cren += 'L1000,770 L1000,1000Z';
    b += `<path d="${cren}" fill="#0c0a08" stroke="${INK}" stroke-width="1.4"/>`;
    for (let y = 800; y < 1000; y += 34) b += `<line x1="0" y1="${y}" x2="1000" y2="${y}" stroke="${FAINT}" stroke-width=".8"/>`;
    if (opts.fire) {
      b += glow(500, 1000, 700, 'g-fire', 'fireglow') + `<path d="M0,1000 L0,770 L1000,770 L1000,1000Z" fill="${WAX}" opacity=".1"/>`;
      b += `<path class="smoke" d="M300,720 C320,600 260,520 330,420 C380,350 340,260 400,180" stroke="#5a4d40" stroke-width="40" fill="none" opacity=".18" filter="url(#f-soft)"/>`;
    } else {
      b += obj(s, 'trapdoor', `<polygon points="440,880 560,880 590,960 410,960" fill="#060504" stroke="${INK}" stroke-width="1.2"/><polygon class="trap-glow" points="440,880 560,880 590,960 410,960" fill="${TALLOW}" opacity="0"/>`);
    }
    return svg(b, opts.fire ? 'The battlements against a sky lit by fire' : 'The flat lead roof at night, with battlements, fields and a dim sky-line');
  }

  /* -------------------------------------------------- the gallery of witnesses */
  function gallery(s) {
    const order = ['rochester', 'mason', 'grace', 'jane', 'register', 'host', 'author', 'bertha'];
    const names = { rochester: 'ROCHESTER', mason: 'MASON', grace: 'POOLE', jane: 'EYRE', register: 'THE REGISTER', host: 'THE LANDLORD', author: 'BRONTË', bertha: '' };
    const story = UH.stories.bertha;
    let b = `<rect x="0" y="0" width="1000" height="1000" fill="#120f0c"/><line x1="0" y1="935" x2="1000" y2="935" stroke="${INK}"/>`;
    for (let x = 0; x < 1000; x += 90) b += `<line x1="${x}" y1="935" x2="${x}" y2="1000" stroke="${FAINT}"/>`;
    order.forEach((id, i) => {
      const col = i % 3, row = Math.floor(i / 3);
      const w = 168, h = 196, x = 205 + col * 210 + (row === 2 ? 105 : 0), y = 110 + row * 285;
      const heard = s.heard.includes(id);
      const w0 = story && story.witnesses.find(w => w.id === id);
      let fr = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#0a0807" stroke="${INK}" stroke-width="3"/><rect x="${x + 12}" y="${y + 12}" width="${w - 24}" height="${h - 24}" fill="url(#g-glass)" stroke="#4a3d30" stroke-width="1.2" opacity=".9"/>`;
      fr += `<line x1="${x + 30}" y1="${y + 30}" x2="${x + 70}" y2="${y + 80}" stroke="${GLASS}" stroke-width="1" opacity=".18"/>`;
      if (id === 'bertha') {
        fr = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${INK}" stroke-width="2" stroke-dasharray="6 6"/><path d="M${x - 6},${y - 4} C${x + 40},${y + 30} ${x + 140},${y + 20} ${x + w + 6},${y - 4} L${x + w - 4},${y + h + 10} C${x + 120},${y + h - 10} ${x + 60},${y + h + 16} ${x + 4},${y + h + 6}Z" fill="#2a231c" stroke="#4a3d30"/><path d="M${x + 40},${y + 20} C${x + 60},${y + 110} ${x + 50},${y + 170} ${x + 70},${y + h}" stroke="#1d1813" fill="none" stroke-width="3"/><path d="M${x + 120},${y + 14} C${x + 110},${y + 100} ${x + 130},${y + 160} ${x + 118},${y + h}" stroke="#1d1813" fill="none" stroke-width="3"/>`;
        b += `<g class="covered">${fr}<text x="${x + w / 2}" y="${y + h + 40}" text-anchor="middle" font-family="Courier Prime, monospace" font-size="15" letter-spacing="2" fill="#7d725f">NOT CALLED</text></g>`;
        return;
      }
      fr += `<rect x="${x + w / 2 - 70}" y="${y + h + 18}" width="140" height="28" fill="#1d1813" stroke="#4a3d30"/><text x="${x + w / 2}" y="${y + h + 37}" text-anchor="middle" font-family="Courier Prime, monospace" font-size="13" letter-spacing="1.5" fill="${heard ? TALLOW : '#ab9f88'}">${names[id]}</text>`;
      if (heard) fr += `<rect x="${x + 12}" y="${y + 12}" width="${w - 24}" height="${h - 24}" fill="${TALLOW}" opacity=".08"/>`;
      b += hot(w0 ? w0.scene : '', `<g class="frame${heard ? ' heard' : ''}">${fr}</g>`, 'go');
    });
    [[150, 300], [850, 300]].forEach(([x, y]) => { b += glow(x, y, 170) + candle(x, y + 10, 0.6); });
    return svg(b, 'A wall of empty portrait frames, one for each witness, and one covered with a cloth');
  }

  /* -------------------------------------------------- the room without a window */
  function room(s, beat, opts = {}) {
    const seen = id => opts.inspect ? s.examined.includes(id) : seenX(s, id);
    let b = `<rect width="1000" height="760" fill="#14100d"/><polygon points="0,760 1000,760 1000,1000 0,1000" fill="#0f0c0a"/>`;
    for (let i = -6; i <= 6; i++) b += `<line x1="${500 + i * 40}" y1="760" x2="${500 + i * 220}" y2="1000" stroke="${FAINT}" stroke-width=".9"/>`;
    b += `<line x1="0" y1="760" x2="1000" y2="760" stroke="${INK}" stroke-width="1.3"/>`;
    // the fire, fenced
    let fire = `<rect x="90" y="470" width="250" height="290" fill="#0c0a08" stroke="${INK}" stroke-width="2"/><rect x="70" y="450" width="290" height="22" fill="#1a1511" stroke="${INK}" stroke-width="1.5"/><path d="M130,760 L130,570 Q215,520 300,570 L300,760Z" fill="#060504"/>`;
    fire += glow(215, 720, 160, 'g-fire', 'fireglow') + `<path class="fire-tongue" d="M175,760 C180,710 205,700 200,660 C230,690 240,720 255,760Z" fill="#e39a4f" opacity=".75"/>`;
    let fender = `<line x1="105" y1="640" x2="325" y2="640" stroke="${INK}" stroke-width="4"/>`;
    for (let x = 110; x <= 320; x += 15) fender += `<line x1="${x}" y1="640" x2="${x}" y2="770" stroke="${INK}" stroke-width="3"/>`;
    b += hot('fire', `<g class="obj${seen('fire') ? ' seen' : ''}">${fire}${fender}</g>`);
    // the lamp on its chain
    let lamp = `<line x1="520" y1="0" x2="520" y2="250" stroke="${INK}" stroke-width="2" stroke-dasharray="7 4"/><path d="M490,250 L550,250 L540,320 L500,320Z" fill="#2a231c" stroke="${INK}" stroke-width="1.5"/>`;
    lamp += glow(520, 300, 230) + `<ellipse cx="520" cy="300" rx="12" ry="16" fill="${TALLOW}" opacity=".8"/>`;
    b += hot('lamp', `<g class="obj${seen('lamp') ? ' seen' : ''}">${lamp}</g>`);
    // the tapestry, drawn back from a second door
    let tap = `<rect x="760" y="330" width="130" height="430" fill="#070605" stroke="#4a3d30" stroke-width="1.5"/><rect x="780" y="350" width="90" height="390" fill="none" stroke="${FAINT}"/>`;
    tap += `<path d="M700,180 L930,180 L930,190 C900,330 940,520 905,760 L870,760 C890,560 860,360 880,200 L760,200 C740,380 720,560 705,760 L690,760 C700,560 690,380 700,180Z" fill="#2b221a" stroke="#4a3d30"/>`;
    for (let x = 712; x < 760; x += 12) tap += `<path d="M${x},200 C${x - 4},400 ${x + 6},560 ${x - 2},760" stroke="#1d1813" fill="none" stroke-width="2"/>`;
    b += hot('tapestry', `<g class="obj${seen('tapestry') ? ' seen' : ''}">${tap}</g>`);
    if (opts.inspect) {
      // the window that isn't there
      b += hot('window', `<g class="obj ghost${seen('window') ? ' seen' : ''}"><rect x="420" y="380" width="150" height="190" fill="#14100d" stroke="${GLASS}" stroke-width="1.5" stroke-dasharray="8 8" opacity=".55"/><line x1="495" y1="380" x2="495" y2="570" stroke="${GLASS}" stroke-dasharray="8 8" opacity=".35"/><line x1="420" y1="475" x2="570" y2="475" stroke="${GLASS}" stroke-dasharray="8 8" opacity=".35"/></g>`);
      // Grace Poole's chair, and the keys
      const chair = `<path d="M330,900 L330,700 Q330,660 370,660 L450,660 Q480,660 480,700 L480,800 L500,800 L500,900" fill="none" stroke="${INK}" stroke-width="5"/><path d="M335,690 C380,720 430,700 470,730 L470,800 L340,800Z" fill="#2a2119" opacity=".9"/><line x1="320" y1="800" x2="510" y2="800" stroke="${INK}" stroke-width="5"/>`;
      const keys = `<g class="keys" transform="translate(470 832)"><circle r="12" fill="none" stroke="${TALLOW}" stroke-width="2.5"/><line x1="9" y1="7" x2="44" y2="24" stroke="${TALLOW}" stroke-width="2.5"/><line x1="33" y1="19" x2="30" y2="30" stroke="${TALLOW}" stroke-width="2.5"/></g>`;
      b += hot('pocket', `<g class="obj${seen('pocket') ? ' seen' : ''}">${chair}${keys}</g>`);
      // her: the deep shade at the far end
      b += hot('her', `<g class="obj her${seen('her') ? ' seen' : ''}"><ellipse cx="620" cy="680" rx="130" ry="190" fill="url(#g-dark)"/><path class="rim" d="M575,560 C560,620 565,700 590,790" stroke="${GLASS}" stroke-width="1.6" fill="none" opacity="0"/></g>`);
    } else {
      b += `<rect x="560" y="420" width="440" height="340" fill="url(#g-shade)"/>`;
    }
    return svg(b, 'A room without a window: a fire behind a high fender, a lamp on a chain, a tapestry drawn back from a door', 0.82);
  }
  function roomInspect(s, beat) {
    // same room, but every object can be looked at
    return room(s, beat, { inspect: true });
  }

  /* -------------------------------------------------- other interiors */
  function bedside(s) {
    let b = `<rect width="1000" height="740" fill="#13100d"/><rect y="740" width="1000" height="260" fill="#0e0b09"/><line x1="0" y1="740" x2="1000" y2="740" stroke="${INK}"/>`;
    b += obj(s, 'innerdoor', `<rect x="640" y="230" width="190" height="510" fill="#070605" stroke="#4a3d30" stroke-width="1.5"/><path d="M600,200 L870,200 C850,400 880,600 860,740 L835,740 C850,560 830,380 845,220 L640,220 C620,400 615,600 610,740 L595,740 C605,560 595,380 600,200Z" fill="#2b221a" stroke="#4a3d30"/>`);
    b += `<path d="M180,960 L180,700 Q180,640 240,640 L330,640 Q380,640 380,700 L380,800 L410,800 L410,960" fill="none" stroke="${INK}" stroke-width="6"/><line x1="160" y1="800" x2="420" y2="800" stroke="${INK}" stroke-width="6"/>`;
    b += `<rect x="440" y="700" width="170" height="14" fill="#1d1813" stroke="${INK}"/><line x1="455" y1="714" x2="455" y2="960" stroke="${INK}" stroke-width="5"/><line x1="595" y1="714" x2="595" y2="960" stroke="${INK}" stroke-width="5"/>`;
    b += obj(s, 'basin', `<path d="M465,700 Q525,650 585,700Z" fill="#cfc2a6" opacity=".35" stroke="${INK}"/><ellipse cx="525" cy="684" rx="40" ry="8" fill="#5a1f19" opacity=".55"/><path d="M550,700 L556,620 Q575,600 590,620 L585,700" fill="none" stroke="${INK}" stroke-width="3"/>`);
    b += glow(500, 600, 340) + candle(505, 560, 0.75);
    return svg(b, 'A chair beside a small table with a basin and a candle, and a door behind a tapestry', 0.86);
  }
  function hearth(s) {
    let b = `<rect width="1000" height="760" fill="#14100d"/><rect y="760" width="1000" height="240" fill="#0f0c0a"/><line x1="0" y1="760" x2="1000" y2="760" stroke="${INK}"/>`;
    b += `<rect x="260" y="380" width="480" height="380" fill="#0c0a08" stroke="${INK}" stroke-width="2"/><rect x="230" y="355" width="540" height="28" fill="#1a1511" stroke="${INK}" stroke-width="1.5"/><path d="M320,760 L320,520 Q500,440 680,520 L680,760Z" fill="#060504"/>`;
    b += glow(500, 720, 280, 'g-fire', 'fireglow') + `<path class="fire-tongue" d="M430,760 C440,700 470,690 465,640 C510,680 530,720 560,760Z" fill="#e39a4f" opacity=".75"/>`;
    b += obj(s, 'saucepan', `<rect x="560" y="610" width="90" height="12" fill="${INK}"/><path d="M570,610 L578,560 L632,560 L640,610Z" fill="#2a231c" stroke="${INK}" stroke-width="2"/><line x1="640" y1="580" x2="700" y2="570" stroke="${INK}" stroke-width="4"/><path d="M590,550 C585,520 600,505 595,480" stroke="#7d725f" fill="none" opacity=".4"/>`);
    b += obj(s, 'bottle', `<path d="M640,355 L640,300 Q640,290 650,285 L650,250 L666,250 L666,285 Q676,290 676,300 L676,355Z" fill="#22301f" stroke="${INK}" opacity=".85"/>`);
    b += `<path d="M90,960 L90,720 Q90,680 130,680 L200,680 Q230,680 230,720 L230,820 L250,820 L250,960" fill="none" stroke="${INK}" stroke-width="5"/><line x1="80" y1="820" x2="260" y2="820" stroke="${INK}" stroke-width="5"/>`;
    b += obj(s, 'keys', `<g transform="translate(120 640)"><circle r="16" fill="#0e0b09" stroke="${TALLOW}" stroke-width="2.5"/><line x1="12" y1="9" x2="48" y2="26" stroke="${TALLOW}" stroke-width="2.5"/><line x1="38" y1="21" x2="34" y2="32" stroke="${TALLOW}" stroke-width="2.5"/></g>`);
    return svg(b, 'A hearth with a saucepan on the hob, a bottle on the mantel, an empty chair and a ring of keys');
  }
  function bedroom(s) {
    const flipped = s.flags.includes('mirror-turned');
    let b = `<rect width="1000" height="780" fill="#13100d"/><rect y="780" width="1000" height="220" fill="#0e0b09"/><line x1="0" y1="780" x2="1000" y2="780" stroke="${INK}"/>`;
    b += `<path d="M640,160 L960,160 L960,780 L640,780" fill="#0d0a08" stroke="${INK}" stroke-width="2"/><path d="M640,160 C700,260 680,500 700,780" stroke="#2b221a" stroke-width="40" fill="none" opacity=".8"/><path d="M960,160 C900,260 930,520 910,780" stroke="#2b221a" stroke-width="40" fill="none" opacity=".8"/>`;
    // the dark oblong glass

<script>
/* ---- bertha.js ---- */
/* Unwriting Her: the Bertha Mason storyline.
   Narrative content only. The engine (engine.js) reads this object; nothing here touches the DOM.

   Markup inside text:
     [[visible words|clueId]]   a clickable phrase that opens the note clues[clueId]
     *words*                    italics
     {name} {Name}              the name the player chooses for her (lower / sentence case)
   Tiers: text (the novel, verbatim) · context (history outside the novel) · criticism (a named
   critic, paraphrased) · annotation (this game's reading of the text) · conjecture (invented here)
   · margin (the player's own words).
   Quotations from Jane Eyre and from Brontë's 1848 letter are verbatim; ellipses mark omissions. */
(function () {
  const Q = (who, cite, text, o) => Object.assign({ t: 'q', who, cite, text }, o || {});
  const P = (text, o) => Object.assign({ t: 'p', text }, o || {});
  const N = (tier, text, by) => ({ t: 'note', tier, text, by });
  const R = id => ({ t: 'reflect', id });
  const H = text => ({ t: 'h', text });
  const GO = (hot, prompt, flag) => ({ t: 'gate', hot, prompt, flag });
  const CHECK = (id, claim, answer, note) => s => s.role === 'reader' ? { t: 'check', id, claim, answer, note } : null;
  const CROSS = w => s => s.role === 'judge' ? { t: 'crossx', w } : null;
  const ROLE = (role, text) => s => s.role === role ? P(text) : null;

  const JANE = 'Jane Eyre, narrating';
  const ROCH = 'Edward Rochester';

  /* ---------------------------------------------------------------- notes */
  const clues = {
    c_bluebeard: { tier: 'context', by: 'Perrault, 1697', text: `In Charles Perrault’s tale, a rich husband gives his new wife the keys to every room in the house and forbids her one. Inside it she finds the bodies of the wives who came before her.\n\nJane names the genre of the house in her first hour on the third storey, long before she knows its secret. The comparison fits more closely than she can know. Behind one of these doors is a wife who came before her, and this one is alive.` },
    c_formal: { tier: 'annotation', text: `*Distinct* and *formal* describe something controlled; *mirthless* rules out amusement. Jane describes the sound carefully before anyone explains it to her.` },
    c_door: { tier: 'annotation', text: `Jane can place the sound exactly. The household’s answer is about whose laugh it is, not where it came from.` },
    c_perhaps: { tier: 'annotation', text: `The first explanation of the laugh names the wrong woman, and hedges: *very likely*, *perhaps*. Rochester later says Mrs. Fairfax “may indeed have suspected something, but she could have gained no precise knowledge as to facts” (Ch. XXVII).

Miranda Fricker (2007) writes that testimonial injustice “occurs when prejudice causes a hearer to give a deflated level of credibility to a speaker’s word.” Here the laugh is not disbelieved so much as assigned to someone else.` },
    c_directions: { tier: 'annotation', text: `The first rule the household is shown enforcing about the woman upstairs is a rule about noise.` },
    c_leads: { tier: 'annotation', text: `*The leads*: the flat lead roof of the hall. Jane comes here to look at the horizon. In Chapter XXXVI the woman from the third storey stands on this roof on the last night of her life.` },
    c_silent: { tier: 'annotation', text: `Jane’s argument for women’s inner lives is made on the same storey as a confined woman whose inner life the novel never records.` },
    c_laughat: { tier: 'annotation', text: `Jane objects to women being laughed at. The next sentence is a laugh.` },
    c_murmurs: { tier: 'annotation', text: `Jane hears this speech often enough to call it characteristic, records none of it, and still attributes it to Grace Poole.` },
    c_judgeme: { tier: 'annotation', text: `Rochester takes the wedding party up to the third storey, shows them his wife, and asks to be judged by comparing her with Jane. She is in the room. No one asks her anything.` },
    c_beast: { tier: 'annotation', text: `The pronoun shifts within the scene: *it* while the figure grovels and growls, *she* when she looks back at her visitors, *its* again a sentence later.` },
    c_gazed: { tier: 'annotation', text: `The one moment in the scene when she is described looking rather than being looked at. Grace Poole’s warning follows at once: “Ah! sir, she sees you!”` },
    c_mywife: { tier: 'annotation', text: `An hour earlier he was marrying Jane. Here he claims her as *my wife*. In Chapter XXVII he reports a voice telling him the opposite: she “is not your wife.”` },
    c_madfamily: { tier: 'criticism', by: 'Thomas, 1999', text: `Rochester presents madness as inherited down the female line from a “Creole” mother. Sue Thomas (1999) connects this kind of description to period writing about the white Creole planter class as morally degenerate, with intemperance among its “stock markers.” The novel never says what “Creole” means for this family.` },
    c_human: { tier: 'annotation', reflect: 'human', text: `Rochester asks the witnesses to compare the two women: one *a being*, the other *something at least human*.` },
    c_money: { tier: 'context', by: 'Coverture', text: `Under English common law a wife’s money and movable property passed to her husband on marriage unless a settlement protected it. William Blackstone’s *Commentaries* (1765) put the doctrine plainly: “By marriage, the husband and wife are one person in law: that is, the very being or legal existence of the woman is suspended during the marriage.” The Married Women’s Property Acts of 1870 and 1882 began to undo it.` },
    c_dark: { tier: 'annotation', text: `The same three words describe Blanche Ingram, the heiress Rochester courts at Thornfield. Here *dark* is a compliment about colouring. How to read the later descriptions (*discoloured*, *swelled black face*) is disputed; see the note on *discoloured*.` },
    c_race: { tier: 'annotation', reflect: 'race', text: `*Race* here means family line. Rochester describes a match between an old English family and a colonial fortune.` },
    c_30k: { tier: 'context', text: `Thirty thousand pounds was a very large fortune; Jane’s own windfall at the end of the novel is twenty thousand. Rochester was a younger son with no inheritance coming, and by his account his father arranged the match for the money. Under coverture the fortune became her husband’s. The novel never mentions it again, and never says how much of the household that confines her runs on what she brought.` },
    c_infamous: { tier: 'annotation', text: `Her mother is named once in the novel, in the statement read in church: Antoinetta. Here she is only *infamous*.` },
    c_unchaste: { tier: 'annotation', reflect: 'unchaste', text: `Both charges concern appetite, for drink and for sex. In the next sentence Rochester presents them as the cause of her madness.

Within the chapter, the woman listening to him will refuse to stay as his mistress.` },
    c_partofme: { tier: 'context', by: 'Coverture', text: `Rochester complains that the law calls her a part of him. Under coverture the fiction ran the other way. It was the wife whose legal existence was absorbed into the husband’s, along with her fortune.` },
    c_doctors: { tier: 'context', text: `No doctor is named. No examination is described, no certificate shown. The diagnosis arrives in a subordinate clause, as the reason he could not divorce her.\n\nBefore the Matrimonial Causes Act of 1857, an English divorce that allowed remarriage took a private Act of Parliament: rare, costly, and in practice granted almost only for a wife’s adultery. Rochester has just called her *unchaste*. In his own account, the finding of madness is what closes the legal way out and makes the marriage permanent.` },
    c_excesses: { tier: 'context', by: 'Prichard, 1835', text: `Moral judgment, turned into diagnosis. James Cowles Prichard’s *Treatise on Insanity* (1835) gave English medicine a category, *moral insanity*, in which disordered feeling and conduct could amount to madness while the intellect stayed intact. Brontë used nearly that phrase about Bertha in a letter of January 1848. Hear the author’s testimony.` },
    c_europe: { tier: 'criticism', by: 'Spivak, 1985', reflect: 'europe', text: `The passage sets the West Indies (sulphur, a red moon like a cannon-ball) against a wind from Europe. Gayatri Chakravorty Spivak (1985) reads *Jane Eyre* as a novel in which empire supplies the terms of English selfhood. Here Europe is the cure, and the cure is for him.` },
    c_confine: { tier: 'annotation', text: `In Rochester’s account, the plan to confine her at Thornfield was made in Jamaica, as the condition of his starting again.` },
    c_notwife: { tier: 'annotation', reflect: 'notwife', text: `At the attic door he called her *my wife*. Here a voice tells him she is not, which leaves him free to form “what new tie you like.”` },
    c_oblivion: { tier: 'annotation', text: `The plan is to bury her identity. Her full name, and her mother’s, appear once in the novel, read aloud by a solicitor.` },
    c_ravings: { tier: 'annotation', text: `Rochester says her *ravings* would *betray* his secret, which means what she said was intelligible enough to reveal it. The attendant is chosen for *fidelity*, not for medical skill.

Fricker’s testimonial injustice concerns a hearer who discounts a speaker. Here the arrangement ensures she has no hearers.` },
    c_lucid: { tier: 'annotation', text: `By his account she used her clear periods to accuse him. The accusations are not recorded.` },
    c_cannothelp: { tier: 'annotation', text: `Jane is the only character who rebukes Rochester for how he speaks of his wife. Her defence still accepts the diagnosis.` },
    c_ifyou: { tier: 'annotation', reflect: 'ifmad', text: `He imagines Jane mad, and says he would love her anyway.` },
    c_tigress: { tier: 'annotation', text: `Her brother, too, describes her as an animal.` },
    c_interview: { tier: 'annotation', text: `Rochester’s word for a brother visiting his sister. An interview has two speakers.` },
    c_good: { tier: 'annotation', text: `Mason went up alone, at night, without Rochester. The novel does not record what he meant to say, or what she said before she attacked him; only that “she looked so quiet at first.”` },
    c_drain: { tier: 'annotation', text: `The only words in the novel attributed to her. They reach you through her brother’s report, narrated by Jane, who has been told to keep quiet.` },
    c_gibberish: { tier: 'annotation', reflect: 'fool', text: `A threat is a sentence with a meaning. Rochester calls it *gibberish*.

Compare his praise of Jane after the fire in Chapter XV: “You are no talking fool.”` },
    c_dontrepeat: { tier: 'annotation', text: `He calls her words meaningless and forbids them to be repeated in the same breath.` },
    c_dead: { tier: 'annotation', text: `The advice Rochester gave himself in Jamaica, “buried in oblivion,” is passed on to her brother. Spanish Town is where she was married.` },
    c_grains: { tier: 'annotation', text: `Mason is the reason the bigamous wedding stops, and he weeps for his sister. Rochester’s portrait of him is contemptuous and predicts he will go mad too. The account of the Mason family you have is Rochester’s.` },
    c_charge: { tier: 'annotation', text: `*Charge*: a ward, a responsibility, a cost.` },
    c_were: { tier: 'annotation', text: `Grace answers for both of them, in the first person plural.` },
    c_guessed: { tier: 'annotation', text: `Jane offers the name. Rochester accepts it rather than correct her.` },
    c_saynothing: { tier: 'annotation', reflect: 'fool', text: `The order to keep quiet goes to Jane, who obeys and is praised for it.` },
    c_mirror: { tier: 'annotation', text: `Before tearing the veil she puts it on and looks at herself. Rochester later reads the act as memory of “her own bridal days” (Ch. XXVII). What she felt is not in the text.` },
    c_discoloured: { tier: 'criticism', by: 'Meyer, 1990 · Thomas, 1999', text: `Disputed. Susan Meyer (1990) argues that Bertha, apparently white in Rochester’s retrospective account, is darkened in the scenes where she appears, as part of the novel’s figurative use of race and slavery. Sue Thomas (1999) disagrees, reading Bertha through period stereotypes of the white Creole planter class rather than of the rebel slave. Others read the words as describing illness or drink. The novel never states her race.` },
    c_vampyre: { tier: 'annotation', text: `Jane names her with a figure from German folklore. The Gothic supplies the words available to her.` },
    c_extinguished: { tier: 'annotation', text: `In the only meeting between the two women, she looks at Jane by candlelight and does her no harm.` },
    c_creature: { tier: 'annotation', reflect: 'nerves', text: `Rochester explains Jane’s account away as nerves and fever, though he knows who was in her room. He praises Jane’s delicacy. In the attic, Jane reports, the other woman “showed virile force in the contest” (Ch. XXVI).` },
    c_real: { tier: 'annotation', text: `Jane holds her ground, and the next morning proves her right. Her account is confirmed by the plot, which is hers.` },
    c_madcat: { tier: 'criticism', by: 'Gilbert & Gubar, 1979', reflect: 'madcat', text: `Jane is the first woman in the novel called mad and locked in a room for it. Sandra Gilbert and Susan Gubar (1979) read Bertha as Jane’s dark double, acting out the rebellion and rage that first appear in this red-room scene.` },
    c_rebelslave: { tier: 'criticism', by: 'Meyer, 1990', text: `Jane uses the enslaved rebel as a figure for an English child’s anger. Susan Meyer (1990) argues that the novel repeatedly uses slavery as a metaphor for English women’s subordination, while the people of the colonies stay at its margins.` },
    c_fullname: { tier: 'annotation', text: `Her full name appears once in the novel, read aloud in a church. Until now she has been a laugh, a fire, and Grace Poole.` },
    c_jonas: { tier: 'context', text: `Rochester calls him “a West India planter and merchant” (Ch. XXVII). Spanish Town was the capital of colonial Jamaica. In the 1790s Jamaican planter wealth rested on the labour of enslaved Africans; Britain abolished slavery in its colonies only in 1834, and forced “apprenticeship” lasted until 1838. The novel never mentions slavery in connection with the Masons. That silence is part of the record too.\n\nOn dating: in Chapter XXXII Jane is given Scott’s *Marmion* (1808) as “a new publication.” If that clue is trusted, Jane’s story falls around 1808 and this wedding, fifteen years earlier, in the early 1790s. Brontë’s chronology is loose, so treat this as an estimate.` },
    c_antoinetta: { tier: 'context', by: 'Rhys, 1966', text: `Her middle name is her mother’s: the one place in the novel where a line of descent runs through women.

Jean Rhys took the name for Antoinette Cosway, the heroine of *Wide Sargasso Sea* (1966), and made “Bertha” the name her English husband imposes. In a letter Rhys wrote: “The Creole is of course the important one, the others explain her.”` },
    c_creole: { tier: 'context', text: `In this period *Creole* could describe a person of European descent born in the Caribbean, as well as people of African or mixed descent born there. The word marks her mother as colonial-born. It does not settle her race, and the novel never does.` },
    c_dashes: { tier: 'annotation', text: `Brontë leaves the year, county, shire and church blank, a common convention of discretion in fiction of the period.` },
    c_existence: { tier: 'annotation', text: `The first sentence in the novel to treat her as a person with legal standing. It is spoken to stop another woman’s wedding.` },
    c_funchal: { tier: 'criticism', by: 'Spivak 1985 · Valint 2017', text: `Jane’s uncle, John Eyre, is a merchant in Madeira who works for the Masons’ trading house. The commercial network that produced the first Mrs. Rochester’s dowry is the one that stops the second wedding. When John Eyre dies it also makes Jane an heiress, with twenty thousand pounds.\n\nCritics disagree about what this implicates. Readers following Spivak see Jane’s independence funded by colonial trade. Alexandra Valint argues that Jane’s uneasy handling of the legacy, which she divides with her cousins, keeps her at a distance from it.` },
    c_witch: { tier: 'annotation', text: `The landlord’s word for her planning.` },
    c_knew: { tier: 'annotation', text: `He supposes she knew what had passed between her husband and the governess. No one in the novel tells her.` },
    c_dontknow: { tier: 'annotation', text: `The landlord marks his own story as hearsay.` },
    c_mile: { tier: 'annotation', text: `Heard a mile away. No witness repeats a word of it.` },
    c_heardhim: { tier: 'annotation', text: `His words are reported exactly: her name. Hers are reported only as volume. The landlord is also clear that Rochester got the servants out and went up to reach her.` },
    c_moral: { tier: 'context', by: 'Prichard, 1835', text: `The phrase is close to J. C. Prichard’s *moral insanity* (1835): madness of feeling and conduct, with the intellect intact. A diagnosis of this kind can be made from behaviour alone, and from behaviour judged by moral standards.` },
    c_fiend: { tier: 'annotation', reflect: 'fiend', text: `Brontë’s letter has the human disappearing and a “fiend-nature” taking its place, and names the right audience for it: “the truly good,” who pity.` },
    c_erred: { tier: 'annotation', text: `Brontë concedes too much horror and too little pity. She does not revise the diagnosis.` },
    c_sin: { tier: 'annotation', text: `In Rochester’s account her excesses caused her madness. In Brontë’s letter sin is itself a kind of madness. Both accounts join moral judgment to diagnosis.` }

  function readingPattern(s) {
    const ks = Object.keys(ACTS).filter(k => s.readings[k]).map(k => s.readings[k]);
    if (!ks.length) return 'You recorded no reading of her acts.';
    const all = v => ks.every(x => x === v);
    if (ks.length >= 2 && all('madness')) return 'Each time, you took the household’s word. That is the reading the novel was built to produce, and most of its first readers produced it.';
    if (ks.length >= 2 && all('resistance')) return 'You read every act as rebellion. It is a more generous story than Rochester’s, and it is still a story told about her, with motives she never states.';
    if (ks.length >= 2 && all('suffering')) return 'You read her as a victim each time. Pity is the feeling Brontë said she had underwritten. It still leaves you deciding what she felt.';
    if (ks.length >= 2 && all('open')) return 'You withheld judgment every time. That is faithful to the evidence. It is also the condition the household relied on: a woman about whom nothing can be decided can be kept indefinitely.';
    if (ks.length === 1) return 'You recorded one reading. One act is not yet a pattern.';
    return 'Your readings shifted from act to act. With a record this partial, inconsistency may be the most accurate response available.';

    rows.push({ label: 'Your readings', readings: Object.keys(ACTS).filter(k => s.readings[k]).map(k => [ACTS[k], READ_LABELS[s.readings[k]]]).concat(s.readings.placement ? [['The laugh’s placement (Ch. XII)', PLACEMENT[s.readings.placement]]] : []), note: readingPattern(s) });
    const notHeard = witnesses.filter(w => !s.heard.includes(w.id)).map(w => w.name);
    rows.push({ label: 'Witnesses heard', text: `${s.heard.length} of 7.` + (notHeard.length ? ` Not heard: ${notHeard.join('; ')}.` : ' You heard every account the record holds, except hers.') });
    if (s.role === 'reader') {

      rows.push({ label: 'Text or reading', text: ks.length ? `You told the text from your own reading ${right} of ${ks.length} times.` : 'You answered none of the reader’s checks.', note: ks.length && right < ks.length ? 'Over-reading is a close reader’s particular temptation: the more carefully you look, the more you find, including what you brought.' : '' });
    }
    if (s.role === 'judge') {

      rows.push({ label: 'Your questions', text: asked.length ? `You cross-examined ${asked.length} ${asked.length === 1 ? 'witness' : 'witnesses'}. Every answer came from that witness’s own words, or from silence.` : 'You put no questions to the witnesses.' });
    }
    if (s.role === 'rescuer') {
      const gone = acts.filter(a => (s.erased || []).includes(a.k)).map(a => a.ch);

    const ident = s.struck.filter(w => lexicon.find(l => l.w === w && l.identity));

    return rows;

<script>

window.addEventListener('DOMContentLoaded', function () {

  /* ------------------------------------------------------------ state */
  const fresh = () => ({ scene: 'threshold', role: null, heard: [], visited: [], opened: [], readings: {}, flags: [], erased: [], examined: [],
    struck: [], record: [], reflections: [], crossx: {}, checks: {}, finding: null, name: null, cited: [], decided: {},
    voice: { mode: null, text: '', tiles: [] }, marks: {} });

  const helpers = {

  /* ------------------------------------------------------------ small helpers */
  function el(tag, attrs, ...kids) {

  function titleCard(k, t, c, then) {

  /* ============================================================ BLOCKS ON PAPER */
  function addRecord(id, b) { if (!s.record.some(r => r.id === id)) s.record.push({ id, who: b.who, cite: b.cite, text: strip(b.text) }); }

    return el('div', { class: 'glass' },
      el('p', { class: 'glass-cap' }, el('span', { text: 'In the glass' }), el('span', { text: r.cite || '' })),

        el('div', { class: 'pane her' }, el('span', { class: 'pane-k', text: 'Her' }), el('span', { class: 'pane-t', html: inline(r.her) })),

  function block(raw, rid) {

      case 'p': return el('div', { class: 'nar', html: rich(b.text, true) });
      case 'h': return el('h4', { class: 'subh', text: b.text });

        addRecord(rid, b);
        return el('figure', { class: 'q' + (b.doc ? ' doc' : '') },
          el('figcaption', { class: 'cap' }, el('span', { class: 't', text: 'Verbatim' }), el('span', { text: b.cite }), el('span', { text: b.who })),

  function blocksInto(body, blocks, prefix) {

  /* reader: is it in the text, or in you? */
  function checkCard(b) {
    const card = el('div', { class: 'check' }, el('p', { class: 'check-k', text: 'A reader’s check' }), el('p', { class: 'check-c', text: b.claim }));

      el('button', { type: 'button', class: 'mini', onclick: () => pick('reading') }, 'My reading'));

  /* judge: one question, answered only from the record */
  function crossCard(w) {

  /* ============================================================ THE SHEET YOU HOLD */

  /* ============================================================ SCENE 01 · THE THRESHOLD */
  const TOOLS = {
    reader: `<svg viewBox="0 0 200 160"><circle cx="78" cy="70" r="46" fill="rgba(170,195,219,.12)" stroke="#b9a27a" stroke-width="9"/><circle cx="78" cy="70" r="46" fill="none" stroke="#6e5c47" stroke-width="2"/><path d="M62,48 C70,40 84,38 94,44" stroke="#fff" stroke-opacity=".35" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M112,104 L168,148" stroke="#3a2a1c" stroke-width="16" stroke-linecap="round"/><path d="M112,104 L124,114" stroke="#b9a27a" stroke-width="18"/></svg>`,

    const intro = el('div', { class: 'obj paper', style: '--x:50%;--y:27%;--r:-1deg;--px:50%;--py:33%;width:min(560px,86vw);padding:1.2rem 1.4rem;font-size:.95em;box-shadow:0 20px 30px -12px rgba(0,0,0,.8)' });
