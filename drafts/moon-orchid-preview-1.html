      if (!gs.length) body.append(el('p', { class: 'empty', text: 'Nothing yet. Open a phrase with a dotted underline.' }));
      gs.forEach(r => body.append(el('aside', { class: 'gloss', 'data-tier': r.tier },
        el('p', { class: 'gloss-cap' }, el('span', { class: 'cap-tier', 'data-tier': r.tier, text: TIER[r.tier] }), r.by ? el('span', { text: r.by }) : null),
        el('div', { class: 'gloss-body', html: rich(r.text, s, story, false) }))));
    }
    if (drawerTab === 'glass') {
      body.append(el('p', { class: 'drawer-lede', text: 'Each time she is described, someone else is standing beside her. These are the pairs you have found: what is said of her, and what it lets someone else become.' }));
      if (!s.reflections.length) body.append(el('p', { class: 'empty', text: 'The glass is empty so far.' }));
      s.reflections.forEach(id => body.append(renderGlass(story.reflections[id])));
    }
    if (drawerTab === 'words') {
      body.append(el('p', { class: 'drawer-lede', text: 'Words used of her in the passages you have read. Strike one and it will be drawn struck through wherever it appears from now on. The novel will still say it.' }));
      const avail = story.lexicon.filter(l => l.in.some(sc => s.visited.includes(sc)));
      if (!avail.length) body.append(el('p', { class: 'empty', text: 'None yet.' }));
      avail.forEach(l => {
        const on = s.struck.includes(l.w);
        const row = el('div', { class: 'word-row' + (on ? ' on' : '') },
          el('span', { class: 'word', html: on ? `<s class="struck">${esc(l.w)}</s>` : esc(l.w) }),
          el('span', { class: 'word-by', text: l.by }),
          el('button', { type: 'button', class: 'btn quiet small', 'aria-pressed': String(on), onclick: () => {
            s.struck = on ? s.struck.filter(x => x !== l.w) : s.struck.concat(l.w);
            save(); const y = window.scrollY; renderStory(); window.scrollTo(0, y); renderDrawer();
          } }, on ? 'Restore' : 'Strike'));
        body.append(row);
        if (on && l.identity) body.append(el('p', { class: 'word-warn', text: `This word is not an insult. It names ${l.identity}. Striking it removes something true about her along with the way she was described.` }));
      });
    }
    if (drawerTab === 'margin') {
      const labels = story.readLabels;
      body.append(el('p', { class: 'drawer-lede', text: 'What you have written into the record so far, in your own hand.' }));
      const rows = [];
      if (s.role) rows.push(['You came as', ({ reader: 'a reader', judge: 'a judge', rescuer: 'a rescuer' })[s.role]]);
      Object.keys(s.readings).forEach(k => rows.push(['Reading · ' + k, (labels[s.readings[k]] || s.readings[k])]));
      if (s.finding) rows.push(['Finding', s.finding]);
      if (s.name) rows.push(['Her name', ({ bertha: 'Bertha', mrs: 'Mrs. Rochester', antoinetta: 'Antoinetta', none: 'no name' })[s.name]]);
      if (s.voice.mode === 'tiles' || s.voice.mode === 'write') rows.push(['Her testimony', s.voice.text]);
      if (s.voice.mode === 'silence') rows.push(['Her testimony', 'left blank']);
      if (!rows.length) body.append(el('p', { class: 'empty', text: 'Nothing yet.' }));
      body.append(el('dl', { class: 'margin-dl' }, rows.map(([a, b]) => [el('dt', { text: a }), el('dd', { class: 'hand', text: b })])));
    }
    if (drawerTab === 'key') {
      body.append(el('p', { class: 'drawer-lede', text: 'Every passage and note is marked by where it comes from, so you can tell the novel from what has been said about it, and both from what this game invents.' }));
      const key = [
        ['text', 'Quoted word for word from the novel, or from Brontë’s 1848 letter. Ellipses mark cuts.'],
        ['annotation', 'This game’s reading of the passage. An argument, not a fact; test it against the text.'],
        ['context', 'History outside the novel: law, medicine, empire.'],
        ['criticism', 'A named critic’s argument, paraphrased in a sentence or two.'],
        ['conjecture', 'Invented here. Not in the novel and not claimed to be.'],
        ['margin', 'Your own words and choices.']
      ];
      key.forEach(([t, d]) => body.append(el('div', { class: 'key-row' }, el('span', { class: 'cap-tier', 'data-tier': t, text: TIER[t] }), el('p', { text: d }))));
      body.append(el('p', { class: 'key-extra' }, 'Phrases with a ', el('span', { class: 'clue demo', text: 'dotted underline' }), ' open notes. ', el('span', { class: 'struck', text: 'Struck' }), ' words are ones you have objected to under “Words.” Pairs marked “In the glass” are collected under “Glass.”'));
    }
  }

  /* ============================================================ ROUTING */
  function navigate(hash) {
    const target = hash ? '#' + hash : '';
    if (location.hash === target || (target === '' && !location.hash)) route();
    else location.hash = target;
  }
  function route() {
    const h = location.hash.replace(/^#/, '');
    if (h === 'reading-room') showHub();
    else if (UH.stories[h]) openStory(h);
    else showLanding();
  }
  window.addEventListener('hashchange', route);
  UH._debug = { get state() { return cur && cur.s; }, go: id => go(id), store: () => store };
  route();
});

</script>
<script>
/* ---- art.js ---- */
/* Unwriting Her: scene art.
   Each entry returns an SVG drawn like an etching in candlelight. Elements with
   data-ex="<id>" are objects the player can examine; data-go="<scene>" are doors to other scenes.
   Art reacts to state through classes the engine sets on the stage (beat-N, flags). */
(function () {
  const UH = window.UH;
  const INK = '#6e5c47', FAINT = '#3a3028', DEEP = '#0b0907', TALLOW = '#dcae67', GLASS = '#aac3db', WAX = '#c55c4c';
  const f = n => (Math.round(n * 10) / 10).toString();
  const poly = pts => pts.map(p => f(p[0]) + ',' + f(p[1])).join(' ');
  function rng(seed) { let x = seed; return () => { x = (x * 16807) % 2147483647; return (x - 1) / 2147483646; }; }
  // one-point perspective
  const P = (X, Y, Z, fl = 520, cx = 500, cy = 470) => [cx + fl * X / Z, cy - fl * Y / Z];

  const DEFS = `<defs>
    <radialGradient id="g-candle" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="${TALLOW}" stop-opacity=".55"/><stop offset=".35" stop-color="${TALLOW}" stop-opacity=".16"/><stop offset="1" stop-color="${TALLOW}" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-moon" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="${GLASS}" stop-opacity=".5"/><stop offset=".4" stop-color="${GLASS}" stop-opacity=".12"/><stop offset="1" stop-color="${GLASS}" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-fire" cx="50%" cy="60%" r="55%"><stop offset="0" stop-color="#f0b45e" stop-opacity=".85"/><stop offset=".3" stop-color="${WAX}" stop-opacity=".45"/><stop offset="1" stop-color="${WAX}" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-vig" cx="50%" cy="48%" r="72%"><stop offset=".45" stop-color="${DEEP}" stop-opacity="0"/><stop offset="1" stop-color="${DEEP}" stop-opacity=".92"/></radialGradient>
    <linearGradient id="g-glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c232b"/><stop offset=".45" stop-color="#0d1014"/><stop offset=".55" stop-color="#151b22"/><stop offset="1" stop-color="#090b0e"/></linearGradient>
    <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0e13"/><stop offset=".7" stop-color="#16161a"/><stop offset="1" stop-color="#1d1915"/></linearGradient>
    <linearGradient id="g-dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101318"/><stop offset=".55" stop-color="#2a2420"/><stop offset=".7" stop-color="#5a3f2c"/><stop offset="1" stop-color="#14100d"/></linearGradient>
    <radialGradient id="g-dark" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#030202" stop-opacity=".98"/><stop offset=".6" stop-color="#050404" stop-opacity=".8"/><stop offset="1" stop-color="#050404" stop-opacity="0"/></radialGradient>
    <linearGradient id="g-shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${DEEP}" stop-opacity="0"/><stop offset="1" stop-color="${DEEP}" stop-opacity=".95"/></linearGradient>
    <filter id="f-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="f-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="f-grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .9  0 0 0 0 .8  0 0 0 0 .65  0 0 0 .035 0"/></filter>
  </defs>`;
  const svg = (body, label, fit) => `<svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${label}">${DEFS}<rect width="1000" height="1000" fill="#110e0b"/>${fit ? `<g transform="translate(500 600) scale(${fit}) translate(-500 -600)">${body}</g>` : body}<rect width="1000" height="1000" fill="url(#g-vig)" pointer-events="none"/><rect width="1000" height="1000" filter="url(#f-grain)" pointer-events="none"/></svg>`;
  const glow = (cx, cy, r, id = 'g-candle', cls = '') => `<circle class="${cls}" cx="${cx}" cy="${cy}" r="${r}" fill="url(#${id})" pointer-events="none"/>`;
  const flame = (x, y, s = 1) => `<g class="flame" transform="translate(${x} ${y}) scale(${s})"><path d="M0,-34 C9,-20 10,-8 0,0 C-10,-8 -9,-20 0,-34Z" fill="${TALLOW}" opacity=".95"/><path d="M0,-22 C4,-14 4,-6 0,-2 C-4,-6 -4,-14 0,-22Z" fill="#fff3d6" opacity=".8"/></g>`;
  const candle = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-9" y="0" width="18" height="70" fill="#cfc2a6" opacity=".75"/><path d="M-26,72 h52 l-6,10 h-40z" fill="none" stroke="${INK}" stroke-width="2"/><line x1="0" y1="0" x2="0" y2="-6" stroke="#222" stroke-width="2"/>${flame(0, -4)}</g>`;
  const seenX = (s, id) => !!(s && s.explored && (s.explored[s.scene] || []).includes(id));
  const obj = (s, id, inner) => hot(id, `<g class="obj${seenX(s, id) ? ' seen' : ''}">${inner}</g>`);
  const hot = (id, inner, kind = 'ex') => kind === 'none' ? `<g>${inner}</g>` : `<g class="hot" data-${kind}="${id}" tabindex="0" role="button" aria-label="${id}">${inner}</g>`;

  /* -------------------------------------------------- corridor */
  function corridor(s, beat, opts = {}) {
    const near = 0.62, far = 7;
    let b = '';
    // walls, floor, ceiling edges
    [[-1, -1], [1, -1], [-1, 1.25], [1, 1.25]].forEach(([X, Y]) => { const a = P(X, Y, near), c = P(X, Y, far); b += `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(c[0])}" y2="${f(c[1])}" stroke="${INK}" stroke-width="1.4"/>`; });
    const fw = [P(-1, -1, far), P(1, -1, far), P(1, 1.25, far), P(-1, 1.25, far)];
    b += `<polygon points="${poly(fw)}" fill="#0e0c0a" stroke="${INK}" stroke-width="1.2"/>`;
    const win = [P(-0.26, 0, far), P(0.26, 0, far), P(0.26, 0.78, far), P(-0.26, 0.78, far)];
    b += glow(500, 440, 120, 'g-moon') + (opts.open ? `<polygon points="${poly(win)}" fill="#24303c" stroke="${GLASS}" stroke-width="1" opacity=".9"/>` : obj(s, 'window', `<polygon points="${poly(win)}" fill="#24303c" stroke="${GLASS}" stroke-width="1" opacity=".9"/>`));
    b += `<line x1="500" y1="${f(win[0][1])}" x2="500" y2="${f(win[2][1])}" stroke="#0e0c0a" stroke-width="1.5"/>`;
    // floorboards
    [-0.6, -0.2, 0.2, 0.6].forEach(X => { const a = P(X, -1, near), c = P(X, -1, far); b += `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(c[0])}" y2="${f(c[1])}" stroke="${FAINT}" stroke-width="1"/>`; });
    // moonlight on floor
    b += `<polygon points="${poly([P(-0.26, -1, far), P(0.26, -1, far), P(0.5, -1, 2.2), P(-0.5, -1, 2.2)])}" fill="${GLASS}" opacity=".05"/>`;
    // doors
    const zs = [1.35, 2.35, 3.35, 4.35, 5.35];
    [-1, 1].forEach(X => zs.forEach((z, k) => {
      const d = [P(X, -1, z), P(X, -1, z + 0.45), P(X, 0.55, z + 0.45), P(X, 0.55, z)];
      const isLaugh = X === 1 && k === 2;
      const shape = `<polygon points="${poly(d)}" fill="#070605" stroke="#4a3d30" stroke-width="1.3"/>`;
      if (isLaugh) {
        const s1 = P(X, -0.985, z), s2 = P(X, -0.985, z + 0.45);
        const seam = `<line class="seam" x1="${f(s1[0])}" y1="${f(s1[1])}" x2="${f(s2[0])}" y2="${f(s2[1])}" stroke="${TALLOW}" stroke-width="3"/><line class="seam seam-glow" x1="${f(s1[0])}" y1="${f(s1[1])}" x2="${f(s2[0])}" y2="${f(s2[1])}" stroke="${TALLOW}" stroke-width="10" filter="url(#f-glow)"/>`;
        if (opts.open) {
          const o = [P(X, -1, z), P(X - 0.42, -1, z + 0.05), P(X - 0.42, 0.55, z + 0.05), P(X, 0.55, z)];
          b += `<polygon points="${poly(d)}" fill="${TALLOW}" opacity=".35"/><polygon points="${poly([P(X, -1, z), P(X, -1, z + 0.45), P(0.1, -1, z + 0.2), P(0.2, -1, z - 0.4)])}" fill="${TALLOW}" opacity=".12"/><polygon points="${poly(o)}" fill="#0a0807" stroke="#4a3d30" stroke-width="1.3"/>`;
        } else b += obj(s, 'door', shape + seam);
      } else if (X === -1 && k === 0 && !opts.open) b += obj(s, 'doors', shape);
      else b += shape;
      const kn = P(X, -0.2, z + (X < 0 ? 0.36 : 0.36));
      b += `<circle cx="${f(kn[0])}" cy="${f(kn[1])}" r="${f(18 / z)}" fill="#3a3028"/>`;
    }));
    if (opts.keys) b += `<g transform="translate(470 900)"><circle r="16" fill="none" stroke="${TALLOW}" stroke-width="2.5"/><line x1="12" y1="10" x2="60" y2="34" stroke="${TALLOW}" stroke-width="3"/><line x1="44" y1="26" x2="40" y2="40" stroke="${TALLOW}" stroke-width="3"/></g>`;
    b += glow(500, 980, 420);
    return svg(b, 'A long, low corridor of small black doors with one little window at the far end');
  }

  /* -------------------------------------------------- roof */
  function leads(s, beat, opts = {}) {
    const r = rng(7);
    let b = `<rect width="1000" height="1000" fill="url(#g-sky)"/>`;
    for (let i = 0; i < 70; i++) b += `<circle cx="${f(r() * 1000)}" cy="${f(r() * 520)}" r="${f(r() * 1.6 + 0.4)}" fill="#d9d3c4" opacity="${f(r() * 0.5 + 0.15)}"/>`;
    b += glow(760, 170, 160, 'g-moon') + `<circle cx="760" cy="170" r="34" fill="#cfd8df" opacity=".75"/>`;
    const hills = `<path d="M0,610 C120,580 220,600 330,585 C450,568 560,600 680,590 C800,578 900,596 1000,585 L1000,700 L0,700Z" fill="#14130f"/>`;
    b += opts.fire ? hills : obj(s, 'horizon', hills);
    b += `<path d="M0,640 C150,625 260,648 400,636 C560,622 700,650 1000,632 L1000,720 L0,720Z" fill="#100f0c"/>`;
    for (let i = 0; i < 9; i++) b += `<path d="M${f(-50 + i * 130)},${f(660 + i % 3 * 6)} Q${f(30 + i * 130)},${f(650 + i % 2 * 8)} ${f(110 + i * 130)},${f(668)}" stroke="${FAINT}" fill="none"/>`;
    // battlements
    let cren = 'M0,1000 L0,770 ';
    for (let x = 0; x < 1000; x += 120) cren += `L${x},770 L${x},720 L${x + 70},720 L${x + 70},770 `;
    cren += 'L1000,770 L1000,1000Z';
    b += `<path d="${cren}" fill="#0c0a08" stroke="${INK}" stroke-width="1.4"/>`;
    for (let y = 800; y < 1000; y += 34) b += `<line x1="0" y1="${y}" x2="1000" y2="${y}" stroke="${FAINT}" stroke-width=".8"/>`;
    if (opts.fire) {
      b += glow(500, 1000, 700, 'g-fire', 'fireglow') + `<path d="M0,1000 L0,770 L1000,770 L1000,1000Z" fill="${WAX}" opacity=".1"/>`;
      b += `<path class="smoke" d="M300,720 C320,600 260,520 330,420 C380,350 340,260 400,180" stroke="#5a4d40" stroke-width="40" fill="none" opacity=".18" filter="url(#f-soft)"/>`;
    } else {
      b += obj(s, 'trapdoor', `<polygon points="440,880 560,880 590,960 410,960" fill="#060504" stroke="${INK}" stroke-width="1.2"/><polygon class="trap-glow" points="440,880 560,880 590,960 410,960" fill="${TALLOW}" opacity="0"/>`);
    }
    return svg(b, opts.fire ? 'The battlements against a sky lit by fire' : 'The flat lead roof at night, with battlements, fields and a dim sky-line');
  }

  /* -------------------------------------------------- the gallery of witnesses */
  function gallery(s) {
    const order = ['rochester', 'mason', 'grace', 'jane', 'register', 'host', 'author', 'bertha'];
    const names = { rochester: 'ROCHESTER', mason: 'MASON', grace: 'POOLE', jane: 'EYRE', register: 'THE REGISTER', host: 'THE LANDLORD', author: 'BRONTË', bertha: '' };
    const story = UH.stories.bertha;
    let b = `<rect x="0" y="0" width="1000" height="1000" fill="#120f0c"/><line x1="0" y1="935" x2="1000" y2="935" stroke="${INK}"/>`;
    for (let x = 0; x < 1000; x += 90) b += `<line x1="${x}" y1="935" x2="${x}" y2="1000" stroke="${FAINT}"/>`;
    order.forEach((id, i) => {
      const col = i % 3, row = Math.floor(i / 3);
      const w = 168, h = 196, x = 205 + col * 210 + (row === 2 ? 105 : 0), y = 110 + row * 285;
      const heard = s.heard.includes(id);
      const w0 = story && story.witnesses.find(w => w.id === id);
      let fr = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#0a0807" stroke="${INK}" stroke-width="3"/><rect x="${x + 12}" y="${y + 12}" width="${w - 24}" height="${h - 24}" fill="url(#g-glass)" stroke="#4a3d30" stroke-width="1.2" opacity=".9"/>`;
      fr += `<line x1="${x + 30}" y1="${y + 30}" x2="${x + 70}" y2="${y + 80}" stroke="${GLASS}" stroke-width="1" opacity=".18"/>`;
      if (id === 'bertha') {
        fr = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${INK}" stroke-width="2" stroke-dasharray="6 6"/><path d="M${x - 6},${y - 4} C${x + 40},${y + 30} ${x + 140},${y + 20} ${x + w + 6},${y - 4} L${x + w - 4},${y + h + 10} C${x + 120},${y + h - 10} ${x + 60},${y + h + 16} ${x + 4},${y + h + 6}Z" fill="#2a231c" stroke="#4a3d30"/><path d="M${x + 40},${y + 20} C${x + 60},${y + 110} ${x + 50},${y + 170} ${x + 70},${y + h}" stroke="#1d1813" fill="none" stroke-width="3"/><path d="M${x + 120},${y + 14} C${x + 110},${y + 100} ${x + 130},${y + 160} ${x + 118},${y + h}" stroke="#1d1813" fill="none" stroke-width="3"/>`;
        b += `<g class="covered">${fr}<text x="${x + w / 2}" y="${y + h + 40}" text-anchor="middle" font-family="Courier Prime, monospace" font-size="15" letter-spacing="2" fill="#7d725f">NOT CALLED</text></g>`;
        return;
      }
      fr += `<rect x="${x + w / 2 - 70}" y="${y + h + 18}" width="140" height="28" fill="#1d1813" stroke="#4a3d30"/><text x="${x + w / 2}" y="${y + h + 37}" text-anchor="middle" font-family="Courier Prime, monospace" font-size="13" letter-spacing="1.5" fill="${heard ? TALLOW : '#ab9f88'}">${names[id]}</text>`;
      if (heard) fr += `<rect x="${x + 12}" y="${y + 12}" width="${w - 24}" height="${h - 24}" fill="${TALLOW}" opacity=".08"/>`;
      b += hot(w0 ? w0.scene : '', `<g class="frame${heard ? ' heard' : ''}">${fr}</g>`, 'go');
    });
    [[150, 300], [850, 300]].forEach(([x, y]) => { b += glow(x, y, 170) + candle(x, y + 10, 0.6); });
    return svg(b, 'A wall of empty portrait frames, one for each witness, and one covered with a cloth');
  }

  /* -------------------------------------------------- the room without a window */
  function room(s, beat, opts = {}) {
    const seen = id => opts.inspect ? s.examined.includes(id) : seenX(s, id);
    let b = `<rect width="1000" height="760" fill="#14100d"/><polygon points="0,760 1000,760 1000,1000 0,1000" fill="#0f0c0a"/>`;
    for (let i = -6; i <= 6; i++) b += `<line x1="${500 + i * 40}" y1="760" x2="${500 + i * 220}" y2="1000" stroke="${FAINT}" stroke-width=".9"/>`;
    b += `<line x1="0" y1="760" x2="1000" y2="760" stroke="${INK}" stroke-width="1.3"/>`;
    // the fire, fenced
    let fire = `<rect x="90" y="470" width="250" height="290" fill="#0c0a08" stroke="${INK}" stroke-width="2"/><rect x="70" y="450" width="290" height="22" fill="#1a1511" stroke="${INK}" stroke-width="1.5"/><path d="M130,760 L130,570 Q215,520 300,570 L300,760Z" fill="#060504"/>`;
    fire += glow(215, 720, 160, 'g-fire', 'fireglow') + `<path class="fire-tongue" d="M175,760 C180,710 205,700 200,660 C230,690 240,720 255,760Z" fill="#e39a4f" opacity=".75"/>`;
    let fender = `<line x1="105" y1="640" x2="325" y2="640" stroke="${INK}" stroke-width="4"/>`;
    for (let x = 110; x <= 320; x += 15) fender += `<line x1="${x}" y1="640" x2="${x}" y2="770" stroke="${INK}" stroke-width="3"/>`;
    b += hot('fire', `<g class="obj${seen('fire') ? ' seen' : ''}">${fire}${fender}</g>`);
    // the lamp on its chain
    let lamp = `<line x1="520" y1="0" x2="520" y2="250" stroke="${INK}" stroke-width="2" stroke-dasharray="7 4"/><path d="M490,250 L550,250 L540,320 L500,320Z" fill="#2a231c" stroke="${INK}" stroke-width="1.5"/>`;
    lamp += glow(520, 300, 230) + `<ellipse cx="520" cy="300" rx="12" ry="16" fill="${TALLOW}" opacity=".8"/>`;
    b += hot('lamp', `<g class="obj${seen('lamp') ? ' seen' : ''}">${lamp}</g>`);
    // the tapestry, drawn back from a second door

Within the chapter, the woman listening to him will refuse to stay as his mistress.` },
    c_partofme: { tier: 'context', by: 'Coverture', text: `Rochester complains that the law calls her a part of him. Under coverture the fiction ran the other way. It was the wife whose legal existence was absorbed into the husband’s, along with her fortune.` },
    c_doctors: { tier: 'context', text: `No doctor is named. No examination is described, no certificate shown. The diagnosis arrives in a subordinate clause, as the reason he could not divorce her.\n\nBefore the Matrimonial Causes Act of 1857, an English divorce that allowed remarriage took a private Act of Parliament: rare, costly, and in practice granted almost only for a wife’s adultery. Rochester has just called her *unchaste*. In his own account, the finding of madness is what closes the legal way out and makes the marriage permanent.` },

    c_funchal: { tier: 'criticism', by: 'Spivak 1985 · Valint 2017', text: `Jane’s uncle, John Eyre, is a merchant in Madeira who works for the Masons’ trading house. The commercial network that produced the first Mrs. Rochester’s dowry is the one that stops the second wedding. When John Eyre dies it also makes Jane an heiress, with twenty thousand pounds.\n\nCritics disagree about what this implicates. Readers following Spivak see Jane’s independence funded by colonial trade. Alexandra Valint argues that Jane’s uneasy handling of the legacy, which she divides with her cousins, keeps her at a distance from it.` },

      { q: 'Why is she upstairs?', a: Q('Jane Eyre', 'Ch. XXVII', `“It is cruel—she cannot help being mad.”`) }
    ],
    register: [
      { q: 'Who is she?', a: Q('Mr. Briggs, reading Mason’s statement', 'Ch. XXVI', `“…my sister, Bertha Antoinetta Mason, daughter of Jonas Mason, merchant, and of Antoinetta his wife, a Creole…”`) },
      { q: 'Is she mad?', a: null },
      { q: 'Where is she?', a: Q('Richard Mason', 'Ch. XXVI', `“She is now living at Thornfield Hall… I saw her there last April. I am her brother.”`) }
    ],
    host: [
      { q: 'Did you ever see her?', a: Q('The landlord', 'Ch. XXXVI', `“She was a big woman, and had long black hair: we could see it streaming against the flames as she stood.”`) },
      { q: 'What did she shout?', a: Q('The landlord', 'Ch. XXXVI', `“…shouting out till they could hear her a mile off.”`) },
      { q: 'How do you know all this?', a: Q('The landlord', 'Ch. XXXVI', `“They say she had nearly burnt her husband in his bed once: but I don’t know about that.”`) }
    ],
    author: [
      { q: 'Who is she?', a: Q('Charlotte Brontë', 'Letter, 4 Jan. 1848', `“…all that is good or even human seems to disappear from the mind and a fiend-nature replaces it.”`) },
      { q: 'What should a reader feel?', a: Q('Charlotte Brontë', 'Letter, 4 Jan. 1848', `“…profound pity ought to be the only sentiment elicited by the view of such degradation…”`) },
      { q: 'Would you write her differently?', a: Q('Charlotte Brontë', 'Letter, 4 Jan. 1848', `“…I have erred in making horror too predominant.”`) }
    ]
  };

  /* ------------------------------------------------------- afterword */
  const ENDINGS = { door: 'The Door', keeper: 'The Keeper', roof: 'The Witness', unwritten: 'Unwritten', shore: 'The Other Shore', close: 'The Reader Leaves', margin: 'The Margin', mistrial: 'Mistrial', safe: 'Safekeeping' };
  const ROLE_LINE = {
    reader: { door: 'You came only to read, and you ended by turning a key.', keeper: 'You came to read, and you ended by keeping the house in order.', roof: 'You came to read, and you read to the end, including the part the novel only reports.', unwritten: 'You came to read, and you ended by removing the text.', shore: 'You came to read, and you followed the text to the place where it stops.', close: 'You came to read, and you stopped.', margin: 'You came to read, and you ended by writing: the one change a reader can make to a book.' },
    judge: { door: 'You came to judge. You acted on your own verdict, and she was not consulted about the sentence.', keeper: 'You came to judge, and your last act enforced the existing order.', roof: 'You came to judge, and in the end you only witnessed. That may be the more honest role.', unwritten: 'You came to judge, and you ended by giving up the bench entirely.', shore: 'You came to judge, and you went looking for evidence the court never had.', close: 'You came to judge, and you adjourned indefinitely.', mistrial: 'You came to judge, and you ruled that judging her was impossible in this house.' },
    rescuer: { door: 'You came to rescue her, and you did: you chose the moment and the means. She did not ask you to.', keeper: 'You came to rescue her, and you ended by securing her door.', roof: 'You came to rescue her, and you watched. This rescue may never have been yours to make.', unwritten: 'You came to rescue her, and in the end you let her act without you. It is the only ending in which you are not the hero.', shore: 'You came to rescue her and went back to before she needed rescuing, and found almost nothing there.', close: 'You came to rescue her, and you left her where you found her.', safe: 'You came to rescue her, and you kept her: safe, unharmed, and with fewer acts to her name.' }
  };
  const FINDING = { mad: 'You found her mad.', notproven: 'Not proven.', incompetent: 'You declined to judge her.', adjourn: 'You adjourned the hearing to hear her.' };
  const NAMES = { bertha: 'Bertha', mrs: 'Mrs. Rochester', antoinetta: 'Antoinetta', none: 'No name' };

  function readingPattern(s) {
    const ks = Object.keys(ACTS).filter(k => s.readings[k]).map(k => s.readings[k]);
    if (!ks.length) return 'You recorded no reading of her acts.';
    const all = v => ks.every(x => x === v);
    if (ks.length >= 2 && all('madness')) return 'Each time, you took the household’s word. That is the reading the novel was built to produce, and most of its first readers produced it.';
    if (ks.length >= 2 && all('resistance')) return 'You read every act as rebellion. It is a more generous story than Rochester’s, and it is still a story told about her, with motives she never states.';
    if (ks.length >= 2 && all('suffering')) return 'You read her as a victim each time. Pity is the feeling Brontë said she had underwritten. It still leaves you deciding what she felt.';
    if (ks.length >= 2 && all('open')) return 'You withheld judgment every time. That is faithful to the evidence. It is also the condition the household relied on: a woman about whom nothing can be decided can be kept indefinitely.';
    if (ks.length === 1) return 'You recorded one reading. One act is not yet a pattern.';
    return 'Your readings shifted from act to act. With a record this partial, inconsistency may be the most accurate response available.';
  }

  function afterword(s) {
    const rows = [];
    rows.push({ label: 'You came as', text: ({ reader: 'A reader', judge: 'A judge', rescuer: 'A rescuer' })[s.role] || '—', note: (ROLE_LINE[s.role] || {})[s.ending] || '' });
    rows.push({ label: 'Your finding', text: FINDING[s.finding] || 'You did not close the hearing.' });
    rows.push({ label: 'Her name in your record', text: s.voice.mode === 'unasked' ? 'You did not name her.' : (NAMES[s.name] || '—') });
    rows.push({ label: 'Her testimony', voice: true, text: ({ unasked: 'You did not call her as a witness.', silence: 'You left the page blank.', tiles: 'A statement assembled from the record:', write: 'Written in your hand:' })[s.voice.mode] || 'Not entered.' });
    rows.push({ label: 'Your readings', readings: Object.keys(ACTS).filter(k => s.readings[k]).map(k => [ACTS[k], READ_LABELS[s.readings[k]]]).concat(s.readings.placement ? [['The laugh’s placement (Ch. XII)', PLACEMENT[s.readings.placement]]] : []), note: readingPattern(s) });
    const notHeard = witnesses.filter(w => !s.heard.includes(w.id)).map(w => w.name);
    rows.push({ label: 'Witnesses heard', text: `${s.heard.length} of 7.` + (notHeard.length ? ` Not heard: ${notHeard.join('; ')}.` : ' You heard every account the record holds, except hers.') });
    if (s.role === 'reader') {
      const ks = Object.keys(s.checks || {});
      const right = ks.filter(k => s.checks[k]).length;
      rows.push({ label: 'Text or reading', text: ks.length ? `You told the text from your own reading ${right} of ${ks.length} times.` : 'You answered none of the reader’s checks.', note: ks.length && right < ks.length ? 'Over-reading is a close reader’s particular temptation: the more carefully you look, the more you find, including what you brought.' : '' });
    }
    if (s.role === 'judge') {
      const asked = Object.keys(s.crossx || {});
      rows.push({ label: 'Your questions', text: asked.length ? `You cross-examined ${asked.length} ${asked.length === 1 ? 'witness' : 'witnesses'}. Every answer came from that witness’s own words, or from silence.` : 'You put no questions to the witnesses.' });
    }
    if (s.role === 'rescuer') {
      const gone = acts.filter(a => (s.erased || []).includes(a.k)).map(a => a.ch);
      rows.push({ label: 'What you prevented', text: gone.length ? `Her acts in ${gone.join(', ')}.` : 'Nothing. You let every night happen.', note: gone.length ? 'Each rescue worked, and each removed something she did from the record.' : '' });
    }
    const ident = s.struck.filter(w => lexicon.find(l => l.w === w && l.identity));
    rows.push({ label: 'Words you struck', text: s.struck.length ? s.struck.join(', ') + '.' : 'None.', note: s.struck.length ? 'The novel still says them. Striking a word records an objection; it does not recover what should have been said instead.' + (ident.length ? ` You also struck words that said who she was (${ident.join(', ')}), not only what she was called.` : '') : 'You can strike words from the Record, under “Words for her.”' });
    return rows;
  }

  /* the player's own reflections, for the thesis */
  function youGlass(s) {
    const out = [];
    const role = { reader: ['a text to be read closely', 'the careful reader'], judge: ['the accused', 'the judge'], rescuer: ['the one who needs rescuing', 'the rescuer'] }[s.role];
    if (role) out.push(role);
    const f = { mad: ['mad', 'the sane court that found her so'], notproven: ['not proven', 'the court that withheld a verdict, and the key'], incompetent: ['beyond judgment', 'the one who declined to judge'], adjourn: ['a witness, at last', 'the court that called her'] }[s.finding];
    if (f) out.push(f);
    const v = { tiles: ['a sentence made of others’ words', 'the one who arranged them'], write: ['words in your hand', 'her author'], silence: ['a blank page', 'the one who left it blank'], unasked: ['unasked', 'the one who left without asking'] }[s.voice.mode];
    if (v) out.push(v);
    const counts = {};
    Object.keys(ACTS).forEach(k => { if (s.readings[k]) counts[s.readings[k]] = (counts[s.readings[k]] || 0) + 1; });
    const top = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
    const r = { resistance: ['a rebel', 'a reader who admires rebels'], madness: ['mad', 'a reader who can tell'], suffering: ['a victim', 'a reader who pities'], open: ['undecidable', 'a reader who keeps an open mind'] }[top];
    if (r) out.push(r);
    const e = { door: ['freed', 'the liberator'], keeper: ['kept safe', 'the keeper'], roof: ['the subject of a witness', 'the witness'], unwritten: ['erased, or free', 'the one who stepped back'], shore: ['a blank in the archive', 'the archivist'], close: ['left where she was', 'the reader who left'], margin: ['a sentence in a book', 'the note beside it'], mistrial: ['undecided', 'the court that could not try her'], safe: ['safe, and silent', 'her second keeper'] }[s.ending];
    if (e) out.push(e);
    return out.map(([her, other]) => ({ her, other, who: 'you' }));
  }

  const sources = [
    'Charlotte Brontë, *Jane Eyre: An Autobiography* (1847).',
    'Charlotte Brontë, letter to W. S. Williams, 4 January 1848.',
    'William Blackstone, *Commentaries on the Laws of England*, Book I, ch. 15 (1765).',
    'James Cowles Prichard, *A Treatise on Insanity and Other Disorders Affecting the Mind* (1835).',
    'Virginia Woolf, *A Room of One’s Own* (1929).',
    'Michel Foucault, *Histoire de la folie à l’âge classique* (1961); English as *History of Madness*.',
    'Jean Rhys, *Wide Sargasso Sea* (1966).',
    'Sandra M. Gilbert and Susan Gubar, *The Madwoman in the Attic* (1979).',
    'Gayatri Chakravorty Spivak, “Three Women’s Texts and a Critique of Imperialism,” *Critical Inquiry* 12.1 (1985); “Can the Subaltern Speak?” (1988).',
    'Elaine Showalter, *The Female Malady: Women, Madness and English Culture, 1830–1980* (1985).',
    'Susan L. Meyer, “Colonialism and the Figurative Strategy of *Jane Eyre*,” *Victorian Studies* 33.2 (1990).',
    'Toni Morrison, *Playing in the Dark: Whiteness and the Literary Imagination* (1992).',
    'Miranda Fricker, *Epistemic Injustice: Power and the Ethics of Knowing* (2007).',
    'Alexandra Valint, “Madeira and *Jane Eyre*’s Colonial Inheritance,” *Victorian Literature and Culture* 45.2 (2017).'
  ];

  UH.registerStory({
    id: 'bertha',
    title: 'The Third Storey',
    heroine: 'Bertha Antoinetta Mason',
    start: 'threshold',
    clues, reflections, lexicon, witnesses, missingWitness, scenes, tiles, acts, crossx,
    witnessLimit: s => s.role === 'judge' ? 4 : null,
    enterWitness: (s, w) => s.role === 'rescuer' && w.rescue && !s.flags.includes('rescue-' + w.id) ? w.rescue : w.scene,
    roleChip: s => ({ reader: 'Reader', judge: `Judge · ${Math.min(s.heard.length, 4)}/4`, rescuer: `Rescuer · ${(s.erased || []).length}/3` })[s.role] || null,
    silenceOpen: 'The page is hers. Nothing is written on it.',
    silenceClose: `This is everything the novel lets her do. Read as a sentence, it is not nothing. You have not put words in her mouth, and whatever she does next she will do without your dialogue.`,
    endings: ENDINGS,
    readLabels: READ_LABELS,
    afterword, youGlass, sources,
    sourceNote: 'Quotations from the novel and from the 1848 letter are verbatim; ellipses mark omissions. Critical positions are paraphrased and attributed. Scenes marked as staged or invented are this game’s, not Brontë’s.',
    vars: s => ({ name: nameOf(s), Name: nameOf(s).charAt(0).toUpperCase() + nameOf(s).slice(1) })
  });
})();

</script>
<script>
/* ---- chapters/moon-orchid/content.js ---- */
/* Before She Answers: the Moon Orchid chapter. Authored content only.

   The Woman Warrior (1976) is in copyright, so nothing here quotes Kingston. Every passage marked "Retold" is a
   close paraphrase of an event in "At the Western Palace", in this game's words, with no invented events or speech.
   Where the book reports what someone said, the paraphrase reports it; it does not script it.

   Markup: [[visible words|clueId]] opens a note; *words* is italic.
   Steps:  R(text)   a retold passage from the chapter
           N(text)   the game's own connecting line (kept short, never adds events)
           SEEN(id)  a "Seen as" pair: how she is seen, set against what the text shows
   A beat may carry a reading (choose an interpretation; the analysis follows) or a word (whose word the account keeps). */
(function () {
  'use strict';
  const CH = 'Ch. 4 · At the Western Palace';
  const R = (text, o) => Object.assign({ t: 'r', text, cite: CH }, o || {});
  const N = text => ({ t: 'n', text });
  const SEEN = id => ({ t: 'seen', id });

  const WHO = {
    mo: { name: 'Moon Orchid' }, bo: { name: 'Brave Orchid' }, niece: { name: 'Moon Orchid’s daughter' },
    children: { name: 'Brave Orchid’s children' }, none: { name: 'No one' }
  };
  const MOVEMENTS = { I: { n: 'I', title: 'Arrivals' }, II: { n: 'II', title: 'A Place in the Household' }, III: { n: 'III', title: 'The Rehearsal' } };

  /* ------------------------------------------------------------------ notes */
  const clues = {
    c_noI: { tier: 'annotation', text: 'Every other chapter of *The Woman Warrior* has an “I” in it. This one does not. The narrator who tells the rest of the book disappears, and the chapter is told in the third person, like a story heard rather than lived.\n\nIn the next chapter she admits it: she was not there for the confrontation in Los Angeles. Her brother told the story to her sister, and her sister told her. The account of Moon Orchid reaches us third-hand.' },
    c_versions: { tier: 'criticism', by: 'Boardman, 1991', text: 'Kathleen Boardman points out that the meeting between Moon Orchid and her husband exists in two versions, the one told in this chapter and the brother’s plainer one in the next, and that Kingston declines to choose between them. The book’s point is not which version is true but that every account of Moon Orchid has passed through someone else.' },
    c_aloft: { tier: 'annotation', text: 'Brave Orchid believes her attention holds the plane up. It is magical thinking, and also an exact description of how this family works: people stay aloft because someone concentrates on them.\n\nKeep the idea in mind. The chapter that follows is about what happens to a woman when the attention holding her up is withdrawn.' },
    c_shaman: { tier: 'criticism', by: 'VanSpanckeren, 1991', text: 'In the previous chapter, “Shaman,” Brave Orchid is a heroine: a doctor trained in China who sits up all night in a haunted room and talks a ghost away. Kathryn VanSpanckeren reads “At the Western Palace” as a cautionary sequel to that chapter. The same force of will that defeated a ghost in China is about to be turned on her sister in America.' },
    c_ship: { tier: 'context', text: 'Her son is serving in the war in Vietnam. Brave Orchid adds his ship to the plane she is already holding up, and gets a headache. The war is the book’s background in this chapter; it is also another son of the household whom no one can see.' },
    c_niece: { tier: 'context', text: 'Brave Orchid brought her niece to America too, by arranging her marriage to a Chinese American. That marriage is what let Moon Orchid follow. Moon Orchid’s journey was planned in advance by her sister, using her daughter’s marriage as the route.' },
    c_young: { tier: 'annotation', reflect: 'young', text: 'Brave Orchid is looking for the sister she remembers. The woman she claims is young and wears Western clothes, which is to say she fits the picture, not the person. It takes the niece to correct her: her mother will look much older.\n\nThe first thing that happens to Moon Orchid in America is that she is not recognized.' },
    c_old: { tier: 'annotation', text: 'The sisters have not seen each other for decades, and each is shocked by the other’s age. In the car to Stockton they keep returning to it, as if the shock has to be repeated to be believed.\n\nAge matters to the argument of this chapter. A woman in her sixties, arriving to reclaim a marriage, is arriving into a country and a family that have already decided what her future can hold.' },
    c_famulan: { tier: 'annotation', text: 'Fa Mu Lan is the woman warrior of the book’s second chapter, the heroine the narrator imagines becoming: trained in the mountains, avenging her village, the words of her family’s grievances carved into her back.\n\nHere she arrives as a paper cutout, a present from Hong Kong for children who handle it at once. The warrior of the book’s title enters this chapter flat, decorative and given away, and in this chapter no one will fight.' },
    c_chin: { tier: 'criticism', by: 'Chin, 1991', text: 'Frank Chin attacked Kingston’s Fa Mu Lan as a fake: in “Come All Ye Asian American Writers of the Real and the Fake” he objected that she had grafted onto the heroine the tattooed back that belongs to the male general Yue Fei, and had served white readers a feminized, invented China. The quarrel is about who is entitled to retell a story, and how faithfully: the same question this chapter asks about Moon Orchid.' },
    c_gods: { tier: 'annotation', text: 'Brave Orchid judges the gifts by an economy of luck. Too much generosity attracts envy, from gods as well as people. Extravagance is not just wasteful to her; it is dangerous.' },
    c_wong: { tier: 'criticism', by: 'Wong, 1993', text: 'Sau-ling Cynthia Wong reads Asian American writing through a tension she calls Necessity and Extravagance. Necessity is survival, thrift and use; Extravagance is play, pleasure and expression that serve no purpose.\n\nThe two sisters divide almost exactly along this line. Moon Orchid has lived for thirty years on money sent from America and has never had to work. Brave Orchid runs a laundry. Each sister’s idea of what a person is for comes from the life she has had.' },
    c_useful: { tier: 'annotation', text: 'Brave Orchid puts the useful presents away in the back bedroom, which is where Moon Orchid will sleep until a permanent plan has been made for her. The guest’s gifts are sorted by use, and so, in effect, is the guest.' },
    c_bracelets: { tier: 'annotation', text: 'Jade bracelets for the girls, forbidden by their mother: they are too young, and would break them playing baseball. The gift is refused on the grounds of the American life the girls actually lead, which Moon Orchid has not seen.' },
    c_sweet: { tier: 'context', text: 'In the welcoming ritual Brave Orchid insists on, the children are fed candy because a beginning must be sweet. They do not want it. The ceremony that is supposed to bless Moon Orchid’s arrival is performed on children who do not believe in it.' },
    c_letters: { tier: 'annotation', text: 'Moon Orchid knows these young people from her sister’s letters, and checks the people against what she has read. It is what Brave Orchid did at the airport: matching a person to an account. Here, for once, Moon Orchid is the one holding the account.' },
    c_narrate: { tier: 'annotation', reflect: 'narrate', text: 'She says aloud what they are doing, as they do it. They find it unbearable.\n\nIn a book about who gets to tell whose story, this is the one scene where Moon Orchid narrates other people to their faces. The discomfort it causes is the discomfort of being described by someone who has not asked.' },
    c_haunt: { tier: 'criticism', by: 'Szmańko, 2021', text: 'Klara Szmańko points out that this is a narration inside the narration: in a chapter told in the third person, Moon Orchid sets up her own running third-person account of the household. In Szmańko’s reading she haunts the children, with a harmless curiosity that turns into attachment.\n\nThe book’s own word for strangers who drift through a life without belonging to it is *ghosts*. In this house, for now, the newcomer is the one doing the haunting.' },
    c_milk: { tier: 'context', text: 'They look adults in the eye, accept compliments without denying them, eat meat half-cooked and smell of milk. To Moon Orchid these are signs of something animal. In the custom she grew up with, milk was for infants.\n\nIn this family, white Americans are “ghosts.” Moon Orchid, newly arrived, finds something unhuman in her own nieces and nephews. The book keeps turning the question of who counts as fully human around.' },
    c_babies: { tier: 'context', text: 'Brave Orchid’s first two children died in China, before she emigrated; the book tells this in “Shaman.” Moon Orchid measures the living children against those two dead ones, and finds the dead ones sweeter. Her standard is the past.' },
    c_defends: { tier: 'annotation', text: 'When Brave Orchid scolds the children for their manners and their clothes, it is Moon Orchid who takes their side. She is not only a critic of them, and she is not passive: in this scene she argues with her sister on someone else’s behalf.' },
    c_laundry: { tier: 'context', text: 'For Chinese immigrants in the exclusion era, hand laundries were one of the few trades open to them, and laundry work became one of the most common Chinese American livelihoods. Brave Orchid was a doctor in China. In America she irons shirts from six in the morning.' },
    c_americans: { tier: 'annotation', text: 'Moon Orchid calls the Chinese people she sees in Chinatown “Americans.” Brave Orchid finds this silly: they are overseas Chinese.\n\nIt is a disagreement about who belongs to which country, and the one with the authority to settle it is the sister who has lived here for decades.' },
    c_chua: { tier: 'criticism', by: 'Chua, 1991', text: 'Cheng Lok Chua reads *ghost* in *The Woman Warrior* as a word with many referents: the dead, the uncanny, and, in the family’s speech, white Americans. In his reading, being a ghost can also be a chosen and productive estrangement, not only a loss of self.\n\nThe sisters’ quarrel over the word *Americans* is a quarrel over that map: who is solid, who is foreign, and who is the ghost.' },
    c_scorch: { tier: 'annotation', text: 'At the iron she scorches a shirt and is sent to rest. Nothing in the book suggests she cannot learn. It is the heat, the speed and the fact that she has never worked.' },
    c_crate: { tier: 'annotation', reflect: 'crate', text: 'She asks for company back to Chinatown. Her sister keeps working and sets out a crate for her to sit on. Moon Orchid’s request is answered with a seat beside the work.' },
    c_peeren: { tier: 'criticism', by: 'Peeren, 2014', text: 'Esther Peeren’s *The Spectral Metaphor* studies the people a society treats as “living ghosts”: undocumented migrants, servants and domestic workers, the missing. What they share is a lack of social visibility. A servant, in particular, is valued for being unobtrusive, present only through the work.\n\nThe laundry offers Moon Orchid that kind of place and she cannot take it: she cannot do the work, so she cannot disappear into it either. She is set aside instead, on a crate by the door. In Movement III her sister will propose the servant’s role outright: a job as a hotel maid, to prove her worth.' },
    c_mahjong: { tier: 'annotation', text: 'In Chinatown, Brave Orchid’s friends joke about blackmailing the husband, or beating him. Moon Orchid takes it as a joke and plays mahjong. The community has already turned her marriage into a story with a plot. She declines the plot and plays a game.' },
    c_towels: { tier: 'annotation', text: 'Late in the afternoons, when the laundry has cooled, she folds towels. It is the one work she does here, and she can do it only once the room is bearable.' },
    c_ready: { tier: 'annotation', text: 'The same question every day, and the same answer: not yet. Only one of the two is treated as information. The question is repeated until the answer stops mattering.\n\n*Not yet* is also a claim on time, the only one she makes in this part of the book. It defers a future that other people have already scheduled for her. It holds for weeks, and then a niece’s travel plans decide it.' },
    c_twoclocks: { tier: 'annotation', text: 'Two clocks are running. In Moon Orchid’s life the marriage has never ended: she has been his wife, on his money, for thirty years. In her husband’s life it ended long ago, with a new wife, a new language and a medical practice in Los Angeles. She is arriving into a marriage that exists only on her side of the Pacific.\n\nThis is the temporal split the chapter turns on. Everyone else has moved on in time; she is still living in the year he left.' },
    c_bigamy: { tier: 'annotation', text: 'Moon Orchid has read that an American man may not have two wives. She is right, and the husband will make exactly this argument in Los Angeles. Brave Orchid waves the law aside.\n\nThe one piece of knowledge Moon Orchid brings to the plan is accurate, and it is dismissed.' },
    c_fricker: { tier: 'criticism', by: 'Fricker, 2007', text: 'Miranda Fricker writes that testimonial injustice “occurs when prejudice causes a hearer to give a deflated level of credibility to a speaker’s word.”\n\nWhether the word *prejudice* fits a loving sister is a fair question. But the pattern is visible: Moon Orchid says something true about the country she has just arrived in, and it carries no weight with the person making the plan.' },
    c_glenn: { tier: 'context', by: 'Glenn, 1983', text: 'For about thirty years the husband has lived in America and sent money to his wife in Hong Kong, without ever asking her to join him. The sociologist Evelyn Nakano Glenn called this pattern the “split household”: for generations, exclusion laws kept Chinese wives out while their husbands worked in the United States, and families were held together by remittances across the Pacific.\n\nThe book makes this husband’s silence his own choice. But Moon Orchid has lived her whole married life inside the old shape of it.' }
  };

  /* ------------------------------------------------------------------ seen as */
  const seen = {
    young: { cite: 'The airport', as: 'The sister she last saw decades ago: a young woman in Western clothes.', by: 'Brave Orchid', text: 'A small, thin woman with grey hair in a knot, in a grey wool suit and pearls.' },
    narrate: { cite: 'The house', as: 'An aunt who will not stop describing them.', by: 'Brave Orchid’s children', text: 'A newcomer learning a family she knew only from letters, out loud.' },
    crate: { cite: 'The laundry', as: 'Someone to be given a seat while the work goes on.', by: 'Brave Orchid', text: 'A woman asking for company to go back to Chinatown.' }
  };

  /* ------------------------------------------------------------------ scenes */
  const scenes = {};

  scenes.arrivals = {
    mv: 'I', title: 'Arrivals', place: 'San Francisco International Airport', art: 'airport', first: 'a1',
    beats: {

      H('Two kinds of haunting'),
      Pp('Jacques Derrida’s *Specters of Marx* (1993) named the logic of the specter *hauntology*: the ghost is what is neither alive nor dead, “never present as such,” and yet keeps acting on the present because it has not been laid to rest. Avery Gordon’s *Ghostly Matters* (1997) carried the idea into social history. For Gordon, haunting is how a repressed or unresolved social violence makes itself known: “the endings that are not over.”'),
      Pp('Read this way, the book has two hauntings. In one, the past pushes into the present: the No Name aunt returns through every retelling, and her fate is handed to the narrator as a warning. In the other, a person in the present is pushed back into the past. That is Moon Orchid. Esther Peeren’s *The Spectral Metaphor* (2014) calls such people living ghosts: migrants, servants, the missing, made spectral not by death but by their lack of social visibility.'),
      H('Out of time'),
      Pp('Moon Orchid’s marriage is alive in her life and finished in her husband’s. For thirty years she lived inside an arrangement he had already left: a split household, money sent across the Pacific, a wife kept at a distance by an old pattern of exclusion and then by his own choice. When she arrives, everyone places her in the past. Her sister looks for the young woman she remembers. Her husband, when he is finally brought down to the car, does not know her. He calls the two sisters grandmothers and says that his Chinese family has come to seem like people in a book he read long ago. He has kept his youth in America. She arrives already old.'),
      Pp('The future in this chapter belongs to the assimilated: the husband with his practice, his English-speaking wife and his new life. Moon Orchid is told, in effect, that she has arrived too late for her own marriage.'),
      H('Recognition'),
      Pp('Peeren argues that living ghosts are “incapable of engineering their own recognition.” They can be called into being only by others, and only on terms that make sense to the wider society. Moon Orchid fails both conditions. The one person whose recognition would restore her place withholds it. And the terms on which America would accept her (English, paid work, what her husband calls the *hardness* this country requires) are terms she cannot meet. *Hardness* is a gendered test. The deference that made her a proper wife in the life she was given disqualifies her in the life he chose.'),
      Pp('The chapter rehearses this failure long before Los Angeles. Every time she is seen, she is seen as something:'),

      { count: true },
      Pp('Lisa Lowe’s *Immigrant Acts* (1996) describes the Asian immigrant in the American imagination as a “foreigner-within,” folded into the nation’s labor and kept outside its idea of itself. Moon Orchid is a foreigner within her own family’s story.'),
      H('The reversal'),
      Pp('After the car, invisibility turns inside out. She stops writing the letters she sent faithfully for years, whispers into the telephone that people are listening, and becomes certain that she is being watched and plotted against. The woman no one would see becomes convinced that everyone is looking. Surveillance is the other face of invisibility: she is noticed everywhere and understood nowhere. Her sister tries to call her lost spirit home by chanting her name and her new address, as if a self could be re-registered at the right location.'),
      Pp('Brave Orchid then gives her children a theory of madness. Sane people, she says, can vary the stories they tell; the mad have only one, and repeat it. It is a theory of sanity as the freedom to revise, which is to say the freedom to move on in time. By that measure, Moon Orchid’s madness is the condition the chapter has imposed on her all along. She is held to one story, the wife from long ago, while everyone around her revises theirs. In the state asylum where she dies she is, by her sister’s report, content: among women who all speak the same language, and who never leave. It is the one place in America where she is understood, and it is outside time.'),
      H('The thesis'),
      Pp('Behind Moon Orchid’s “maddening” stands a structure, not a diagnosis: the systemic erasure and invisibility of an immigrant woman. Immigration history split her marriage across an ocean. Assimilation gave the future to her husband and left her the past. Language took the force out of everything she knew. A household measured her by her use. And the story itself reached the page third-hand, through a brother, a sister and a narrator who admits she was not there. Her madness is what that structure looks like from inside it. She is a living ghost: present, and refused a present.'),
      Pp('Bertha Mason’s madness was made to stand beside other people’s sanity. Moon Orchid’s is different. It is the name her family gives to a woman whose time has been taken away.'),
      H('Where the thesis strains'),
      Pp('The book will not let this argument become simple. The husband is no stage villain: he supported her for thirty years, and he did not ask for the confrontation Brave Orchid staged in a parked car. Cheng Lok Chua holds both the husband and Brave Orchid responsible for Moon Orchid’s collapse, and the erasure this chapter traces comes from love as well as rejection. Invisibility should not be romanticized either. To read her madness as resistance or hidden wisdom would make her suffering serve an argument, which is what the household did to her. Disability scholars such as Lzz Johnk (2023) ask instead for readings that keep a mad woman’s suffering and her personhood in view at once. And every word of her story is a retelling. In the next chapter the narrator suspects that her brother’s bare version of Los Angeles may be truer than the shaped story that reached her. Any thesis about Moon Orchid stands on an account she never gave.'),

    <pattern id="mo-floortile" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="#efe3c9"/><rect width="30" height="30" fill="#e2cfaa"/><rect x="30" y="30" width="30" height="30" fill="#e2cfaa"/></pattern>
    <pattern id="mo-check" width="36" height="36" patternUnits="userSpaceOnUse"><rect width="36" height="36" fill="#f2ead8"/><rect width="18" height="18" fill="#b9d2c3"/><rect x="18" y="18" width="18" height="18" fill="#b9d2c3"/></pattern>
    <pattern id="mo-lino" width="80" height="80" patternUnits="userSpaceOnUse"><rect width="80" height="80" fill="#e6dac0"/><rect width="40" height="40" fill="#ddd0b2"/><rect x="40" y="40" width="40" height="40" fill="#ddd0b2"/></pattern>
    <pattern id="mo-carpet" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#b8a383"/><path d="M0,10 L10,0" stroke="#ad9877" stroke-width="2"/></pattern>
    <pattern id="mo-siding" width="34" height="200" patternUnits="userSpaceOnUse"><rect width="34" height="200" fill="#e8cf8c"/><rect x="0" width="4" height="200" fill="#d9bd73"/></pattern>
  </defs>`;
  const wrap = (inner, label) => `<svg class="mo-svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${label}">${DEFS}${inner}<rect width="1600" height="1000" filter="url(#mo-grain)" pointer-events="none"/></svg>`;
  const R = (x, y, w, h, f, extra = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${extra}/>`;
  const shadowE = (x, y, rx, ry = 10) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${P.shadow}"/>`;

  /* ------------------------------------------------------------ people
     Feet at (0,0), about 330 units tall at scale 1, facing right unless flip. */
  const LOOK = {
    mo: { coat: P.gray, coat2: P.gray2, skirt: '#7b7872', hair: P.hairG, legs: '#c8b8a2', bun: true, pearls: true, bag: P.tob, slim: 0.86, h: 0.92 },
    bo: { coat: P.navy, coat2: '#243040', skirt: '#2a3442', hair: P.hair, legs: '#8e7a66', curls: true, slim: 1.12, h: 0.98, paper: true },
    niece: { coat: P.jade2, coat2: '#4c7563', skirt: P.jade2, hair: P.hair, legs: '#c8b8a2', bob: true, slim: 0.92, h: 1, dress: true },
    daughter: { coat: '#c9b48a', coat2: '#a8925f', skirt: '#4a4a55', hair: P.hair, legs: '#c8b8a2', long: true, slim: 0.9, h: 1 },
    son: { coat: '#e9e4d8', coat2: '#cfc8b8', skirt: '#4a5260', hair: P.hair, legs: '#4a5260', man: true, slim: 1, h: 1.08 },
    father: { coat: '#f1eee6', coat2: '#d6d1c4', skirt: '#5a5650', hair: '#4a4540', legs: '#5a5650', man: true, slim: 1, h: 1.02, apron: true },
    coat: { coat: '#d9c6a0', coat2: '#bfa97e', skirt: '#d9c6a0', hair: '#7a5232', legs: '#c8b8a2', bob: true, slim: 0.92, h: 1.06, dress: true },
    trav: { coat: '#cbbf9f', coat2: '#b3a684', skirt: '#9a8f78', hair: '#5a4a3a', legs: '#9a8f78', man: true, slim: 1, h: 1.02 }
  };
  function head(L, x = 0) {
    let h = `<rect x="${x - 6}" y="-292" width="12" height="18" fill="${P.skin2}"/><ellipse cx="${x + 2}" cy="-310" rx="17" ry="21" fill="${P.skin}"/>`;
    if (L.bun) h += `<path d="M${x - 16},-312 C${x - 18},-336 ${x + 16},-338 ${x + 19},-316 C${x + 10},-326 ${x - 4},-326 ${x - 16},-312Z" fill="${L.hair}"/><circle cx="${x - 17}" cy="-318" r="10" fill="${L.hair}"/><path d="M${x - 15},-312 C${x - 16},-300 ${x - 13},-294 ${x - 9},-290" stroke="${L.hair}" stroke-width="6" fill="none"/>`;
    if (L.curls) h += `<path d="M${x - 19},-304 C${x - 26},-340 ${x + 20},-346 ${x + 21},-314 C${x + 16},-322 ${x + 8},-324 ${x + 2},-322 C${x - 4},-316 ${x - 12},-312 ${x - 19},-304Z" fill="${L.hair}"/><circle cx="${x - 16}" cy="-326" r="9" fill="${L.hair}"/><circle cx="${x + 2}" cy="-334" r="10" fill="${L.hair}"/><circle cx="${x - 19}" cy="-308" r="7" fill="${L.hair}"/>`;
    if (L.bob) h += `<path d="M${x - 20},-292 C${x - 26},-338 ${x + 22},-344 ${x + 21},-308 C${x + 12},-322 ${x},-324 ${x - 8},-318 C${x - 12},-306 ${x - 12},-296 ${x - 20},-292Z" fill="${L.hair}"/>`;

    return h;
  }
  function person(who, x, y, o = {}) {
    const L = Object.assign({}, LOOK[o.look || who]);
    const s = (o.s || 1) * L.h, w = L.slim;
    const flip = o.flip ? -1 : 1;
    const pose = o.pose || 'stand';
    let b = '';

      b += shadowE(0, 0, 54 * w, 9);
      b += `<path d="M${-14 * w},-118 L${-12 * w},-6 L${-3 * w},-6 L${-2 * w},-118Z" fill="${L.legs}"/><path d="M${3 * w},-118 L${4 * w},-6 L${13 * w},-6 L${15 * w},-118Z" fill="${L.legs}"/>`;

      const top = L.dress ? -112 : (L.man ? -168 : -190);
      b += `<path d="M${-30 * w},${top} C${-36 * w},-232 ${-34 * w},-262 ${-24 * w},-274 L${24 * w},-274 C${34 * w},-262 ${36 * w},-232 ${30 * w},${top}Z" fill="${L.coat}"/>`;
      b += `<path d="M${8 * w},${top} C${20 * w},-232 ${22 * w},-260 ${18 * w},-272 L${24 * w},-274 C${34 * w},-262 ${36 * w},-232 ${30 * w},${top}Z" fill="#fff" opacity=".14"/>`;

      if (L.apron) b += `<path d="M${-20 * w},-240 L${20 * w},-240 L${26 * w},-120 L${-26 * w},-120Z" fill="#f7f4ec" opacity=".9"/>`;
      // arms

        b += `<path d="M${-24 * w},-266 C${-32 * w},-232 ${-26 * w},-200 ${-6},-186 M${24 * w},-266 C${32 * w},-232 ${26 * w},-200 ${6},-186" stroke="${L.coat2}" stroke-width="${13 * w}" stroke-linecap="round" fill="none"/>`;

      } else if (arm === 'point') {
        b += `<path d="M${-24 * w},-266 C${-32 * w},-226 ${-30 * w},-196 ${-28 * w},-170" stroke="${L.coat2}" stroke-width="${14 * w}" stroke-linecap="round" fill="none"/><path d="M${24 * w},-266 C${44 * w},-252 ${62 * w},-244 ${82 * w},-246" stroke="${L.coat2}" stroke-width="${14 * w}" stroke-linecap="round" fill="none"/><circle cx="${86 * w}" cy="-246" r="6.5" fill="${P.skin}"/>`;
        if (L.paper) b += `<path d="M${-44 * w},-176 L${-12 * w},-176 L${-15 * w},-120 L${-41 * w},-120Z" fill="#d8bf8f"/><path d="M${-44 * w},-176 L${-12 * w},-176 L${-14 * w},-168 L${-42 * w},-168Z" fill="#c7aa76"/>`;
        b += `<circle cx="${-28 * w}" cy="-168" r="6.5" fill="${P.skin}"/>`;
      } else if (arm === 'hold') {
        b += `<path d="M${-24 * w},-266 C${-28 * w},-230 ${-12 * w},-214 ${10 * w},-212 M${24 * w},-266 C${30 * w},-236 ${26 * w},-218 ${14 * w},-212" stroke="${L.coat2}" stroke-width="${13 * w}" stroke-linecap="round" fill="none"/><circle cx="${14 * w}" cy="-212" r="6" fill="${P.skin}"/>`;
        if (o.cup) b += `<path d="M${8 * w},-232 L${24 * w},-232 L${22 * w},-212 L${10 * w},-212Z" fill="${o.cup === 'sun' ? '#f2e3b3' : '#fbfaf6'}" stroke="${o.cup === 'sun' ? P.mustard : P.glass}" stroke-width="2"/>`;
        if (o.book) b += `<rect x="${2 * w}" y="-234" width="${30 * w}" height="22" fill="${o.book}"/>`;
      } else {
        b += `<path d="M${-24 * w},-266 C${-32 * w},-226 ${-30 * w},-196 ${-28 * w},-168 M${24 * w},-266 C${32 * w},-226 ${30 * w},-196 ${28 * w},-168" stroke="${L.coat2}" stroke-width="${13 * w}" stroke-linecap="round" fill="none"/><circle cx="${-28 * w}" cy="-166" r="6" fill="${P.skin}"/><circle cx="${28 * w}" cy="-166" r="6" fill="${P.skin}"/>`;
        if (L.paper && o.bagged) b += `<path d="M${16 * w},-172 L${46 * w},-172 L${43 * w},-116 L${19 * w},-116Z" fill="#d8bf8f"/>`;

      b += head(L);
    } else if (pose === 'sit') {
      // seated, facing right, on whatever is at y; the seat is at 0, feet at +110
      b += `<path d="M${-6 * w},10 L${60 * w},10 L${62 * w},104 L${50 * w},104 L${48 * w},26 L${-6 * w},26Z" fill="${L.man ? L.skirt : L.legs}"/>`;
      if (!L.man) b += `<path d="M${-34 * w},-6 L${56 * w},-6 L${60 * w},30 L${-30 * w},30Z" fill="${L.skirt}"/>`;

      if (L.curls) b += `<circle cx="-16" cy="-140" r="13" fill="${L.hair}"/><circle cx="14" cy="-146" r="14" fill="${L.hair}"/><circle cx="-22" cy="-118" r="11" fill="${L.hair}"/><circle cx="22" cy="-120" r="11" fill="${L.hair}"/>`;

<script>
/* ---- chapters/moon-orchid/chapter.js ---- */
/* Before She Answers: the chapter's own engine.
   It shares the site's shelf, router and wordmark. Retold passages, notes, readings and the account are its own.
   State is namespaced and versioned in localStorage; a corrupt or missing save simply starts fresh.
   Every rendered beat is stored with its evaluated text, so resuming shows exactly what was shown. */
(function () {
  'use strict';
  const UH = window.UH;
  const KEY = 'unwriting-her:moon-orchid:v2', V = 2;
  const reduce = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const fresh = () => ({ v: V, scene: 'entry', trail: [], account: {}, said: [], wishes: {}, readings: {}, seenIds: [], opened: [], done: [], tags: {}, focus: null, order: [] });
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return fresh();
      const s = JSON.parse(raw);
      const C = UH.MO;
      if (!s || s.v !== V || (s.scene !== 'entry' && !C.scenes[s.scene])) return fresh();
      const out = Object.assign(fresh(), s);
      if (out.scene !== 'entry' && out.trail.some(t => !C.scenes[out.scene].beats[t.b])) return fresh();
      return out;
    } catch (e) { return fresh(); }
  }
  let s = null;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { /* storage blocked: the run still works */ } };

  const chapter = {
    id: 'moon-orchid', start: 'arrivals', endings: {}, scenes: {},
    mount,
    started: () => load().scene !== 'entry',
    reset: () => { s = fresh(); save(); },
    endingsReached: () => []
  };
  UH.registerStory(chapter);
  UH._mo = { get state() { return s; }, reset: () => chapter.reset() };

  /* ------------------------------------------------------------ dom helpers */
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'text') n.textContent = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    kids.flat().forEach(c => { if (c == null || c === false) return; n.append(c.nodeType ? c : document.createTextNode(c)); });
    return n;
  }
  const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const ital = t => esc(t).replace(/\*([^*]+)\*/g, '<em>$1</em>');
  const CLUE = /\[\[([^|\]]+)\|([^\]]+)\]\]/g;
  const plain = t => String(t).replace(CLUE, '$1');
  function rich(t) {
    return String(t).split(/\n\n/).map(par => {
      let out = '', last = 0, m; CLUE.lastIndex = 0;
      while ((m = CLUE.exec(par))) {
        out += ital(par.slice(last, m.index));
        out += `<button type="button" class="mo-clue${s.opened.includes(m[2]) ? ' seen' : ''}" data-clue="${esc(m[2])}" aria-expanded="false">${ital(m[1])}</button>`;
        last = CLUE.lastIndex;
      }
      return '<p>' + out + ital(par.slice(last)) + '</p>';
    }).join('');
  }

  let C, A, host, root, artBox, attnEl, accountEl, flowEl, ctlEl, drawer, drawerBtn, menu, menuBtn, sceneHead;
  const who = id => (C.who[id] && C.who[id].name) || id;
  const scene = () => C.scenes[s.scene];
  const beatOf = id => scene().beats[id];
  const TIER = { annotation: 'Annotation', context: 'Context', criticism: 'Criticism', conjecture: 'Conjecture', retold: 'Retold' };

  /* ============================================================ MOUNT */
  function mount(app, h) {
    C = UH.MO; A = UH.MOart; host = h;
    s = load();
    app.className = 'view-mo';
    app.innerHTML = '';
    root = el('div', { class: 'mo' });
    app.append(root);
    root.addEventListener('click', onClue);
    if (s.scene === 'entry') renderEntry(); else renderStage(true);
  }

  /* ============================================================ ENTRY */
  function renderEntry() {
    root.innerHTML = '';
    root.className = 'mo mo-at-entry';
    const started = s.scene !== 'entry' || s.trail.length > 0;
    const flap = el('div', { class: 'mo-flaps', 'aria-hidden': 'true' });
    [...'BEFORE SHE ANSWERS'].forEach((ch, i) => flap.append(el('span', { class: 'mo-flap' + (ch === ' ' ? ' sp' : ''), style: `--i:${i}` }, el('b', { text: ch === ' ' ? '' : ch }))));
    const note = el('details', { class: 'mo-note' }, el('summary', {}, 'Content note'), el('p', { text: C.contentNote }));
    const how = el('details', { class: 'mo-note', open: true }, el('summary', {}, 'How to read this chapter'), ...C.howTo.map(t => el('p', { text: t })), keyRow());
    const confirm = el('div', { class: 'mo-confirm', hidden: true },
      el('p', { text: 'Start this chapter again from the airport? Your other chapters are not affected.' }),
      el('div', { class: 'mo-row' },
        el('button', { type: 'button', class: 'mo-btn', onclick: () => { chapter.reset(); begin(); } }, 'Start again'),
        el('button', { type: 'button', class: 'mo-btn quiet', onclick: () => { confirm.hidden = true; } }, 'Keep my place')));
    const actions = el('div', { class: 'mo-row' },
      started ? el('button', { type: 'button', class: 'mo-btn', onclick: () => renderStage(true) }, 'Continue') : el('button', { type: 'button', class: 'mo-btn', onclick: begin }, 'Begin'),
      started ? el('button', { type: 'button', class: 'mo-btn quiet', onclick: () => { confirm.hidden = false; } }, 'Start again') : null,
      el('button', { type: 'button', class: 'mo-btn quiet', onclick: () => host.navigate('reading-room') }, 'Back to the Reading Room'));
    root.append(bar(false),
      el('main', { class: 'mo-entry', id: 'mo-main' },
        el('div', { class: 'mo-entry-art', html: luggage() }), flap,
        el('h1', { class: 'mo-title', text: C.title }),
        el('p', { class: 'mo-sub', text: C.sub }),
        el('p', { class: 'mo-notice', text: C.notice }),
        how, note, actions, confirm));
    if (!reduce()) requestAnimationFrame(() => flap.classList.add('go')); else flap.classList.add('go', 'still');
  }
  function keyRow() {
    return el('div', { class: 'mo-key' }, ['retold', 'annotation', 'context', 'criticism'].map(t => el('span', { class: 'mo-tier', 'data-tier': t, text: TIER[t] })));
  }
  function luggage() {
    return `<svg viewBox="0 0 520 170" aria-hidden="true"><ellipse cx="260" cy="160" rx="250" ry="10" fill="rgba(70,48,28,.14)"/>
      <rect x="40" y="40" width="160" height="116" rx="10" fill="#8e6f4c"/><path d="M95,40 C95,14 145,14 145,40" stroke="#5c3d25" stroke-width="8" fill="none"/><rect x="74" y="40" width="9" height="116" fill="#000" opacity=".13"/><rect x="158" y="40" width="9" height="116" fill="#000" opacity=".13"/>
      <rect x="214" y="70" width="130" height="86" rx="8" fill="#6b8a7b"/><path d="M256,70 C256,52 302,52 302,70" stroke="#4c7563" stroke-width="7" fill="none"/>
      <rect x="360" y="88" width="120" height="68" fill="#c9a874"/><path d="M360,88 L480,88 L470,76 L370,76Z" fill="#d9bb88"/><path d="M420,76 L420,156 M360,122 L480,122" stroke="#6e5536" stroke-width="3"/><path d="M410,66 C416,76 424,76 430,66" stroke="#6e5536" stroke-width="3" fill="none"/></svg>`;
  }
  function begin() { s = fresh(); save(); goScene(C.start, true); }

  /* ============================================================ CHROME */
  function bar(inStory) {
    const b = el('header', { class: 'mo-bar' },
      el('button', { type: 'button', class: 'mo-word', onclick: () => host.navigate('reading-room'), title: 'Back to the Reading Room' }, 'Unwriting Her'),
      el('span', { class: 'mo-bar-place' }, inStory ? sceneLabel() : 'Moon Orchid'));
    if (!inStory) return b;
    drawerBtn = el('button', { type: 'button', class: 'mo-bar-btn', 'aria-expanded': 'false', 'aria-controls': 'mo-said', onclick: () => openDrawer() }, 'The record');
    menuBtn = el('button', { type: 'button', class: 'mo-bar-btn', 'aria-expanded': 'false', 'aria-controls': 'mo-menu' }, 'Menu');
    const confirm = el('div', { class: 'mo-confirm', hidden: true },
      el('p', { text: 'Start this chapter again? Your readings in it will be cleared. Other chapters are not affected.' }),
      el('div', { class: 'mo-row' },
        el('button', { type: 'button', class: 'mo-btn small', onclick: () => { closeMenu(); chapter.reset(); renderEntry(); } }, 'Start again'),
        el('button', { type: 'button', class: 'mo-btn small quiet', onclick: () => { confirm.hidden = true; } }, 'Keep my place')));
    menu = el('div', { class: 'mo-menu', id: 'mo-menu', hidden: true },
      el('button', { type: 'button', class: 'mo-menu-item', onclick: () => { closeMenu(); renderEntry(); } }, 'Title page and how to read'),
      el('button', { type: 'button', class: 'mo-menu-item', onclick: () => { closeMenu(); host.navigate('reading-room'); } }, 'Back to the Reading Room'),
      el('button', { type: 'button', class: 'mo-menu-item', onclick: () => { confirm.hidden = false; } }, 'Start this chapter again'),
      confirm);
    function closeMenu() { menu.hidden = true; menuBtn.setAttribute('aria-expanded', 'false'); confirm.hidden = true; }
    menuBtn.addEventListener('click', e => { e.stopPropagation(); const open = menu.hidden; menu.hidden = !open; menuBtn.setAttribute('aria-expanded', String(open)); if (open) menu.querySelector('button').focus(); });
    document.addEventListener('click', e => { if (menu && !menu.hidden && !menu.contains(e.target) && e.target !== menuBtn) closeMenu(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && menu && !menu.hidden) { closeMenu(); menuBtn.focus(); } });
    b.append(el('div', { class: 'mo-bar-r' }, drawerBtn, el('div', { class: 'mo-menu-wrap' }, menuBtn, menu)));
    return b;
  }
  function sceneLabel() { const sc = scene(); return !sc ? '' : sc.essay ? 'The closing thesis' : `${C.movements[sc.mv].n} · ${C.movements[sc.mv].title}`; }

  /* ============================================================ STAGE */
  function renderStage(resuming) {
    if (scene().essay) return renderEssay();
    root.innerHTML = '';
    root.className = 'mo mo-in';
    const sc = scene();
    artBox = el('div', { class: 'mo-art-in' });
    attnEl = el('figcaption', { class: 'mo-attn', 'aria-live': 'polite' });

      el('h2', { class: 'mo-scene-title', text: sc.title, tabindex: '-1' }),
      el('p', { class: 'mo-place', text: sc.place }));
    flowEl = el('div', { class: 'mo-flow' });
    ctlEl = el('div', { class: 'mo-ctl' });
    drawer = el('aside', { class: 'mo-drawer', id: 'mo-said', 'aria-label': 'The record', hidden: true, tabindex: '-1' });
    const left = el('div', { class: 'mo-left' }, el('figure', { class: 'mo-art' }, artBox, attnEl));
    const col = el('section', { class: 'mo-col', 'aria-label': 'The chapter' }, sceneHead, flowEl, ctlEl);
    root.append(bar(true), el('main', { class: 'mo-stage', id: 'mo-main', 'data-mv': sc.mv }, left, col), drawer);
    const narrow = window.matchMedia('(max-width: 900px)');
    const place = () => { if (narrow.matches) col.prepend(accountEl); else left.append(accountEl); };
    place();

    artBox.innerHTML = A[sc.art]();
    s.trail.forEach(item => flowEl.append(renderItem(item, false)));
    applyArt(); drawAccount(false); drawControls();

  }

  /* ---------- the closing thesis */
  function renderEssay() {

  /* ---------- art */
  function applyArt() {

          el('div', { class: 'mo-pane as' }, el('span', { class: 'mo-pane-k', text: 'By ' + p.by }), el('span', { class: 'mo-pane-t', text: p.as })),
