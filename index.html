<script>
/* ---- stories/bertha.js ---- */
/* Unwriting Her: the Bertha Mason storyline.
   Narrative content only. The engine (engine.js) reads this object; nothing here touches the DOM.

   Markup inside text:
     [[visible words|clueId]]   a clickable phrase that opens the note clues[clueId]
     *words*                    italics
     {name} {Name}              the name the player chooses for her (lower / sentence case)
   Tiers: text (the novel, verbatim) · context (history outside the novel) · criticism (a named
   critic, paraphrased) · annotation (this game's reading of the text) · conjecture (invented here)
   · margin (the player's own words).
   Quotations from Jane Eyre and from Brontë's 1848 letter are verbatim; ellipses mark omissions. */
(function () {
  const Q = (who, cite, text, o) => Object.assign({ t: 'q', who, cite, text }, o || {});
  const P = (text, o) => Object.assign({ t: 'p', text }, o || {});
  const N = (tier, text, by) => ({ t: 'note', tier, text, by });
  const R = id => ({ t: 'reflect', id });
  const H = text => ({ t: 'h', text });

  const JANE = 'Jane Eyre, narrating';
  const ROCH = 'Edward Rochester';

  /* ---------------------------------------------------------------- notes */
  const clues = {
    c_bluebeard: { tier: 'context', by: 'Perrault, 1697', text: `In Charles Perrault’s tale, a rich husband gives his new wife the keys to every room in the house and forbids her one. Inside it she finds the bodies of the wives who came before her.\n\nJane names the genre of the house in her first hour on the third storey, long before she knows its secret. The comparison fits more closely than she can know. Behind one of these doors is a wife who came before her, and this one is alive.` },
    c_formal: { tier: 'annotation', text: `Jane chooses her adjectives carefully. *Distinct* and *formal* describe something shaped and deliberate; *mirthless* says it is not amusement. Before anyone has explained the sound to her, her own description resists the explanation she is about to be given.` },
    c_door: { tier: 'annotation', text: `Jane knows which door. So, presumably, does Mrs. Fairfax. The question the household answers is never *where* the sound came from. It is *whose* it will be said to be.` },
    c_perhaps: { tier: 'annotation', text: `The first account of the woman upstairs is a misattribution, offered casually and hedged (*very likely*, *perhaps*). Rochester later says Mrs. Fairfax “may indeed have suspected something, but she could have gained no precise knowledge as to facts” (Ch. XXVII).\n\nThe philosopher Miranda Fricker calls it testimonial injustice when prejudice leads a hearer to give a speaker less credibility than she deserves. This is a step earlier than disbelief. A laugh is a kind of utterance, and here it is entered in the household’s record under another woman’s name.` },
    c_directions: { tier: 'annotation', text: `Directions from whom, about what? The instruction goes to the keeper and concerns noise. The household’s first visible rule about the woman upstairs is a rule about sound.` },
    c_leads: { tier: 'annotation', text: `*The leads* are the flat lead roof of the hall. Keep this roof in mind. Jane comes here to look at the horizon and want more of the world. In Chapter XXXVI the woman from the third storey stands on it, above the battlements, on the last night of her life.` },
    c_silent: { tier: 'annotation', text: `Millions in silent revolt, Jane says, and there is one overhead who is not silent. The novel’s most quoted argument for women’s inner lives is made one floor below a woman whose inner life it never records.` },
    c_laughat: { tier: 'annotation', text: `Jane objects that women who want more are laughed at. Read the next sentence.` },
    c_murmurs: { tier: 'annotation', text: `Murmurs are speech too low to make out. Jane hears them often enough to call them characteristic and records not one word. She still credits them to Grace Poole. The woman upstairs talks, and the narrator files the talk under eccentricity.` },
    c_judgeme: { tier: 'annotation', text: `On the morning of the interrupted wedding, Rochester takes the clergyman, the solicitor, Mason and Jane up to the third storey and shows them his wife. Then he sets Jane beside her and asks to be judged by the comparison.\n\nShe is in the room for this hearing. Nobody asks her anything.` },
    c_beast: { tier: 'annotation', text: `Jane, narrating, cannot settle on a pronoun. The figure is *it* while it grovels and growls. It becomes *she* at the moment she parts her hair and looks back at the people looking at her. A sentence later it is *the clothed hyena* again, on *its* hind-feet.` },
    c_gazed: { tier: 'annotation', text: `This is the one moment in the scene when the narration grants her a point of view. She has *visitors*, and she looks at them. Grace Poole’s warning follows at once: “Ah! sir, she sees you!”` },
    c_mywife: { tier: 'annotation', text: `An hour earlier he was ready to marry another woman as if this one did not exist. He claims her as *my wife* when the claim explains him. In Chapter XXVII he will report a voice telling him the opposite, that she “is not your wife.”` },
    c_madfamily: { tier: 'annotation', text: `Madness here is inherited, and it runs down the female line: a Creole mother, a dutiful daughter. Nineteenth-century ideas about inherited taint often ran together with anxieties about colonial birth. The novel never says what “Creole” means for this family (the word could describe white people born in the West Indies as well as people of African or mixed descent), and that uncertainty does work in the text.` },
    c_human: { tier: 'annotation', reflect: 'human', text: `He brings the witnesses upstairs so they can measure the two women against each other. One is *a being*. The other is *something at least human*. The first description exists to produce the second.` },
    c_money: { tier: 'context', by: 'Coverture', text: `Under English common law a wife’s money and movable property passed to her husband on marriage unless a settlement protected it. William Blackstone’s *Commentaries* (1765) put the doctrine plainly: “By marriage, the husband and wife are one person in law: that is, the very being or legal existence of the woman is suspended during the marriage.” The Married Women’s Property Acts of 1870 and 1882 began to undo it.` },
    c_dark: { tier: 'annotation', text: `The same three words describe Blanche Ingram, the English heiress Rochester courts at Thornfield. In this sentence *dark* is a compliment about a society beauty’s colouring. It gathers other meanings later, when Jane describes a *discoloured* face and Rochester a *swelled black* one. Whether those later words should be read racially is one of the most contested questions about her.` },
    c_race: { tier: 'annotation', reflect: 'race', text: `*Race* here means lineage: an old English family. Set beside her “Creole” mother and the Masons’ colonial fortune, the word shows what the marriage was. A planter family bought English ancestry, and an English family bought a Jamaican fortune.` },
    c_30k: { tier: 'context', text: `Thirty thousand pounds was a very large fortune; Jane’s own windfall at the end of the novel is twenty thousand. Rochester was a younger son with no inheritance coming, and by his account his father arranged the match for the money. Under coverture the fortune became her husband’s. The novel never mentions it again, and never says how much of the household that confines her runs on what she brought.` },
    c_infamous: { tier: 'annotation', text: `Her mother is named in one place in the novel, the document read aloud in the church: Antoinetta. Here she is *infamous*, and the daughter is defined by descent from her.` },
    c_unchaste: { tier: 'annotation', reflect: 'unchaste', text: `Both charges concern a woman’s appetites, for drink and for sex. Neither is a symptom of anything. In the next sentence both become the *cause* of madness.\n\nThey also prepare a contrast. Within the chapter, the governess listening to this story will refuse to stay as his mistress and leave Thornfield with nothing.` },
    c_partofme: { tier: 'context', by: 'Coverture', text: `Rochester complains that the law calls her a part of him. Under coverture the fiction ran the other way. It was the wife whose legal existence was absorbed into the husband’s, along with her fortune.` },
    c_doctors: { tier: 'context', text: `No doctor is named. No examination is described, no certificate shown. The diagnosis arrives in a subordinate clause, as the reason he could not divorce her.\n\nBefore the Matrimonial Causes Act of 1857, an English divorce that allowed remarriage took a private Act of Parliament: rare, costly, and in practice granted almost only for a wife’s adultery. Rochester has just called her *unchaste*. In his own account, the finding of madness is what closes the legal way out and makes the marriage permanent.` },
    c_excesses: { tier: 'context', by: 'Prichard, 1835', text: `Moral judgment, turned into diagnosis. James Cowles Prichard’s *Treatise on Insanity* (1835) gave English medicine a category, *moral insanity*, in which disordered feeling and conduct could amount to madness while the intellect stayed intact. Brontë used nearly that phrase about Bertha in a letter of January 1848. Hear the author’s testimony.` },
    c_europe: { tier: 'criticism', by: 'Spivak, 1985', reflect: 'europe', text: `The geography of the passage is moral. The colony is sulphur, a red moon like a cannon-ball, a pit; Europe arrives as fresh wind. Gayatri Chakravorty Spivak reads *Jane Eyre* as a novel in which empire supplies the terms of English selfhood. Here the West Indies are the place of madness and degradation, and England is the cure. The cure is for him.` },
    c_confine: { tier: 'annotation', text: `The plan for her confinement is spoken by a voice Rochester calls Hope. In his story the attic is no accident of circumstance. It was decided in Jamaica, as the way for him to begin again.` },
    c_notwife: { tier: 'annotation', reflect: 'notwife', text: `The man who said “That is my wife” at the attic door reports this voice telling him she is not. Each claim serves him at the moment he makes it. The second clears the ground for *what new tie you like*.` },
    c_oblivion: { tier: 'annotation', text: `The plan is erasure: her identity and her connection to him, buried. The novel half carries it out. You will not hear her full name, or her mother’s, until a solicitor reads them aloud in a church.` },
    c_ravings: { tier: 'annotation', text: `Read the clause slowly. Her *ravings* would *betray* his secret. For speech to betray a secret it has to contain the secret, and someone has to believe it. Rochester has just told you that what he calls raving is informative and would be credited.\n\nThe attendant is chosen for *fidelity*: for reliability in keeping what she says from reaching anyone, not for skill in treating her. Fricker’s testimonial injustice is a hearer discounting a speaker. This is its completed form. The speech is kept from ever reaching a hearer.` },
    c_lucid: { tier: 'annotation', text: `In her clear weeks, by his own account, she accused him. The novel records none of the accusations. It records that she made them, and calls them abuse.` },
    c_cannothelp: { tier: 'annotation', text: `Jane is the only person in the novel who rebukes Rochester for how he speaks of her. Her defence accepts the diagnosis: pity her because she is mad. The madness itself goes unexamined, and sympathy and verdict arrive together.` },
    c_ifyou: { tier: 'annotation', reflect: 'ifmad', text: `He imagines Jane mad and promises he would love her anyway. The question works only because Jane is the narrator. A mad Jane would still be the one telling the story.` },
    c_tigress: { tier: 'annotation', text: `Her brother reaches for an animal too. Every account of her, sympathetic or not, does.` },
    c_interview: { tier: 'annotation', text: `Rochester’s word for a brother visiting his sister. An interview has two speakers.` },
    c_good: { tier: 'annotation', text: `Mason went up alone, at night, without her husband. Whatever he wanted to say to her, he wanted to say it with Rochester out of the room. The novel never tells us what it was, or what she said before she attacked him. It tells us only that “she looked so quiet at first.”` },
    c_drain: { tier: 'annotation', text: `These are the only words in the novel attributed to her. They reach you as reported speech, from her brother, through Jane, who is under orders not to talk. They make a complete, grammatical sentence with a subject, a verb, and a target.` },
    c_gibberish: { tier: 'annotation', reflect: 'fool', text: `A threat is not gibberish. Rochester applies the word to the one sentence of hers that survives.\n\nCompare the compliment he paid Jane in Chapter XV, after the fire in his bed: “You are no talking fool.” The valued woman is the one who keeps quiet. The other one’s speech is noise.` },
    c_dontrepeat: { tier: 'annotation', text: `He forbids it to be passed on, in the same breath in which he calls it meaningless. Nobody needs to suppress gibberish.\n\nHere the novel’s silence about her is manufactured in front of you. Her sentence is spoken, reported once, and stopped.` },
    c_dead: { tier: 'annotation', text: `Hope’s instruction from Chapter XXVII (“buried in oblivion”), offered here to her brother. Spanish Town is where she was married, and where he still lives.` },
    c_grains: { tier: 'annotation', text: `Mason is the reason the bigamous wedding stops, and he weeps for his sister. Rochester’s portrait of him is contemptuous and predicts that he too will go mad: “will probably be in the same state one day.” Ask whose account of the Mason family you have been relying on.` },
    c_charge: { tier: 'annotation', text: `*Charge*: a responsibility, a ward, a cost. He asks after her the way one asks after an expense.` },
    c_were: { tier: 'annotation', text: `Grace answers in the first person plural. Of everyone in the novel, the woman paid to keep her is the only one who speaks as if they share a condition.` },
    c_guessed: { tier: 'annotation', text: `Jane offers the name and Rochester accepts it. He does not have to lie outright. He lets her mistake stand and congratulates her for it.` },
    c_saynothing: { tier: 'annotation', reflect: 'fool', text: `The order to keep quiet goes to Jane, and it works: she tells no one. Her discretion is praised as intelligence. Five chapters later, the only sentence the other woman is recorded saying will be called gibberish.` },
    c_mirror: { tier: 'annotation', text: `Before she tears the veil she tries it on and looks at herself in it. Rochester himself later reads this as memory: the veil “perhaps brought back vague reminiscences of her own bridal days” (Ch. XXVII).\n\nThe novel never mentions a mirror in her room, which has no window. Whether this was the first time in years she had seen her own face, the text cannot tell you. It is a fair question to ask.` },
    c_discoloured: { tier: 'criticism', by: 'Meyer, 1990', text: `Contested. Some critics read Jane’s *discoloured* and *blackened*, and Rochester’s later *swelled black face*, as racial coding that marks Bertha as not white. Susan Meyer argues that the novel darkens her as part of a wider figurative use of race and slavery. Others read the words as the flushed, swollen face of illness or drink. The novel never states her race. It leaves the question to adjectives, and the adjectives belong to frightened or hostile witnesses.` },
    c_vampyre: { tier: 'annotation', text: `Jane reaches for a German folk monster to name a woman she has never met. The Gothic novel supplies the vocabulary available to her. In this scene Jane is short of words too.` },
    c_extinguished: { tier: 'annotation', text: `She looks at Jane face to face, by candlelight, and leaves her unharmed. In the one meeting between them that the novel stages, the woman upstairs does nothing to Jane but look.` },
    c_creature: { tier: 'annotation', reflect: 'nerves', text: `Now Jane’s testimony is discredited, with the same tools: nerves, fever, an over-stimulated brain. Rochester knows exactly who was in her room.\n\nNotice the femininity he praises while he does it: nerves *not made for rough handling*. The woman upstairs, in Jane’s own account of the attic, “showed virile force in the contest.” Delicacy is defined against her too.` },
    c_real: { tier: 'annotation', text: `Jane holds her ground, and the next morning in the church proves her right. Her credibility is restored by the plot, because the plot is hers. The woman who came to her room has no later chapter in which to be believed.` },
    c_madcat: { tier: 'criticism', by: 'Gilbert & Gubar, 1979', reflect: 'madcat', text: `Jane is the first woman called mad in this novel, and the first locked in a room for it. Gilbert and Gubar trace the woman in the attic back to this scene.\n\nRead the novel as a story about where madness lives. At ten it is in Jane. By the end it has been moved upstairs, into another woman’s body, and Jane has grown up into the one who narrates.` },
    c_rebelslave: { tier: 'criticism', by: 'Meyer, 1990', text: `Jane borrows the figure of the enslaved rebel to describe an English child’s anger. Susan Meyer argues that the novel repeatedly uses slavery as a metaphor for English women’s subordination while the people of the colonies stay at its margins. The woman from Jamaica upstairs is as close as the novel brings that world to the house.` },
    c_fullname: { tier: 'annotation', text: `Her full name appears once in the novel, here, read aloud by a stranger in a church. Until this page she has been a laugh, a fire, and Grace Poole.` },
    c_jonas: { tier: 'context', text: `Rochester calls him “a West India planter and merchant” (Ch. XXVII). Spanish Town was the capital of colonial Jamaica. In the 1790s Jamaican planter wealth rested on the labour of enslaved Africans; Britain abolished slavery in its colonies only in 1834, and forced “apprenticeship” lasted until 1838. The novel never mentions slavery in connection with the Masons. That silence is part of the record too.\n\nOn dating: in Chapter XXXII Jane is given Scott’s *Marmion* (1808) as “a new publication.” If that clue is trusted, Jane’s story falls around 1808 and this wedding, fifteen years earlier, in the early 1790s. Brontë’s chronology is loose, so treat this as an estimate.` },
    c_antoinetta: { tier: 'context', by: 'Rhys, 1966', text: `Her middle name is her mother’s. It is the only place in the novel where the “infamous mother” of Rochester’s story has a name, and where a line of descent runs through women.\n\nIn 1966 the Dominican-born novelist Jean Rhys took the name for the heroine of *Wide Sargasso Sea*, Antoinette Cosway, and made “Bertha” the name her English husband imposes on her.` },
    c_creole: { tier: 'context', text: `In this period *Creole* could describe a person of European descent born in the Caribbean, as well as people of African or mixed descent born there. The word marks her mother as colonial-born. It does not settle her race, and the novel never does.` },
    c_dashes: { tier: 'annotation', text: `Brontë blanks the year, the county, the shire, and the church. Dashes like these were a common convention of discretion in fiction of the period. Here the effect is pointed: the one document that gives her a full name and a mother withholds the place and the date.` },
    c_existence: { tier: 'annotation', text: `The law recognises her existence, as a wife. It is the first sentence in the novel to treat her as a person with standing, and it is spoken to stop another woman’s wedding.` },
    c_funchal: { tier: 'criticism', by: 'Spivak 1985 · Valint 2017', text: `Jane’s uncle, John Eyre, is a merchant in Madeira who works for the Masons’ trading house. The commercial network that produced the first Mrs. Rochester’s dowry is the one that stops the second wedding. When John Eyre dies it also makes Jane an heiress, with twenty thousand pounds.\n\nCritics disagree about what this implicates. Readers following Spivak see Jane’s independence funded by colonial trade. Alexandra Valint argues that Jane’s uneasy handling of the legacy, which she divides with her cousins, keeps her at a distance from it.` },
    c_witch: { tier: 'annotation', text: `His word for her planning. A madness that waits for the keeper to drink, takes the key from her pocket, and chooses which rooms to burn is described as a talent for deception.` },
    c_knew: { tier: 'annotation', text: `He supposes she knew what had passed between her husband and the governess, which nobody had told her. A mind that follows the household’s affairs from behind a locked door is a strange thing to call insane, and he offers it as gossip.` },
    c_dontknow: { tier: 'annotation', text: `The landlord marks his own story as hearsay. The novel’s last testimony about her life is rumour, told to a stranger at an inn.` },
    c_mile: { tier: 'annotation', text: `The only time in the novel that her voice carries. Everyone in the grounds could hear her, from a mile away. Not one witness repeats a word she said.` },
    c_heardhim: { tier: 'annotation', text: `His words are reported exactly: her name. Hers are reported as volume. The landlord is clear that Rochester had already got the servants out and went up to reach her. The novel is fair to him here, and it still keeps her silent.` },

    /* -------------------------------------------------------- the thesis */
    thesis: {
      place: 'The Reading Room', title: 'Playing in the Attic', cite: 'A thesis, after Toni Morrison', measure: 'wide', essay: true,
      beats: [
        { blocks: [
          { t: 'essayhead', kicker: 'The thesis this game has been arguing', sub: 'Sanity and the literary imagination' },
          P(`You were asked to look at a woman. This page asks what she was *for*.`),
          H('Morrison’s turn'),
          P(`In *Playing in the Dark: Whiteness and the Literary Imagination* (1992), first given as lectures at Harvard in 1990, Toni Morrison read classic American fiction for its black characters, who are so often minor, silent or decorative, and found them doing structural work. Through them white writers imagined what it meant to be free, innocent, rational, and white. Freedom is easiest to picture standing next to someone who is not free. Morrison asked critics to turn their attention from the people described to the people doing the describing. As she put it, “the subject of the dream is the dreamer.”`),
          H('The thesis'),
          P(`The madwoman of the canon does the same kind of work for sanity. She is rarely the subject of her own book. She is placed beside a heroine, a husband, a household and a reader, and by contrast she makes their normality visible: their reason, their restraint, their believable speech, their lawful desire, their right to marry and to narrate. Madness in these novels is less a condition the text observes than a backdrop the text needs. There is no sane heroine without her.`),
          P(`Sanity here works like the whiteness Morrison describes: an unmarked category that defines itself by what it marks. The woman in the attic is marked so that the woman in the drawing room does not have to be.`),
          H('The evidence in the glass'),
          s => P(`You gathered ${s.reflections.length} of ${Object.keys(reflections).length} reflections. Each sets something said about her beside what it lets someone else become.`),
          { t: 'glasslist' },
          P(`The plainest is Rochester’s own. On the wedding morning he shows the witnesses his wife, then puts his hand on Jane’s shoulder:`),
          Q(ROCH, 'Ch. XXVI', `“…this young girl, who stands so grave and quiet at the mouth of hell, looking collectedly at the gambols of a demon. I wanted her just as a change after that fierce ragout.”`),
          P(`He values Jane as *a change*, as the opposite of something. The novel makes the comparison out loud and asks the room to judge by it. And read as a whole, *Jane Eyre* is the story of where madness lives. At ten it lives in Jane, the “mad cat” locked in the red-room. By the end it has been moved upstairs into another woman’s body, and the girl who was once restrained with garters has grown into the one who narrates.`)
        ], cont: 'Read on' },
        { blocks: [
          H('Credibility is relational'),
          P(`The comparison also decides whose words count. Jane is praised as “no talking fool” for keeping quiet; the only sentence the other woman is recorded saying is “gibberish.” When Rochester calls Jane’s account of the veil night a dream, the plot vindicates her the next morning, because the plot is hers. Miranda Fricker calls it testimonial injustice when prejudice makes a hearer discount a speaker. In these novels the discount is shared out between women. One woman’s credibility is built from another’s lack of it, and the standard of a valid witness is set against someone who can never meet it.`),
          H('Two kinds of dark'),
          P(`Morrison’s argument is about race, and in Bertha’s case the comparison stops being only a comparison. The woman made to stand for madness is also the novel’s colonial woman: a Creole mother, a Spanish Town wedding, a West Indian night of sulphur set against a wind fresh from Europe, a fortune that came from planters. Her madness and her colonial origin are described in the same breath, and the novel rarely separates them. The attic holds both of the shadows that English sanity and English whiteness are defined against.`),
          H('The dreamer in the glass'),
          P(`This game gave you the god’s position and asked you to read, to judge or to rescue. Whatever you did, she reflected it back.`),
          { t: 'youglass' },
          P(`Sympathetic readings use her as well. The rebel, the victim, the double, the voice recovered: each makes her a mirror for a reader’s politics. Morrison’s point applies to readers as much as to writers. What a reader dreams about the madwoman is evidence about the reader.`)
        ], cont: 'Read on' },
        { blocks: [
          H('Where the thesis strains'),
          P(`This argument has limits, and it should name them. Morrison writes about a specific history, American slavery and the people it made into property, and about how that history shaped a national literature. Madness is not a people in that sense, and an analogy that moves too quickly from race to madness risks treating her argument as a general method and losing what it was about. The thesis is strongest where the two meet, as they do in Bertha, and it should be tested before it is assumed elsewhere.`),
          P(`It also joins a conversation already under way. Michel Foucault’s *History of Madness* (1961) argued that the age of reason defined itself by confining unreason. Elaine Showalter’s *The Female Malady* (1985) traced how English culture made madness into a woman’s condition. Gilbert and Gubar (1979) read the madwoman as the heroine’s double; Spivak (1985) showed that the double was also a colonial subject sacrificed for the heroine. What Morrison adds is a direction of attention: away from what the madwoman is, and toward what the people around her need her to be.`),
          H('The other volumes'),
          P(`The rest of the Reading Room is still sealed. Each volume holds a woman who stands beside someone her book calls normal: a wife beside a physician husband, a daughter beside a prince, a lady beside the family that needs a scandal kept quiet, an aunt beside the sister who managed America, a widow beside a village that has heard her story too often. The thesis becomes a question to take to each of them. Who is made sane by her?`)
        ], choices: 'THESIS-END' }
      ]
    }

  /* ------------------------------------------------- the acts (for silence) */
  const acts = [

  /* ------------------------------------------------------- afterword */
  const ENDINGS = { door: 'The Door', keeper: 'The Keeper', roof: 'The Witness', unwritten: 'Unwritten', shore: 'The Other Shore', close: 'The Reader Leaves' };
  const ROLE_LINE = {
    reader: { door: 'You came only to read, and you ended by turning a key.', keeper: 'You came to read, and you ended by keeping the house in order.', roof: 'You came to read, and you read to the end, including the part the novel only reports.', unwritten: 'You came to read, and you ended by removing the text.', shore: 'You came to read, and you followed the text to the place where it stops.', close: 'You came to read, and you stopped.' },
    judge: { door: 'You came to judge. You acted on your own verdict, and she was not consulted about the sentence.', keeper: 'You came to judge, and your last act enforced the existing order.', roof: 'You came to judge, and in the end you only witnessed. That may be the more honest role.', unwritten: 'You came to judge, and you ended by giving up the bench entirely.', shore: 'You came to judge, and you went looking for evidence the court never had.', close: 'You came to judge, and you adjourned indefinitely.' },
    rescuer: { door: 'You came to rescue her, and you did: you chose the moment and the means. She did not ask you to.', keeper: 'You came to rescue her, and you ended by securing her door.', roof: 'You came to rescue her, and you watched. This rescue may never have been yours to make.', unwritten: 'You came to rescue her, and in the end you let her act without you. It is the only ending in which you are not the hero.', shore: 'You came to rescue her and went back to before she needed rescuing, and found almost nothing there.', close: 'You came to rescue her, and you left her where you found her.' }
  };
  const FINDING = { mad: 'You found her mad.', notproven: 'Not proven.', incompetent: 'You declined to judge her.', adjourn: 'You adjourned the hearing to hear her.' };
  const NAMES = { bertha: 'Bertha', mrs: 'Mrs. Rochester', antoinetta: 'Antoinetta', none: 'No name' };

  function readingPattern(s) {
    const ks = Object.keys(ACTS).filter(k => s.readings[k]).map(k => s.readings[k]);
    if (!ks.length) return 'You recorded no reading of her acts.';
    const all = v => ks.every(x => x === v);
    if (ks.length >= 2 && all('madness')) return 'Each time, you took the household’s word. That is the reading the novel was built to produce, and most of its first readers produced it.';
    if (ks.length >= 2 && all('resistance')) return 'You read every act as rebellion. It is a more generous story than Rochester’s, and it is still a story told about her, with motives she never states.';
    if (ks.length >= 2 && all('suffering')) return 'You read her as a victim each time. Pity is the feeling Brontë said she had underwritten. It still leaves you deciding what she felt.';
    if (ks.length >= 2 && all('open')) return 'You withheld judgment every time. That is faithful to the evidence. It is also the condition the household relied on: a woman about whom nothing can be decided can be kept indefinitely.';
    if (ks.length === 1) return 'You recorded one reading. One act is not yet a pattern.';
    return 'Your readings shifted from act to act. With a record this partial, inconsistency may be the most accurate response available.';
  }

  function afterword(s) {
    const rows = [];
    rows.push({ label: 'You came as', text: ({ reader: 'A reader', judge: 'A judge', rescuer: 'A rescuer' })[s.role] || '—', note: (ROLE_LINE[s.role] || {})[s.ending] || '' });
    rows.push({ label: 'Your finding', text: FINDING[s.finding] || 'You did not close the hearing.' });
    rows.push({ label: 'Her name in your record', text: s.voice.mode === 'unasked' ? 'You did not name her.' : (NAMES[s.name] || '—') });
    rows.push({ label: 'Her testimony', voice: true, text: ({ unasked: 'You did not call her as a witness.', silence: 'You left the page blank.', tiles: 'A statement assembled from the record:', write: 'Written in your hand:' })[s.voice.mode] || 'Not entered.' });
    rows.push({ label: 'Your readings', readings: Object.keys(ACTS).filter(k => s.readings[k]).map(k => [ACTS[k], READ_LABELS[s.readings[k]]]).concat(s.readings.placement ? [['The laugh’s placement (Ch. XII)', PLACEMENT[s.readings.placement]]] : []), note: readingPattern(s) });
    const notHeard = witnesses.filter(w => !s.heard.includes(w.id)).map(w => w.name);
    rows.push({ label: 'Witnesses heard', text: `${s.heard.length} of 7.` + (notHeard.length ? ` Not heard: ${notHeard.join('; ')}.` : ' You heard every account the record holds, except hers.') });
    const ident = s.struck.filter(w => lexicon.find(l => l.w === w && l.identity));
    rows.push({ label: 'Words you struck', text: s.struck.length ? s.struck.join(', ') + '.' : 'None.', note: s.struck.length ? 'The novel still says them. Striking a word records an objection; it does not recover what should have been said instead.' + (ident.length ? ` You also struck words that said who she was (${ident.join(', ')}), not only what she was called.` : '') : 'You can strike words from the Record, under “Words for her.”' });
    return rows;
  }

  /* the player's own reflections, for the thesis */
  function youGlass(s) {
    const out = [];
    const role = { reader: ['a text to be read closely', 'the careful reader'], judge: ['the accused', 'the judge'], rescuer: ['the one who needs rescuing', 'the rescuer'] }[s.role];
    if (role) out.push(role);
    const f = { mad: ['mad', 'the sane court that found her so'], notproven: ['not proven', 'the court that withheld a verdict, and the key'], incompetent: ['beyond judgment', 'the one who declined to judge'], adjourn: ['a witness, at last', 'the court that called her'] }[s.finding];
    if (f) out.push(f);
    const v = { tiles: ['a sentence made of others’ words', 'the one who arranged them'], write: ['words in your hand', 'her author'], silence: ['a blank page', 'the one who left it blank'], unasked: ['unasked', 'the one who left without asking'] }[s.voice.mode];
    if (v) out.push(v);
    const counts = {};
    Object.keys(ACTS).forEach(k => { if (s.readings[k]) counts[s.readings[k]] = (counts[s.readings[k]] || 0) + 1; });
    const top = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
    const r = { resistance: ['a rebel', 'a reader who admires rebels'], madness: ['mad', 'a reader who can tell'], suffering: ['a victim', 'a reader who pities'], open: ['undecidable', 'a reader who keeps an open mind'] }[top];
    if (r) out.push(r);
    const e = { door: ['freed', 'the liberator'], keeper: ['kept safe', 'the keeper'], roof: ['the subject of a witness', 'the witness'], unwritten: ['erased, or free', 'the one who stepped back'], shore: ['a blank in the archive', 'the archivist'], close: ['left where she was', 'the reader who left'] }[s.ending];
    if (e) out.push(e);
    return out.map(([her, other]) => ({ her, other, who: 'you' }));
  }

    'Virginia Woolf, *A Room of One’s Own* (1929).',
    'Michel Foucault, *Histoire de la folie à l’âge classique* (1961); English as *History of Madness*.',
    'Jean Rhys, *Wide Sargasso Sea* (1966).',
    'Sandra M. Gilbert and Susan Gubar, *The Madwoman in the Attic* (1979).',
    'Gayatri Chakravorty Spivak, “Three Women’s Texts and a Critique of Imperialism,” *Critical Inquiry* 12.1 (1985); “Can the Subaltern Speak?” (1988).',

    'Susan L. Meyer, “Colonialism and the Figurative Strategy of *Jane Eyre*,” *Victorian Studies* 33.2 (1990).',
    'Toni Morrison, *Playing in the Dark: Whiteness and the Literary Imagination* (1992).',
    'Miranda Fricker, *Epistemic Injustice: Power and the Ethics of Knowing* (2007).',
    'Alexandra Valint, “Madeira and *Jane Eyre*’s Colonial Inheritance,” *Victorian Literature and Culture* 45.2 (2017).'
  ];

  UH.registerStory({

    title: 'The Third Storey',
    heroine: 'Bertha Antoinetta Mason',

    endings: ENDINGS,

    afterword, youGlass, sources,
    sourceNote: 'Quotations from the novel and from the 1848 letter are verbatim; ellipses mark omissions. Critical positions are paraphrased and attributed. Scenes marked as staged or invented are this game’s, not Brontë’s.',
    vars: s => ({ name: nameOf(s), Name: nameOf(s).charAt(0).toUpperCase() + nameOf(s).slice(1) })
  });
})();
