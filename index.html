<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unwriting Her</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An interactive literary investigation into the women written as mad.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IM+Fell+English:ital@0;1&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Spectral:ital,wght@0,300;0,400;1,300;1,400&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: one reading column whose measure tightens in the attic and widens in the margin;
   the Record is a ledger drawn in from the right edge. A single candlelit look, chosen on purpose. */
:root {
  --soot: #15110e;        /* the room at night */
  --soot-2: #1d1814;      /* raised paper in shadow */
  --soot-3: #2a231c;      /* hover, pressed */
  --rule: #3b3229;        /* hairlines */
  --vellum: #ebe2d1;      /* print */
  --faded: #ab9f88;       /* faded iron-gall ink */
  --dim: #7d725f;         /* captions */
  --tallow: #dcae67;      /* candlelight: marks, focus, the light under the door */
  --glass: #aac3db;       /* the reader's own ink, silvered like a mirror */
  --wax: #c55c4c;         /* strike-throughs and fire */

  --f-display: 'IM Fell English', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --f-text: 'Old Standard TT', 'Bodoni 72', 'Didot', Georgia, serif;
  --f-voice: 'Spectral', 'Iowan Old Style', Georgia, serif;
  --f-label: 'Courier Prime', 'Courier New', Courier, monospace;

  --step--1: 0.8rem;
  --step-0: 1.0625rem;
  --step-1: 1.2rem;
  --step-2: 1.6rem;
  --step-3: 2.4rem;
  --step-4: clamp(2.8rem, 8vw, 5.2rem);

  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--soot); }
body {
  background: var(--soot);
  color: var(--vellum);
  font-family: var(--f-voice);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--soot); }
button { font: inherit; color: inherit; }
::selection { background: rgba(220, 174, 103, 0.3); }
:focus-visible { outline: 2px solid var(--tallow); outline-offset: 2px; border-radius: 2px; }
em { font-style: italic; }
.hand { font-family: var(--f-display); font-style: italic; color: var(--glass); }
.kicker { font-family: var(--f-label); font-size: var(--step--1); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); margin: 0; }
.struck { text-decoration: line-through; text-decoration-color: var(--wax); text-decoration-thickness: 1.5px; color: var(--dim); }

.btn { appearance: none; border: 1px solid var(--rule); background: transparent; padding: 0.7rem 1.15rem; border-radius: 2px; cursor: pointer; font-family: var(--f-label); font-size: 0.86rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--vellum); transition: border-color .2s, background .2s, color .2s; }
.btn:hover { border-color: var(--tallow); background: var(--soot-2); }
.btn.primary { border-color: var(--tallow); color: var(--tallow); }
.btn.primary:hover { background: rgba(220, 174, 103, 0.1); }
.btn.quiet { color: var(--faded); }
.btn.small { padding: 0.4rem 0.7rem; font-size: 0.74rem; }
.btn:disabled { opacity: 0.4; cursor: default; border-color: var(--rule); }

/* ---------------------------------------------------------------- landing */
.landing {
  display: grid; grid-template-columns: auto minmax(0, 36rem); gap: clamp(2rem, 6vw, 5.5rem);
  align-items: center; justify-content: center;
  padding-block: clamp(4rem, 14vh, 9rem);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.door { appearance: none; padding: 0; cursor: pointer; transition: box-shadow .4s, border-color .4s; position: relative; width: clamp(5rem, 11vw, 8rem); aspect-ratio: 9 / 20; max-width: 100%; border: 1px solid var(--rule); background: linear-gradient(180deg, #1a1511 0%, #120f0c 100%); box-shadow: inset 0 0 0 6px #17120f, inset 0 0 0 7px #2c241d; }
.door:hover { border-color: #5a4a37; box-shadow: inset 0 0 0 6px #17120f, inset 0 0 0 7px #2c241d, 0 30px 60px -20px rgba(220, 174, 103, 0.25); }
.door::before { content: ""; position: absolute; right: 14%; top: 52%; width: 5px; height: 5px; border-radius: 50%; background: #4a3e31; }
.door-light { position: absolute; left: 2px; right: 2px; bottom: -1px; height: 2px; background: var(--tallow); box-shadow: 0 0 14px 3px rgba(220, 174, 103, 0.45), 0 0 40px 10px rgba(220, 174, 103, 0.12); animation: flicker 4.5s ease-in-out infinite; }
@keyframes flicker { 0%, 100% { opacity: .85 } 18% { opacity: .62 } 22% { opacity: .95 } 55% { opacity: .74 } 70% { opacity: 1 } }
.land-text { display: grid; gap: 1.1rem; min-width: 0; }
.land-title { font-family: var(--f-display); font-weight: 400; font-size: var(--step-4); line-height: 0.95; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.claim { margin: 0.6rem 0 0; font-family: var(--f-text); font-size: 1.5rem; }
.struckline { position: relative; display: inline-block; }
.struckline::after { content: ""; position: absolute; left: -2%; top: 54%; height: 2px; width: 0; background: var(--wax); animation: strikeIn 0.9s cubic-bezier(.6, 0, .2, 1) 1.1s forwards; }
@keyframes strikeIn { to { width: 104%; } }
.ask { margin: 0; font-size: 1.35rem; }
.lede { margin: 0.4rem 0 0; color: var(--faded); max-width: 34rem; font-size: var(--step-0); }
.land-actions { margin-top: 0.8rem; }
.foot { margin: 0.6rem 0 0; font-family: var(--f-label); font-size: 0.74rem; color: var(--dim); letter-spacing: 0.04em; }

/* ---------------------------------------------------------------- hub */
.hub-bar, .bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 1rem; min-height: 3.2rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(21, 17, 14, 0.94); border-bottom: 1px solid var(--rule);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.wordmark { appearance: none; border: 0; background: none; padding: 0.3rem 0; cursor: pointer; font-family: var(--f-display); font-size: 1.15rem; color: var(--vellum); white-space: nowrap; }
.wordmark:hover { color: var(--tallow); }
.hub { max-width: 60rem; margin: 0 auto; padding-block: 3.5rem 5rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hub-head h1 { font-family: var(--f-display); font-weight: 400; font-size: var(--step-3); margin: 0.4rem 0 0.6rem; line-height: 1.05; }
.hub-lede { color: var(--faded); max-width: 38rem; margin: 0; }
.room { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: clamp(1.5rem, 4vw, 3.5rem); align-items: stretch; margin-top: 2.8rem; }
.case { position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 3rem 1.6rem 0; border: 1px solid var(--rule); border-bottom: 0; background: radial-gradient(120% 80% at 18% 0%, rgba(220, 174, 103, 0.09), transparent 60%), var(--soot); min-width: 0; }
.case::before { content: ""; position: absolute; inset: 0.6rem 0.6rem 0; border: 1px solid #2a231c; border-bottom: 0; pointer-events: none; }
.case-glow { position: absolute; left: 4%; top: 0; width: 34%; height: 75%; background: radial-gradient(closest-side, rgba(220, 174, 103, 0.16), transparent); pointer-events: none; animation: flicker 5s ease-in-out infinite; }
.shelf { position: relative; display: flex; align-items: flex-end; gap: 0.3rem; height: clamp(15rem, 32vw, 21rem); }
.spine { appearance: none; position: relative; flex: 1 1 0; min-width: 0; height: var(--h, 96%); padding: 1.1rem 0 2.6rem; border: 1px solid #2c241d; border-bottom: 0; border-radius: 2px 2px 0 0; background: linear-gradient(90deg, #0e0b09 0%, #1d1814 22%, #191410 70%, #0c0a08 100%); color: var(--faded); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.8rem; transition: transform .4s cubic-bezier(.2, .7, .2, 1), border-color .3s, color .3s; }
.spine::before, .spine::after { content: ""; position: absolute; left: 14%; right: 14%; height: 3px; border-top: 1px solid rgba(220, 174, 103, 0.55); border-bottom: 1px solid rgba(220, 174, 103, 0.3); }
.spine::before { top: 0.55rem; }
.spine::after { bottom: 1.9rem; }
.spine:hover { transform: translateY(-0.5rem); color: var(--vellum); }
.spine.sel { transform: translateY(-0.9rem); border-color: rgba(220, 174, 103, 0.7); color: var(--tallow); }
.spine.live { color: var(--vellum); }
.spine.live.sel { color: var(--tallow); }
.spine-band { display: none; }
.spine-name { writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--f-display); font-size: clamp(0.92rem, 1.5vw, 1.12rem); letter-spacing: 0.02em; line-height: 1.1; max-height: 74%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spine-year { position: absolute; bottom: 0.65rem; font-family: var(--f-label); font-size: 0.6rem; letter-spacing: 0.06em; color: var(--dim); }
.spine.sel .spine-year, .spine.live .spine-year { color: var(--tallow); }
.spine-seal { position: absolute; bottom: 2.6rem; width: 0.5rem; height: 0.5rem; border-radius: 50%; background: #7d3328; }
.spine-flame { position: absolute; top: -2.4rem; width: 0.45rem; height: 1rem; border-radius: 50% 50% 45% 45%; background: radial-gradient(circle at 50% 70%, #fff3d6, var(--tallow) 55%, rgba(220, 174, 103, 0)); animation: flicker 3.2s ease-in-out infinite; }
.spine-flame::after { content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 1.3rem; margin-left: -1px; background: var(--faded); opacity: 0.55; }
.plank { height: 0.6rem; margin: 0 -1.6rem; background: var(--soot-2); border-top: 1px solid rgba(220, 174, 103, 0.5); border-bottom: 1px solid var(--rule); }
.catalogue { display: flex; flex-direction: column; gap: 0.35rem; padding: 1.8rem 1.7rem 1.9rem; border: 1px solid #5a4a37; background: var(--soot-2); min-width: 0; justify-content: center; }
.catalogue .slip-name { font-size: 2rem; }
.slip-meta { display: flex; justify-content: space-between; gap: 1rem; margin: 0; font-family: var(--f-label); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.slip-name { font-family: var(--f-display); font-weight: 400; font-size: 1.45rem; line-height: 1.15; margin: 0.25rem 0 0; text-wrap: balance; }
.sealed .slip-name { color: var(--faded); }
.slip-work { margin: 0; font-family: var(--f-text); font-style: italic; color: var(--faded); }
.slip-blurb { margin: 0.35rem 0 0; color: var(--faded); font-size: 0.95rem; max-width: 40rem; }
.catalogue .slip-blurb { color: var(--vellum); font-size: 1.05rem; }
.slip-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
.slip-ends { margin: 0.4rem 0 0; font-family: var(--f-label); font-size: 0.74rem; color: var(--tallow); }
.seal { margin: auto 0 0; padding-top: 0.9rem; font-family: var(--f-label); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.seal::before { content: ""; display: inline-block; width: 0.55rem; height: 0.55rem; margin-right: 0.5rem; border-radius: 50%; background: #7d3328; vertical-align: 0.02em; }

/* ---------------------------------------------------------------- story bar */
.bar-place { flex: 1; min-width: 0; font-family: var(--f-label); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-actions { display: flex; gap: 0.4rem; align-items: center; margin-left: auto; }
.bar-btn { appearance: none; border: 1px solid transparent; background: none; padding: 0.4rem 0.6rem; border-radius: 2px; cursor: pointer; font-family: var(--f-label); font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faded); }
.bar-btn:hover, .bar-btn[aria-expanded="true"] { color: var(--vellum); border-color: var(--rule); }
.rec-count { display: inline-block; min-width: 1.4em; padding: 0 0.3em; margin-left: 0.15em; border-radius: 1em; background: var(--soot-3); color: var(--tallow); text-align: center; font-variant-numeric: tabular-nums; }
.rec-count.pulse { animation: pulse 0.9s ease-out; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(220, 174, 103, 0.6); } 100% { box-shadow: 0 0 0 10px rgba(220, 174, 103, 0); } }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 0.5rem); width: min(19rem, calc(100vw - 32px)); background: var(--soot-2); border: 1px solid var(--rule); padding: 0.4rem; display: grid; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5); }
.menu-item { appearance: none; border: 0; background: none; text-align: left; padding: 0.7rem 0.8rem; cursor: pointer; font-family: var(--f-voice); font-size: 1rem; color: var(--vellum); }
.menu-item:hover { background: var(--soot-3); }
.menu-confirm { padding: 0.6rem 0.8rem 0.8rem; border-top: 1px solid var(--rule); }
.menu-confirm p { margin: 0 0 0.6rem; color: var(--faded); font-size: 0.95rem; }
.menu-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }

/* ---------------------------------------------------------------- story column */
.story { --measure: 37rem; max-width: calc(var(--measure) + 32px); margin: 0 auto; padding-block: 3.2rem 6rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.story[data-measure="narrow"] { --measure: 31rem; }
.story[data-measure="wide"] { --measure: 43rem; }
.scene-head { display: grid; gap: 0.35rem; margin-bottom: 2.4rem; }
.place { margin: 0; font-family: var(--f-label); font-size: 0.74rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--tallow); opacity: 0.85; }
.scene-title { font-family: var(--f-display); font-weight: 400; font-size: var(--step-3); line-height: 1.05; margin: 0; text-wrap: balance; }
.scene-title:focus { outline: none; }
.scene-cite { margin: 0; font-family: var(--f-text); font-style: italic; color: var(--faded); }
.staged { margin: 0.8rem 0 0; padding: 0.55rem 0.8rem; border: 1px dashed rgba(220, 174, 103, 0.45); font-family: var(--f-label); font-size: 0.74rem; color: var(--tallow); letter-spacing: 0.03em; }
.beat { display: grid; gap: 1.35rem; padding-top: 1.6rem; scroll-margin-top: calc(4.2rem + env(safe-area-inset-top, 0px)); }
.beat + .beat { margin-top: 1.6rem; border-top: 1px solid var(--rule); padding-top: 2.6rem; }
.beat.enter > * { animation: rise 0.7s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--k, 0) * 90ms); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.enter { animation: rise 0.55s cubic-bezier(.2, .7, .2, 1) both; }

.narr p { margin: 0; }
.narr p + p { margin-top: 0.9em; }
.narr { font-family: var(--f-voice); font-weight: 300; font-size: 1.13rem; line-height: 1.68; color: var(--vellum); }
.narr.small { font-family: var(--f-label); font-weight: 400; font-size: 0.8rem; color: var(--dim); line-height: 1.5; }
.sub { font-family: var(--f-display); font-weight: 400; font-size: var(--step-2); margin: 0.6rem 0 0; line-height: 1.15; text-wrap: balance; }

.quote { margin: 0; padding-left: 1.15rem; border-left: 1px solid var(--rule); }
.quote blockquote { margin: 0.4rem 0 0; font-family: var(--f-text); font-size: 1.16rem; line-height: 1.66; color: var(--vellum); }
.quote blockquote p { margin: 0; }
.quote blockquote p + p { margin-top: 0.8em; }
.quote.doc { padding: 1.1rem 1.25rem 1.2rem; border: 1px solid #4a3d30; background: linear-gradient(180deg, #221b15, #1b1612); }
.quote.doc blockquote { font-size: 1.1rem; }
.quote.interrupt { animation: interrupt 1.1s cubic-bezier(.2, .7, .2, 1) 1.3s both; }
@keyframes interrupt { 0% { opacity: 0; transform: translateX(-4px); } 40% { opacity: 1; transform: translateX(3px); } 100% { opacity: 1; transform: none; } }
.cap { display: flex; flex-wrap: wrap; gap: 0.3rem 0.8rem; margin: 0; font-family: var(--f-label); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.cap-tier { font-family: var(--f-label); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; }
.cap-tier[data-tier="text"] { color: var(--tallow); }
.cap-tier[data-tier="annotation"] { color: var(--faded); }
.cap-tier[data-tier="context"] { color: #c6b48f; }
.cap-tier[data-tier="criticism"] { color: var(--vellum); }
.cap-tier[data-tier="conjecture"] { color: var(--tallow); }
.cap-tier[data-tier="margin"] { color: var(--glass); }
.cap-who { color: var(--faded); }

.clue { display: inline; padding: 0 0.05em; border-bottom: 1px dotted var(--tallow); cursor: pointer; transition: background .2s; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.clue:hover { background: rgba(220, 174, 103, 0.13); }
.clue.seen { border-bottom-style: solid; border-bottom-color: rgba(220, 174, 103, 0.55); }
.clue[aria-expanded="true"] { background: rgba(220, 174, 103, 0.16); }
.clue.demo { cursor: default; }

.glosses { display: grid; gap: 0.8rem; }
.glosses:empty { display: none; }
.gloss { position: relative; margin: 0; padding: 0.95rem 1.1rem 1rem; background: var(--soot-2); border-left: 2px solid var(--faded); font-family: var(--f-voice); font-size: 1rem; line-height: 1.6; }
.gloss[data-tier="context"] { border: 1px solid #4a3d30; border-left-width: 2px; border-left-color: #c6b48f; }
.gloss[data-tier="criticism"] { border-left-color: var(--vellum); }
.gloss[data-tier="conjecture"] { background: transparent; border: 1px dashed rgba(220, 174, 103, 0.55); }
.gloss[data-tier="margin"] { border-left-color: var(--glass); }
.gloss-cap { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.3rem 0.8rem; margin: 0 0 0.45rem; font-family: var(--f-label); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); padding-right: 1.8rem; }
.gloss-body p { margin: 0; }
.gloss-body p + p { margin-top: 0.75em; }
.gloss-close { position: absolute; right: 0.5rem; top: 0.45rem; appearance: none; border: 0; background: none; color: var(--dim); font-size: 1.2rem; line-height: 1; padding: 0.2rem 0.4rem; cursor: pointer; }
.gloss-close:hover { color: var(--vellum); }
.gloss.inline { background: transparent; }
.gloss .glass { margin-top: 0.9rem; }

/* the glass */
.glass { border: 1px solid #36404a; background: linear-gradient(90deg, rgba(170, 195, 219, 0.03), rgba(170, 195, 219, 0.07) 50%, rgba(170, 195, 219, 0.03)); padding: 0.8rem 0.9rem 0.9rem; }
.glass-cap { display: flex; justify-content: space-between; gap: 0.8rem; margin: 0 0 0.6rem; font-family: var(--f-label); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--glass); opacity: 0.85; }
.glass-panes { display: grid; grid-template-columns: minmax(0, 1fr) 1px minmax(0, 1fr); gap: 0.9rem; align-items: start; }
.glass-line { align-self: stretch; background: linear-gradient(180deg, transparent, var(--glass), transparent); opacity: 0.7; }
.pane { display: grid; gap: 0.15rem; min-width: 0; }
.pane.her { text-align: right; }
.pane-k { font-family: var(--f-label); font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
.pane-t { font-family: var(--f-text); font-size: 1rem; line-height: 1.4; }
.pane.her .pane-t { font-style: italic; color: var(--faded); }
.glass-list { display: grid; gap: 0.7rem; }
.glass-list.you .pane.other .pane-t { color: var(--glass); font-family: var(--f-display); font-style: italic; }
.glass-missing, .empty { margin: 0; font-family: var(--f-label); font-size: 0.78rem; color: var(--dim); }

/* the mirror line */
.mirror blockquote { overflow-x: auto; }
.mirror-line { appearance: none; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; font: inherit; color: inherit; display: block; width: 100%; }
.mirror-inner { display: inline-block; transform: scaleX(-1); transition: transform 0.9s cubic-bezier(.6, 0, .2, 1), color .6s; color: var(--glass); }
.mirror-line.flipped .mirror-inner { transform: none; color: var(--vellum); }
.mirror-hint { margin: 0.4rem 0 0; font-family: var(--f-label); font-size: 0.7rem; color: var(--dim); }

/* choices */
.choices { display: grid; gap: 0.6rem; margin-top: 1.2rem; }
.choice { appearance: none; display: grid; gap: 0.15rem; width: 100%; text-align: left; padding: 0.85rem 1.05rem 0.9rem; background: transparent; border: 1px solid var(--rule); border-radius: 2px; cursor: pointer; transition: border-color .2s, background .2s; }
.choice:hover { border-color: var(--tallow); background: var(--soot-2); }
.choice .c-label { font-family: var(--f-display); font-size: 1.22rem; line-height: 1.25; color: var(--vellum); }
.choice .c-sub { font-family: var(--f-voice); font-size: 0.95rem; color: var(--faded); }
.choice.primary-choice { border-color: rgba(220, 174, 103, 0.6); }
.choice.primary-choice .c-label { color: var(--tallow); }
.choice.locked { cursor: default; border-style: dashed; }
.choice.locked:hover { background: transparent; border-color: var(--rule); }
.choice.locked .c-label { color: var(--dim); text-decoration: line-through; text-decoration-color: var(--wax); text-decoration-thickness: 1.5px; }
.choice.locked .c-sub { font-family: var(--f-label); font-size: 0.78rem; color: var(--dim); }
.choices.cont { justify-items: start; }
.continue { appearance: none; border: 0; border-top: 1px solid var(--tallow); background: none; padding: 0.7rem 0.1rem 0.2rem; cursor: pointer; font-family: var(--f-label); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--tallow); }
.continue:hover { color: var(--vellum); }
.wait-note { margin: 0.6rem 0 0; font-family: var(--f-label); font-size: 0.78rem; color: var(--dim); }

/* readings */
.reading { display: grid; gap: 0.8rem; padding-top: 0.4rem; }
.reading-q { margin: 0; font-family: var(--f-display); font-size: 1.35rem; line-height: 1.3; color: var(--vellum); text-wrap: balance; }
.reading-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.55rem; }
.reading-opt { appearance: none; display: grid; gap: 0.15rem; text-align: left; padding: 0.75rem 0.85rem; background: transparent; border: 1px solid var(--rule); border-radius: 2px; cursor: pointer; transition: border-color .2s, background .2s; }
.reading-opt:hover { border-color: var(--glass); background: rgba(170, 195, 219, 0.05); }
.r-label { font-family: var(--f-display); font-style: italic; font-size: 1.15rem; color: var(--glass); }
.r-sub { font-size: 0.9rem; color: var(--faded); }
.your-reading { display: flex; align-items: baseline; gap: 0.8rem; margin: 0; }
.your-reading .hand { font-size: 1.35rem; }

/* witnesses */
.witnesses { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.7rem; }
.wcard { appearance: none; display: flex; flex-direction: column; gap: 0.35rem; text-align: left; padding: 0.95rem 1rem 1rem; background: var(--soot-2); border: 1px solid var(--rule); border-radius: 2px; cursor: pointer; min-width: 0; transition: border-color .2s; }
button.wcard:hover { border-color: var(--tallow); }
.w-rel { font-family: var(--f-label); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
.w-name { font-family: var(--f-display); font-size: 1.22rem; line-height: 1.2; color: var(--vellum); }
.w-row { display: grid; grid-template-columns: 3.6rem minmax(0, 1fr); gap: 0.5rem; font-size: 0.9rem; color: var(--faded); line-height: 1.45; }
.w-k { font-family: var(--f-label); font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); padding-top: 0.2em; }
.w-status { margin-top: auto; padding-top: 0.4rem; font-family: var(--f-label); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.wcard.heard { border-color: #5a4a37; }
.wcard.heard .w-status { color: var(--tallow); }
.wcard.missing { grid-column: 1 / -1; background: transparent; border-style: dashed; cursor: default; align-items: flex-start; }
.wcard.missing .w-name { color: var(--faded); }
.w-missing-text { margin: 0.3rem 0 0; color: var(--vellum); font-size: 1rem; }

/* examine */
.examine { display: grid; gap: 0.8rem; }
.ex-label { margin: 0; font-family: var(--f-label); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
.ex-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.ex-btn { appearance: none; padding: 0.55rem 0.8rem; background: transparent; border: 1px solid var(--rule); border-radius: 2px; cursor: pointer; font-family: var(--f-text); font-size: 1rem; color: var(--vellum); }
.ex-btn:hover { border-color: var(--tallow); }
.ex-reveals { display: grid; gap: 1.6rem; }
.ex-reveal { display: grid; gap: 0.9rem; padding-top: 1rem; border-top: 1px dotted var(--rule); }
.ex-title { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 1.25rem; color: var(--tallow); }

/* voice */
.tiles, .write, .silence { display: grid; gap: 0.9rem; }
.compose { min-height: 4.5rem; display: flex; flex-wrap: wrap; gap: 0.35rem 0.45rem; align-content: flex-start; padding: 0.9rem; border: 1px solid #36404a; background: rgba(170, 195, 219, 0.04); }
.compose-empty { font-family: var(--f-label); font-size: 0.78rem; color: var(--dim); }
.tile { appearance: none; padding: 0.3rem 0.55rem; border: 1px solid var(--rule); background: var(--soot-2); border-radius: 2px; cursor: pointer; font-family: var(--f-text); font-size: 1rem; color: var(--vellum); }
.tile:hover { border-color: var(--glass); }
.tile.common { color: var(--faded); background: transparent; }
.tile.placed { font-family: var(--f-display); font-style: italic; font-size: 1.2rem; color: var(--glass); background: transparent; border-color: transparent; padding: 0.1rem 0.2rem; }
.tile.placed:hover { border-color: var(--rule); text-decoration: line-through; text-decoration-color: var(--wax); }
.bank { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.bank-label { margin: 0.4rem 0 0; font-family: var(--f-label); font-size: 0.72rem; color: var(--dim); }
.tile-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; justify-content: flex-end; }
.count-note { margin-right: auto; font-family: var(--f-label); font-size: 0.72rem; color: var(--dim); font-variant-numeric: tabular-nums; }
.statement { display: flex; flex-wrap: wrap; gap: 0.9rem 0.7rem; padding: 1rem 0.2rem; }
.tw { display: grid; justify-items: center; gap: 0.1rem; }
.tw-w { font-size: 1.5rem; line-height: 1.1; }
.tw-by { font-family: var(--f-label); font-size: 0.62rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); max-width: 9rem; text-align: center; }
.hand-input { width: 100%; box-sizing: border-box; resize: vertical; min-height: 9rem; padding: 1rem 1.1rem; background: rgba(170, 195, 219, 0.04); border: 1px solid #36404a; border-radius: 2px; font-family: var(--f-display); font-style: italic; font-size: 1.3rem; line-height: 1.5; color: var(--glass); }
.hand-input::placeholder { color: #5f6f7e; }
.margin-text { white-space: pre-wrap; font-size: 1.3rem; line-height: 1.5; padding: 0.4rem 0 0.4rem 1rem; border-left: 1px solid var(--glass); overflow-wrap: anywhere; }
.margin-text.faded { opacity: 0.45; }
.blank-page { min-height: 15rem; border: 1px solid var(--rule); background: linear-gradient(180deg, #1f1a15, #191511); display: flex; align-items: flex-end; padding: 1rem; }
.blank-text { margin: 0; font-family: var(--f-label); font-size: 0.74rem; color: var(--dim); }
.acts { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.75rem; }
.acts li { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 0.8rem; align-items: baseline; padding-bottom: 0.75rem; border-bottom: 1px dotted var(--rule); }
.act-ch { font-family: var(--f-label); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--tallow); }
.act-t { font-family: var(--f-text); font-size: 1.08rem; }

/* burn */
.burn { display: grid; gap: 0.5rem; justify-items: center; text-align: center; padding: 1.6rem 0; }
.bphrase { margin: 0; font-family: var(--f-text); font-size: 1.12rem; color: var(--vellum); }
.bphrase.last { margin-top: 1.4rem; font-size: 1.5rem; }
.bch { display: inline-block; white-space: pre; }
.bphrase.burning .bch { animation: burn 1.8s ease-in forwards; animation-delay: var(--d, 0ms); }
@keyframes burn { 0% { color: var(--vellum); } 25% { color: var(--tallow); text-shadow: 0 0 10px rgba(197, 92, 76, 0.9); } 55% { color: var(--wax); text-shadow: 0 0 6px rgba(197, 92, 76, 0.6); } 100% { color: transparent; text-shadow: none; opacity: 0; transform: translateY(-10px) scale(0.9); filter: blur(3px); } }
.burn .skip { margin-top: 1.4rem; }
.burned { min-height: 6rem; }

/* afterword */
.afterword { display: grid; gap: 1rem; padding: 1.6rem 1.4rem 1.7rem; border: 1px solid #4a3d30; background: var(--soot-2); }
.after-title { font-family: var(--f-display); font-weight: 400; font-size: var(--step-2); margin: 0; }
.after-dl { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 1rem 1.2rem; margin: 0.4rem 0 0; }
.after-dl dt { font-family: var(--f-label); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); padding-top: 0.25rem; }
.after-dl dd { margin: 0; display: grid; gap: 0.5rem; min-width: 0; }
.after-dl dd p { margin: 0; }
.after-note { color: var(--faded); font-size: 0.97rem; }
.readings-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.3rem; }
.readings-list li { display: flex; justify-content: space-between; gap: 1rem; border-bottom: 1px dotted var(--rule); padding-bottom: 0.25rem; }
.readings-list .hand { white-space: nowrap; }
.after-ends { margin: 0.4rem 0 0; font-family: var(--f-label); font-size: 0.74rem; color: var(--tallow); }

/* essay */
.story.essay { padding-top: 4rem; }
.essay-head { display: grid; gap: 0.5rem; margin-bottom: 1rem; padding-bottom: 1.6rem; border-bottom: 1px solid var(--rule); }
.essay-title { font-family: var(--f-display); font-weight: 400; font-size: clamp(2.6rem, 7vw, 4.2rem); line-height: 1; margin: 0; text-wrap: balance; }
.essay-title:focus { outline: none; }
.essay-sub { margin: 0; font-family: var(--f-text); font-style: italic; font-size: 1.2rem; color: var(--faded); }
.essay .narr { font-family: var(--f-text); font-weight: 400; font-size: 1.15rem; line-height: 1.72; }
.essay .essay-head + .narr p:first-child::first-letter { font-family: var(--f-display); float: left; font-size: 3.4em; line-height: 0.85; padding: 0.06em 0.1em 0 0; color: var(--tallow); }
.sources { display: grid; gap: 0.6rem; margin-bottom: 1.4rem; padding-top: 1.4rem; border-top: 1px solid var(--rule); }
.sources ul { margin: 0; padding-left: 1.1rem; display: grid; gap: 0.35rem; color: var(--faded); font-size: 0.95rem; }
.source-note { margin: 0.4rem 0 0; font-family: var(--f-label); font-size: 0.74rem; color: var(--dim); }


/* ---------------------------------------------------------------- the stage: a room on one side, a page on the other */
.stage { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 40rem); min-height: calc(100vh - 3.2rem); }
.art-wrap { position: sticky; top: calc(3.2rem + env(safe-area-inset-top, 0px)); height: calc(100vh - 3.2rem - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow: hidden; background: #110e0b; }
.art, .art svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.art svg { animation: artIn 1.2s ease both; }
@keyframes artIn { from { opacity: 0; transform: scale(1.03); } to { opacity: 1; transform: none; } }
.motes { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: screen; }
.art-wrap::after { content: ""; position: absolute; inset: 0 0 0 auto; width: 22%; background: linear-gradient(90deg, rgba(21, 17, 14, 0), var(--soot)); pointer-events: none; }
.panel { position: relative; min-width: 0; padding-block: 3rem 4rem; padding-left: clamp(1.4rem, 3vw, 2.8rem); padding-right: max(clamp(1.4rem, 3vw, 2.8rem), env(safe-area-inset-right, 0px)); background: var(--soot); scroll-margin-top: 3.4rem; }
.panel > * { max-width: 40rem; }
.page { min-height: 40vh; }
.page .beat { padding-top: 0.4rem; }
.beat.turn > * { animation: pageIn 0.8s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--k, 0) * 110ms + 80ms); }
@keyframes pageIn { from { opacity: 0; transform: translateY(10px); filter: blur(2px); } to { opacity: 1; transform: none; filter: none; } }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--rule); }
.pager:empty { display: none; }
.pg-btn { appearance: none; border: 0; background: none; padding: 0.3rem 0; cursor: pointer; font-family: var(--f-label); font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faded); }
.pg-btn:hover:not(:disabled) { color: var(--tallow); }
.pg-btn:disabled { opacity: 0.3; cursor: default; }
.pg-count { font-family: var(--f-label); font-size: 0.72rem; color: var(--dim); font-variant-numeric: tabular-nums; }
.pg-spacer { width: 7rem; }
.reread { margin: 0 0 1rem; padding: 0.6rem 0.8rem; border: 1px dashed var(--rule); font-family: var(--f-label); font-size: 0.76rem; color: var(--faded); }
.linkish { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; font: inherit; color: var(--tallow); text-decoration: underline; text-underline-offset: 3px; }

/* hotspots in the art */
.hot { cursor: pointer; outline: none; transition: filter .3s, opacity .3s; }
.hot:hover, .hot:focus-visible { filter: brightness(1.7) drop-shadow(0 0 8px rgba(220, 174, 103, 0.55)); }
.obj.seen { opacity: 0.55; }
.obj.her.seen { opacity: 1; }
.obj.her.seen .rim { opacity: 0.8; }
.ghost { animation: ghost 4s ease-in-out infinite; }
@keyframes ghost { 0%, 100% { opacity: .55; } 50% { opacity: .95; } }
.seam { opacity: 0.18; transition: opacity 1s; }
[data-art="threshold"] .seam, [data-art="corridor"][data-beat="1"] .seam, [data-art="corridor"][data-beat="2"] .seam { opacity: 1; animation: seam 2.6s ease-in-out infinite; }
@keyframes seam { 0%, 100% { opacity: 1; } 30% { opacity: .55; } 60% { opacity: .9; } }
[data-art="leads"][data-beat="2"] .trap-glow { animation: trap 3s ease-in-out infinite; }
@keyframes trap { 0%, 100% { opacity: 0; } 40% { opacity: .22; } }
.flame, .fire-tongue, .fireglow { animation: flick 2.4s ease-in-out infinite; }
@keyframes flick { 0%, 100% { opacity: 1; } 22% { opacity: .78; } 48% { opacity: .93; } 70% { opacity: .82; } }
.smoke { animation: smoke 6s ease-in-out infinite; }
@keyframes smoke { 0%, 100% { opacity: .2; } 50% { opacity: .45; } }

/* title card between scenes */
.titlecard { position: fixed; inset: 0; z-index: 70; display: grid; place-content: center; justify-items: center; gap: 0.6rem; padding: 2rem; text-align: center; background: #0b0907; cursor: pointer; animation: tcIn 0.5s ease both; }
.titlecard.out { animation: tcOut 0.7s ease forwards; }
@keyframes tcIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes tcOut { to { opacity: 0; visibility: hidden; } }
.tc-place { margin: 0; font-family: var(--f-label); font-size: 0.78rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--tallow); animation: rise 0.9s ease 0.15s both; }
.tc-title { margin: 0; font-family: var(--f-display); font-size: clamp(2.4rem, 7vw, 4.4rem); line-height: 1; color: var(--vellum); animation: rise 1s ease 0.3s both; text-wrap: balance; }
.tc-cite { margin: 0; font-family: var(--f-text); font-style: italic; color: var(--faded); animation: rise 1s ease 0.45s both; }

.page .glosses .gloss { margin-left: 0.8rem; }
.page .narr { font-size: 1.12rem; }
.page .ex-reveal.flash { animation: flash 1.2s ease; }
@keyframes flash { 0% { background: rgba(220, 174, 103, 0.14); } 100% { background: transparent; } }

/* ---------------------------------------------------------------- record */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(8, 6, 5, 0.6); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 50; width: min(30rem, 100%); display: flex; flex-direction: column; background: var(--soot-2); border-left: 1px solid var(--rule); transform: translateX(100%); visibility: hidden; transition: transform 0.35s cubic-bezier(.2, .7, .2, 1), visibility 0s linear 0.35s; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); box-shadow: -30px 0 60px rgba(0, 0, 0, 0.45); }
.drawer.open { transform: none; visibility: visible; transition: transform 0.35s cubic-bezier(.2, .7, .2, 1), visibility 0s; }
.drawer:focus { outline: none; }
.drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.2rem 0.4rem; }
.drawer-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 1.6rem; }
.tabs { display: flex; gap: 0.2rem; padding: 0 1rem; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; }
.tab { appearance: none; border: 0; border-bottom: 2px solid transparent; background: none; padding: 0.6rem 0.55rem; cursor: pointer; font-family: var(--f-label); font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--vellum); border-bottom-color: var(--tallow); }
.drawer-body { flex: 1; overflow-y: auto; padding: 1rem 1.2rem 2rem; display: grid; gap: 0.8rem; align-content: start; }
.drawer-lede { margin: 0; color: var(--faded); font-size: 0.95rem; }
.rec-who { margin: 0.8rem 0 0; font-family: var(--f-label); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--tallow); }
.rec-q { margin: 0; padding-left: 0.9rem; border-left: 1px solid var(--rule); }
.rec-q blockquote { margin: 0.2rem 0 0; font-family: var(--f-text); font-size: 0.98rem; line-height: 1.55; }
.rec-q blockquote p { margin: 0; }
.word-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "w b" "by b"; gap: 0 0.8rem; align-items: center; padding: 0.55rem 0; border-bottom: 1px dotted var(--rule); }
.word { grid-area: w; font-family: var(--f-text); font-size: 1.15rem; }
.word-by { grid-area: by; font-family: var(--f-label); font-size: 0.68rem; color: var(--dim); }
.word-row .btn { grid-area: b; }
.word-warn { margin: -0.2rem 0 0.2rem; padding: 0.5rem 0.7rem; border-left: 2px solid var(--wax); font-size: 0.9rem; color: var(--faded); }
.margin-dl { display: grid; grid-template-columns: 8rem minmax(0, 1fr); gap: 0.6rem 0.9rem; margin: 0; }
.margin-dl dt { font-family: var(--f-label); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); padding-top: 0.3rem; }
.margin-dl dd { margin: 0; font-size: 1.1rem; overflow-wrap: anywhere; }
.key-row { display: grid; gap: 0.2rem; padding: 0.6rem 0; border-bottom: 1px dotted var(--rule); }
.key-row p { margin: 0; color: var(--faded); font-size: 0.95rem; }
.key-extra { margin: 0.6rem 0 0; color: var(--faded); font-size: 0.95rem; }

.toast { position: fixed; left: 50%; bottom: calc(1.2rem + env(safe-area-inset-bottom, 0px)); z-index: 60; transform: translate(-50%, 1rem); max-width: calc(100% - 32px); padding: 0.65rem 1rem; background: #241e18; border: 1px solid #36404a; color: var(--glass); font-family: var(--f-label); font-size: 0.78rem; letter-spacing: 0.03em; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------------------------------------------------------------- narrow screens */
@media (max-width: 900px) {
  .stage { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .art-wrap { position: relative; top: 0; height: clamp(15rem, 42vh, 24rem); }
  .art-wrap::after { inset: auto 0 0 0; width: 100%; height: 35%; background: linear-gradient(180deg, rgba(21, 17, 14, 0), var(--soot)); }
  .panel { padding-block: 1.4rem 4rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (max-width: 700px) {
  .landing { grid-template-columns: minmax(0, 1fr); justify-items: start; gap: 2rem; padding-block: 3rem; }
  .door { width: 4.2rem; }
  .story { padding-block: 2.2rem 5rem; }
  .scene-title { font-size: 2rem; }
  .quote blockquote { font-size: 1.08rem; }
  .narr { font-size: 1.06rem; }
  .reading-grid, .witnesses { grid-template-columns: minmax(0, 1fr); }
  .after-dl { grid-template-columns: minmax(0, 1fr); gap: 0.3rem; }
  .after-dl dd { margin-bottom: 0.8rem; }
  .bar-place { display: none; }

  .drawer.open { transform: none; }
  .glass-panes { grid-template-columns: minmax(0, 1fr); gap: 0.4rem; }
  .glass-line { height: 1px; background: linear-gradient(90deg, transparent, var(--glass), transparent); }
  .pane.her { text-align: left; }
  .acts li { grid-template-columns: minmax(0, 1fr); gap: 0.2rem; }
  .room { grid-template-columns: minmax(0, 1fr); }
  .catalogue { padding: 1.3rem 1.2rem 1.4rem; }

}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-delay: 0ms !important; transition-duration: 0.001ms !important; }
  .struckline::after { width: 104%; }
  .door-light, .case-glow, .spine-flame { animation: none; }
}

<script>
/* ---- engine.js ---- */
/* Unwriting Her: engine and interface.
   Stories register themselves with UH.registerStory(); the shelf with UH.registerShelf().
   Nothing in this file knows about any particular novel. */
(function () {

    const n = ember ? 34 : 42;
    const ps = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * Hh, r: Math.random() * (ember ? 1.8 : 1.4) + 0.4, vx: (Math.random() - 0.5) * (ember ? 0.35 : 0.12), vy: ember ? -(Math.random() * 0.6 + 0.25) : (Math.random() - 0.5) * 0.08, a: Math.random() * 0.35 + 0.05, t: Math.random() * 6 }));
    let last = 0;
    const tick = ts => {
      if (!canvasEl || !document.body.contains(c)) return stopMotes();
      if (ts - last > 33) {
        last = ts;
        if (Math.abs(c.getBoundingClientRect().width - W) > 2) size();
        ctx.clearRect(0, 0, W, Hh);
        ps.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.t += 0.03;
          if (ember && p.y < -10) { p.y = Hh + 10; p.x = Math.random() * W; }
          if (!ember) { if (p.x < -5) p.x = W + 5; if (p.x > W + 5) p.x = -5; if (p.y < -5) p.y = Hh + 5; if (p.y > Hh + 5) p.y = -5; }
          const alpha = ember ? p.a * Math.max(0, Math.min(1, p.y / Hh * 1.4)) + 0.05 : p.a * (0.6 + 0.4 * Math.sin(p.t));

          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();

  /* ------------------------------------------------------------ burn */
  function renderBurn(b) {
    const { s } = cur;
    if (s.flags.includes('burned')) return el('div', { class: 'blk burned', 'aria-hidden': 'true' });
    const wrap = el('div', { class: 'blk burn', 'aria-label': 'The passages written about her are burning.' });
    const phrases = b.phrases.map(p => el('p', { class: 'bphrase' + (p.startsWith('Reader') ? ' last' : '') },
      [...p].map(ch => el('span', { class: 'bch', text: ch }))));
    const skip = el('button', { type: 'button', class: 'btn quiet small skip', onclick: finish }, 'Skip');
    wrap.append(...phrases, skip);
    let done = false, timers = [];
    function finish() {
      if (done) return; done = true;
      timers.forEach(clearTimeout);
      helpers.flag('burned'); save();
      refreshBeat();
    }
    if (reduceMotion) { setTimeout(finish, 0); return wrap; }
    phrases.forEach((p, k) => {
      const start = 900 + k * 650 + (p.classList.contains('last') ? 1400 : 0);
      [...p.children].forEach(ch => ch.style.setProperty('--d', Math.round(Math.random() * 700) + 'ms'));
      timers.push(setTimeout(() => p.classList.add('burning'), start));
    });
    timers.push(setTimeout(finish, 900 + phrases.length * 650 + 1400 + 2600));
    return wrap;
  }

  /* ------------------------------------------------------------ afterword */
  function renderAfterword() {
    const { story, s } = cur;
    const rows = story.afterword(s);
    const dl = el('dl', { class: 'after-dl' });
    rows.forEach(r => {
      const dd = el('dd', {});
      if (r.text) dd.append(el('p', { html: inline(r.text, s) }));
      if (r.voice) {
        if (s.voice.mode === 'tiles') dd.append(statement(s.voice.tiles));
        if (s.voice.mode === 'write') dd.append(el('div', { class: 'margin-text hand', text: s.voice.text }));
      }
      if (r.readings) {
        if (r.readings.length) dd.append(el('ul', { class: 'readings-list' }, r.readings.map(([a, v]) => el('li', {}, el('span', { text: a }), el('span', { class: 'hand', text: v })))));
      }
      if (r.note) dd.append(el('p', { class: 'after-note', html: inline(r.note, s) }));
      dl.append(el('dt', { text: r.label }), dd);
    });
    const ends = (store.endings[story.id] || []).map(e => story.endings[e]);
    return el('section', { class: 'blk afterword' },
      el('p', { class: 'kicker', text: 'Ending · ' + (story.endings[s.ending] || '') }),
      el('h2', { class: 'after-title', text: 'What you made of her' }),
      dl,
      el('p', { class: 'after-ends', text: `Endings you have reached: ${ends.join(' · ')}. There are ${Object.keys(story.endings).length}.` }));
  }

  /* ============================================================ RECORD */
  let drawerTab = 'testimony';
  function toggleDrawer(open, tab) {
    if (tab) drawerTab = tab;
    if (open) { renderDrawer(); drawer.classList.add('open'); scrim.hidden = false; recBtn.setAttribute('aria-expanded', 'true'); drawer.focus({ preventScroll: true }); }
    else { drawer.classList.remove('open'); scrim.hidden = true; recBtn.setAttribute('aria-expanded', 'false'); recBtn.focus({ preventScroll: true }); }
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && drawer && drawer.classList.contains('open')) toggleDrawer(false); });

  function renderDrawer() {
    const { story, s } = cur;
    drawer.innerHTML = '';
    const tabs = [['testimony', 'Testimony'], ['notes', 'Notes'], ['glass', 'Glass'], ['words', 'Words'], ['margin', 'Margin'], ['key', 'Key']];
    const tabRow = el('div', { class: 'tabs', role: 'tablist' }, tabs.map(([k, label]) => el('button', { type: 'button', role: 'tab', class: 'tab', 'aria-selected': String(drawerTab === k), onclick: () => { drawerTab = k; renderDrawer(); } }, label)));
    const body = el('div', { class: 'drawer-body', role: 'tabpanel' });
    drawer.append(
      el('div', { class: 'drawer-head' }, el('h2', { text: 'The Record' }), el('button', { type: 'button', class: 'btn quiet small', onclick: () => toggleDrawer(false) }, 'Close')),
      tabRow, body);

    if (drawerTab === 'testimony') {
      const qs = s.record.filter(r => r.k === 'q');
      body.append(el('p', { class: 'drawer-lede', text: 'Every passage from the novel you have read, grouped by who is speaking.' }));
      if (!qs.length) body.append(el('p', { class: 'empty', text: 'Nothing yet.' }));
      const groups = {};
      qs.forEach(r => { (groups[r.who || 'Unattributed'] = groups[r.who || 'Unattributed'] || []).push(r); });
      Object.keys(groups).forEach(who => {
        body.append(el('h3', { class: 'rec-who', text: who }));
        groups[who].forEach(r => body.append(el('figure', { class: 'rec-q' }, el('figcaption', { class: 'cap' }, el('span', { text: r.cite })), el('blockquote', { html: rich(r.text, s, story, false) }))));
      });
    }
    if (drawerTab === 'notes') {
      const gs = s.record.filter(r => r.k === 'g' && r.tier !== 'margin');
      body.append(el('p', { class: 'drawer-lede', text: 'Notes you opened and notes the story set down, marked by kind.' }));
      if (!gs.length) body.append(el('p', { class: 'empty', text: 'Nothing yet. Open a phrase with a dotted underline.' }));
      gs.forEach(r => body.append(el('aside', { class: 'gloss', 'data-tier': r.tier },
        el('p', { class: 'gloss-cap' }, el('span', { class: 'cap-tier', 'data-tier': r.tier, text: TIER[r.tier] }), r.by ? el('span', { text: r.by }) : null),
        el('div', { class: 'gloss-body', html: rich(r.text, s, story, false) }))));
    }
    if (drawerTab === 'glass') {
      body.append(el('p', { class: 'drawer-lede', text: 'Each time she is described, someone else is standing beside her. These are the pairs you have found: what is said of her, and what it lets someone else become.' }));
      if (!s.reflections.length) body.append(el('p', { class: 'empty', text: 'The glass is empty so far.' }));
      s.reflections.forEach(id => body.append(renderGlass(story.reflections[id])));
    }
    if (drawerTab === 'words') {
      body.append(el('p', { class: 'drawer-lede', text: 'Words used of her in the passages you have read. Strike one and it will be drawn struck through wherever it appears from now on. The novel will still say it.' }));
      const avail = story.lexicon.filter(l => l.in.some(sc => s.visited.includes(sc)));
      if (!avail.length) body.append(el('p', { class: 'empty', text: 'None yet.' }));
      avail.forEach(l => {
        const on = s.struck.includes(l.w);
        const row = el('div', { class: 'word-row' + (on ? ' on' : '') },
          el('span', { class: 'word', html: on ? `<s class="struck">${esc(l.w)}</s>` : esc(l.w) }),
          el('span', { class: 'word-by', text: l.by }),
          el('button', { type: 'button', class: 'btn quiet small', 'aria-pressed': String(on), onclick: () => {
            s.struck = on ? s.struck.filter(x => x !== l.w) : s.struck.concat(l.w);
            save(); const y = window.scrollY; renderStory(); window.scrollTo(0, y); renderDrawer();
          } }, on ? 'Restore' : 'Strike'));
        body.append(row);
        if (on && l.identity) body.append(el('p', { class: 'word-warn', text: `This word is not an insult. It names ${l.identity}. Striking it removes something true about her along with the way she was described.` }));
      });
    }
    if (drawerTab === 'margin') {
      const labels = story.readLabels;
      body.append(el('p', { class: 'drawer-lede', text: 'What you have written into the record so far, in your own hand.' }));
      const rows = [];
      if (s.role) rows.push(['You came as', ({ reader: 'a reader', judge: 'a judge', rescuer: 'a rescuer' })[s.role]]);
      Object.keys(s.readings).forEach(k => rows.push(['Reading · ' + k, (labels[s.readings[k]] || s.readings[k])]));
      if (s.finding) rows.push(['Finding', s.finding]);
      if (s.name) rows.push(['Her name', ({ bertha: 'Bertha', mrs: 'Mrs. Rochester', antoinetta: 'Antoinetta', none: 'no name' })[s.name]]);
      if (s.voice.mode === 'tiles' || s.voice.mode === 'write') rows.push(['Her testimony', s.voice.text]);
      if (s.voice.mode === 'silence') rows.push(['Her testimony', 'left blank']);
      if (!rows.length) body.append(el('p', { class: 'empty', text: 'Nothing yet.' }));
      body.append(el('dl', { class: 'margin-dl' }, rows.map(([a, b]) => [el('dt', { text: a }), el('dd', { class: 'hand', text: b })])));
    }
    if (drawerTab === 'key') {
      body.append(el('p', { class: 'drawer-lede', text: 'Every passage and note is marked by where it comes from, so you can tell the novel from what has been said about it, and both from what this game invents.' }));
      const key = [
        ['text', 'Quoted word for word from the novel, or from Brontë’s 1848 letter. Ellipses mark cuts.'],
        ['annotation', 'This game’s reading of the passage. An argument, not a fact; test it against the text.'],
        ['context', 'History outside the novel: law, medicine, empire.'],
        ['criticism', 'A named critic’s argument, paraphrased in a sentence or two.'],
        ['conjecture', 'Invented here. Not in the novel and not claimed to be.'],
        ['margin', 'Your own words and choices.']
      ];
      key.forEach(([t, d]) => body.append(el('div', { class: 'key-row' }, el('span', { class: 'cap-tier', 'data-tier': t, text: TIER[t] }), el('p', { text: d }))));
      body.append(el('p', { class: 'key-extra' }, 'Phrases with a ', el('span', { class: 'clue demo', text: 'dotted underline' }), ' open notes. ', el('span', { class: 'struck', text: 'Struck' }), ' words are ones you have objected to under “Words.” Pairs marked “In the glass” are collected under “Glass.”'));
    }
  }

  /* ============================================================ ROUTING */
  function navigate(hash) {
    const target = hash ? '#' + hash : '';
    if (location.hash === target || (target === '' && !location.hash)) route();
    else location.hash = target;
  }
  function route() {
    const h = location.hash.replace(/^#/, '');
    if (h === 'reading-room') showHub();
    else if (UH.stories[h]) openStory(h);
    else showLanding();
  }
  window.addEventListener('hashchange', route);
  UH._debug = { get state() { return cur && cur.s; }, go: id => go(id), store: () => store };
  route();
});

</script>
<script>
/* ---- art.js ---- */
/* Unwriting Her: scene art.
   Each entry returns an SVG drawn like an etching in candlelight. Elements with
   data-ex="<id>" are objects the player can examine; data-go="<scene>" are doors to other scenes.
   Art reacts to state through classes the engine sets on the stage (beat-N, flags). */
(function () {
  const UH = window.UH;
  const INK = '#6e5c47', FAINT = '#3a3028', DEEP = '#0b0907', TALLOW = '#dcae67', GLASS = '#aac3db', WAX = '#c55c4c';
  const f = n => (Math.round(n * 10) / 10).toString();
  const poly = pts => pts.map(p => f(p[0]) + ',' + f(p[1])).join(' ');
  function rng(seed) { let x = seed; return () => { x = (x * 16807) % 2147483647; return (x - 1) / 2147483646; }; }
  // one-point perspective
  const P = (X, Y, Z, fl = 520, cx = 500, cy = 470) => [cx + fl * X / Z, cy - fl * Y / Z];

  const DEFS = `<defs>
    <radialGradient id="g-candle" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="${TALLOW}" stop-opacity=".55"/><stop offset=".35" stop-color="${TALLOW}" stop-opacity=".16"/><stop offset="1" stop-color="${TALLOW}" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-moon" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="${GLASS}" stop-opacity=".5"/><stop offset=".4" stop-color="${GLASS}" stop-opacity=".12"/><stop offset="1" stop-color="${GLASS}" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-fire" cx="50%" cy="60%" r="55%"><stop offset="0" stop-color="#f0b45e" stop-opacity=".85"/><stop offset=".3" stop-color="${WAX}" stop-opacity=".45"/><stop offset="1" stop-color="${WAX}" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-vig" cx="50%" cy="48%" r="72%"><stop offset=".45" stop-color="${DEEP}" stop-opacity="0"/><stop offset="1" stop-color="${DEEP}" stop-opacity=".92"/></radialGradient>
    <linearGradient id="g-glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c232b"/><stop offset=".45" stop-color="#0d1014"/><stop offset=".55" stop-color="#151b22"/><stop offset="1" stop-color="#090b0e"/></linearGradient>
    <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0e13"/><stop offset=".7" stop-color="#16161a"/><stop offset="1" stop-color="#1d1915"/></linearGradient>
    <linearGradient id="g-dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101318"/><stop offset=".55" stop-color="#2a2420"/><stop offset=".7" stop-color="#5a3f2c"/><stop offset="1" stop-color="#14100d"/></linearGradient>
    <radialGradient id="g-dark" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#030202" stop-opacity=".98"/><stop offset=".6" stop-color="#050404" stop-opacity=".8"/><stop offset="1" stop-color="#050404" stop-opacity="0"/></radialGradient>
    <linearGradient id="g-shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${DEEP}" stop-opacity="0"/><stop offset="1" stop-color="${DEEP}" stop-opacity=".95"/></linearGradient>
    <filter id="f-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="f-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="f-grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .9  0 0 0 0 .8  0 0 0 0 .65  0 0 0 .035 0"/></filter>
  </defs>`;
  const svg = (body, label, fit) => `<svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${label}">${DEFS}<rect width="1000" height="1000" fill="#110e0b"/>${fit ? `<g transform="translate(500 600) scale(${fit}) translate(-500 -600)">${body}</g>` : body}<rect width="1000" height="1000" fill="url(#g-vig)" pointer-events="none"/><rect width="1000" height="1000" filter="url(#f-grain)" pointer-events="none"/></svg>`;
  const glow = (cx, cy, r, id = 'g-candle', cls = '') => `<circle class="${cls}" cx="${cx}" cy="${cy}" r="${r}" fill="url(#${id})" pointer-events="none"/>`;
  const flame = (x, y, s = 1) => `<g class="flame" transform="translate(${x} ${y}) scale(${s})"><path d="M0,-34 C9,-20 10,-8 0,0 C-10,-8 -9,-20 0,-34Z" fill="${TALLOW}" opacity=".95"/><path d="M0,-22 C4,-14 4,-6 0,-2 C-4,-6 -4,-14 0,-22Z" fill="#fff3d6" opacity=".8"/></g>`;
  const candle = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-9" y="0" width="18" height="70" fill="#cfc2a6" opacity=".75"/><path d="M-26,72 h52 l-6,10 h-40z" fill="none" stroke="${INK}" stroke-width="2"/><line x1="0" y1="0" x2="0" y2="-6" stroke="#222" stroke-width="2"/>${flame(0, -4)}</g>`;
  const hot = (id, inner, kind = 'ex') => kind === 'none' ? `<g>${inner}</g>` : `<g class="hot" data-${kind}="${id}" tabindex="0" role="button" aria-label="${id}">${inner}</g>`;

  /* -------------------------------------------------- corridor */
  function corridor(s, beat, opts = {}) {
    const near = 0.62, far = 7;
    let b = '';
    // walls, floor, ceiling edges
    [[-1, -1], [1, -1], [-1, 1.25], [1, 1.25]].forEach(([X, Y]) => { const a = P(X, Y, near), c = P(X, Y, far); b += `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(c[0])}" y2="${f(c[1])}" stroke="${INK}" stroke-width="1.4"/>`; });
    const fw = [P(-1, -1, far), P(1, -1, far), P(1, 1.25, far), P(-1, 1.25, far)];
    b += `<polygon points="${poly(fw)}" fill="#0e0c0a" stroke="${INK}" stroke-width="1.2"/>`;
    const win = [P(-0.26, 0, far), P(0.26, 0, far), P(0.26, 0.78, far), P(-0.26, 0.78, far)];
    b += glow(500, 440, 120, 'g-moon') + `<polygon points="${poly(win)}" fill="#24303c" stroke="${GLASS}" stroke-width="1" opacity=".9"/>`;
    b += `<line x1="500" y1="${f(win[0][1])}" x2="500" y2="${f(win[2][1])}" stroke="#0e0c0a" stroke-width="1.5"/>`;
    // floorboards
    [-0.6, -0.2, 0.2, 0.6].forEach(X => { const a = P(X, -1, near), c = P(X, -1, far); b += `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(c[0])}" y2="${f(c[1])}" stroke="${FAINT}" stroke-width="1"/>`; });
    // moonlight on floor
    b += `<polygon points="${poly([P(-0.26, -1, far), P(0.26, -1, far), P(0.5, -1, 2.2), P(-0.5, -1, 2.2)])}" fill="${GLASS}" opacity=".05"/>`;
    // doors
    const zs = [1.35, 2.35, 3.35, 4.35, 5.35];
    [-1, 1].forEach(X => zs.forEach((z, k) => {
      const d = [P(X, -1, z), P(X, -1, z + 0.45), P(X, 0.55, z + 0.45), P(X, 0.55, z)];
      const isLaugh = X === 1 && k === 2;
      const shape = `<polygon points="${poly(d)}" fill="#070605" stroke="#4a3d30" stroke-width="1.3"/>`;
      if (isLaugh) {
        const s1 = P(X, -0.985, z), s2 = P(X, -0.985, z + 0.45);
        const seam = `<line class="seam" x1="${f(s1[0])}" y1="${f(s1[1])}" x2="${f(s2[0])}" y2="${f(s2[1])}" stroke="${TALLOW}" stroke-width="3"/><line class="seam seam-glow" x1="${f(s1[0])}" y1="${f(s1[1])}" x2="${f(s2[0])}" y2="${f(s2[1])}" stroke="${TALLOW}" stroke-width="10" filter="url(#f-glow)"/>`;
        if (opts.open) {
          const o = [P(X, -1, z), P(X - 0.42, -1, z + 0.05), P(X - 0.42, 0.55, z + 0.05), P(X, 0.55, z)];
          b += `<polygon points="${poly(d)}" fill="${TALLOW}" opacity=".35"/><polygon points="${poly([P(X, -1, z), P(X, -1, z + 0.45), P(0.1, -1, z + 0.2), P(0.2, -1, z - 0.4)])}" fill="${TALLOW}" opacity=".12"/><polygon points="${poly(o)}" fill="#0a0807" stroke="#4a3d30" stroke-width="1.3"/>`;
        } else b += hot('door', shape + seam, 'hotd');
      } else b += shape;
      const kn = P(X, -0.2, z + (X < 0 ? 0.36 : 0.36));
      b += `<circle cx="${f(kn[0])}" cy="${f(kn[1])}" r="${f(18 / z)}" fill="#3a3028"/>`;
    }));
    if (opts.keys) b += `<g transform="translate(470 900)"><circle r="16" fill="none" stroke="${TALLOW}" stroke-width="2.5"/><line x1="12" y1="10" x2="60" y2="34" stroke="${TALLOW}" stroke-width="3"/><line x1="44" y1="26" x2="40" y2="40" stroke="${TALLOW}" stroke-width="3"/></g>`;
    b += glow(500, 980, 420);
    return svg(b, 'A long, low corridor of small black doors with one little window at the far end');
  }

  /* -------------------------------------------------- roof */
  function leads(s, beat, opts = {}) {
    const r = rng(7);
    let b = `<rect width="1000" height="1000" fill="url(#g-sky)"/>`;
    for (let i = 0; i < 70; i++) b += `<circle cx="${f(r() * 1000)}" cy="${f(r() * 520)}" r="${f(r() * 1.6 + 0.4)}" fill="#d9d3c4" opacity="${f(r() * 0.5 + 0.15)}"/>`;
    b += glow(760, 170, 160, 'g-moon') + `<circle cx="760" cy="170" r="34" fill="#cfd8df" opacity=".75"/>`;
    b += `<path d="M0,610 C120,580 220,600 330,585 C450,568 560,600 680,590 C800,578 900,596 1000,585 L1000,700 L0,700Z" fill="#14130f"/>`;
    b += `<path d="M0,640 C150,625 260,648 400,636 C560,622 700,650 1000,632 L1000,720 L0,720Z" fill="#100f0c"/>`;
    for (let i = 0; i < 9; i++) b += `<path d="M${f(-50 + i * 130)},${f(660 + i % 3 * 6)} Q${f(30 + i * 130)},${f(650 + i % 2 * 8)} ${f(110 + i * 130)},${f(668)}" stroke="${FAINT}" fill="none"/>`;
    // battlements
    let cren = 'M0,1000 L0,770 ';
    for (let x = 0; x < 1000; x += 120) cren += `L${x},770 L${x},720 L${x + 70},720 L${x + 70},770 `;
    cren += 'L1000,770 L1000,1000Z';
    b += `<path d="${cren}" fill="#0c0a08" stroke="${INK}" stroke-width="1.4"/>`;
    for (let y = 800; y < 1000; y += 34) b += `<line x1="0" y1="${y}" x2="1000" y2="${y}" stroke="${FAINT}" stroke-width=".8"/>`;
    if (opts.fire) {
      b += glow(500, 1000, 700, 'g-fire', 'fireglow') + `<path d="M0,1000 L0,770 L1000,770 L1000,1000Z" fill="${WAX}" opacity=".1"/>`;
      b += `<path class="smoke" d="M300,720 C320,600 260,520 330,420 C380,350 340,260 400,180" stroke="#5a4d40" stroke-width="40" fill="none" opacity=".18" filter="url(#f-soft)"/>`;
    } else {
      b += `<polygon points="440,880 560,880 590,960 410,960" fill="#060504" stroke="${INK}" stroke-width="1.2"/>`;
      b += `<polygon class="trap-glow" points="440,880 560,880 590,960 410,960" fill="${TALLOW}" opacity="0"/>`;
    }
    return svg(b, opts.fire ? 'The battlements against a sky lit by fire' : 'The flat lead roof at night, with battlements, fields and a dim sky-line');
  }

  /* -------------------------------------------------- the gallery of witnesses */
  function gallery(s) {
    const order = ['rochester', 'mason', 'grace', 'jane', 'register', 'host', 'author', 'bertha'];
    const names = { rochester: 'ROCHESTER', mason: 'MASON', grace: 'POOLE', jane: 'EYRE', register: 'THE REGISTER', host: 'THE LANDLORD', author: 'BRONTË', bertha: '' };
    const story = UH.stories.bertha;
    let b = `<rect x="0" y="0" width="1000" height="1000" fill="#120f0c"/><line x1="0" y1="935" x2="1000" y2="935" stroke="${INK}"/>`;
    for (let x = 0; x < 1000; x += 90) b += `<line x1="${x}" y1="935" x2="${x}" y2="1000" stroke="${FAINT}"/>`;
    order.forEach((id, i) => {
      const col = i % 3, row = Math.floor(i / 3);
      const w = 168, h = 196, x = 205 + col * 210 + (row === 2 ? 105 : 0), y = 110 + row * 285;
      const heard = s.heard.includes(id);
      const w0 = story && story.witnesses.find(w => w.id === id);
      let fr = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#0a0807" stroke="${INK}" stroke-width="3"/><rect x="${x + 12}" y="${y + 12}" width="${w - 24}" height="${h - 24}" fill="url(#g-glass)" stroke="#4a3d30" stroke-width="1.2" opacity=".9"/>`;
      fr += `<line x1="${x + 30}" y1="${y + 30}" x2="${x + 70}" y2="${y + 80}" stroke="${GLASS}" stroke-width="1" opacity=".18"/>`;
      if (id === 'bertha') {

    b += `<rect x="560" y="470" width="80" height="110" fill="#2a231c" stroke="${INK}" stroke-width="2"/><path d="M595,500 a8,8 0 1 1 10,0 l4,30 h-18z" fill="#050404"/><g transform="translate(600 520)"><line x1="0" y1="0" x2="-60" y2="40" stroke="${TALLOW}" stroke-width="4"/><circle cx="-70" cy="48" r="14" fill="none" stroke="${TALLOW}" stroke-width="3"/></g>`;

    b += `<path d="M120,640 L120,560 L150,560 L150,500 L162,480 L174,500 L174,560 L240,560 L240,640Z" fill="#0b0908" stroke="${INK}"/><text x="180" y="610" text-anchor="middle" font-family="IM Fell English, serif" font-size="30" fill="#ab9f88">——</text>`;
    b += `<path d="M820,640 C818,590 826,560 834,520" stroke="#0b0908" stroke-width="6" fill="none"/><path d="M834,520 C800,505 780,512 765,525 M834,520 C860,500 885,505 900,522 M834,520 C830,490 812,478 800,476 M834,520 C850,494 870,488 884,490" stroke="#0b0908" stroke-width="5" fill="none"/>`;
    return svg(b, 'A dawn sea, and on the shore a small church whose name is a dash');
  }
  function book() {
    let b = `<rect width="1000" height="1000" fill="#110e0b"/><polygon points="80,660 920,660 1000,1000 0,1000" fill="#1a1410" stroke="${INK}"/>`;
    b += `<g transform="translate(500 640) rotate(-3)"><rect x="-230" y="-60" width="460" height="70" fill="#2a1f17" stroke="${INK}" stroke-width="2"/><rect x="-224" y="-48" width="448" height="12" fill="#d8ccb2" opacity=".5"/><rect x="-224" y="-30" width="448" height="12" fill="#d8ccb2" opacity=".4"/><path d="M120,10 L120,90 L134,78 L148,90 L148,10" fill="${WAX}" opacity=".7"/></g>`;
    b += glow(780, 560, 260) + candle(790, 520, 0.7);
    return svg(b, 'A closed book on a table, with a ribbon marking a page');
  }
  function glass() {
    let b = `<rect width="1000" height="1000" fill="#0c0a08"/><rect x="300" y="60" width="400" height="880" rx="6" fill="#0a0807" stroke="${INK}" stroke-width="6"/><rect x="322" y="82" width="356" height="836" fill="url(#g-glass)" stroke="#4a3d30"/>`;
    b += `<path d="M350,120 L450,360" stroke="${GLASS}" stroke-width="2" opacity=".16"/><path d="M360,140 L420,290" stroke="${GLASS}" stroke-width="1" opacity=".24"/>`;
    b += glow(500, 520, 420, 'g-moon') + glow(170, 820, 220) + candle(170, 780, 0.7);
    return svg(b, 'A tall dark oblong glass in a heavy frame');
  }
  function threshold() {
    let b = `<rect width="1000" height="1000" fill="#0c0a08"/><rect x="390" y="180" width="220" height="560" fill="#0f0c0a" stroke="#3b3229" stroke-width="2"/><rect x="404" y="194" width="192" height="532" fill="none" stroke="#2c241d"/><circle cx="570" cy="470" r="6" fill="#4a3e31"/>`;
    b += `<line class="seam" x1="392" y1="741" x2="608" y2="741" stroke="${TALLOW}" stroke-width="4"/><line class="seam seam-glow" x1="392" y1="745" x2="608" y2="745" stroke="${TALLOW}" stroke-width="14" filter="url(#f-glow)"/>`;
    b += `<polygon points="392,745 608,745 760,1000 240,1000" fill="${TALLOW}" opacity=".06"/>`;
    return svg(b, 'A closed door with light beneath it');
  }

  UH.art = {
    threshold, corridor, leads, gallery, attic: (s, b) => room(s, b), room: roomInspect,

    door: (s, b) => corridor(s, b, { open: true }), keeper: lock, roof: (s, b) => leads(s, b, { fire: true }),
    void: voidCandle, shore, book, glass
  };
})();
